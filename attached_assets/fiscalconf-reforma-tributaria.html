const moeda = v => v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct   = (v,d=2) => v.toFixed(d)+'%';
const numParse = s => { const n=parseFloat(String(s).replace(/\./g,'').replace(',','.')); return isNaN(n)?0:n; };

function getFaixa(faixas, rbt12) {
  return faixas.find(f => rbt12>=f[0] && rbt12<=f[1]) || faixas[faixas.length-1];
}
function aliqEfetivaSN(rbt12, f) {
  if(rbt12===0) return f[2]/100;
  return (rbt12*(f[2]/100)-f[3])/rbt12;
}

// ════════════════════════════════════════════════════════════════
// MOTOR DE CÁLCULO — SIMPLES NACIONAL
// ════════════════════════════════════════════════════════════════
function calcSN(rbt12, receita, anexo, icmsIssAliq, ano) {
  const tab = ANEXOS[anexo];
  const f   = getFaixa(tab.faixas, rbt12);
  const fi  = tab.faixas.indexOf(f);
  const aliqEf = aliqEfetivaSN(rbt12, f);
  const das = receita * aliqEf;
  const d   = tab.dist[Math.min(fi, tab.dist.length-1)];
  // d: [IRPJ,CSLL,COFINS,PIS,CPP,ICMS,ISS] (% dentro do DAS)
  const pisCofinsPerc = (d[2]+d[3])/100;
  const icmsIssPerc   = (d[5]+d[6])/100;
  const cppEtcPerc    = (d[0]+d[1]+d[4])/100;
  const cn = CRONOGRAMA[ano];

  const pisCofinsNoDAS = cn.pisExt ? 0 : das*pisCofinsPerc;
  const icmsIssNoDAS   = das * icmsIssPerc * (cn.icmsIssPerc/100);
  const cppEtc         = das * cppEtcPerc;
  const dasEf          = cppEtc + pisCofinsNoDAS + icmsIssNoDAS;

  // CBS fora do DAS (a partir de 2029)
  const cbs = (!cn.pisExt || ano<2029) ? 0 : receita*(cn.cbsAliq/100);
  const ibs = ano>=2029 ? receita*(cn.ibsAliq/100) : 0;
  const total = dasEf + cbs + ibs;

  return { das:dasEf, icmsIss:icmsIssNoDAS, pisCofins:pisCofinsNoDAS, cppEtc,
           cbs, ibs, total, aliqEf:receita>0?total/receita:0,
           faixaIdx:fi+1, aliqNominal:f[2] };
}

// ════════════════════════════════════════════════════════════════
// MOTOR DE CÁLCULO — LUCRO PRESUMIDO
// ════════════════════════════════════════════════════════════════
function calcLP(receita, atividade, icmsIssAliq, percCompras, ano) {
  const cn = CRONOGRAMA[ano];
  const presIRPJ = atividade==='servicos' ? 32 : 8;
  const presCSLL = atividade==='servicos' ? 32 : 12;
  const baseIRPJ = receita*(presIRPJ/100);
  const baseCSLL = receita*(presCSLL/100);
  const irpj = baseIRPJ*0.15 + Math.max(0,baseIRPJ-240000)*0.10;
  const csll = baseCSLL*0.09;
  const pis    = cn.pisExt ? 0 : receita*0.0065;
  const cofins = cn.pisExt ? 0 : receita*0.030;
  const cbsBruta   = cn.pisExt ? receita*(cn.cbsAliq/100) : 0;
  const cbsCredito = cbsBruta*(percCompras/100);
  const cbsLiq     = Math.max(0,cbsBruta-cbsCredito);
  const icmsIss    = receita*(icmsIssAliq/100)*(cn.icmsIssPerc/100);
  const ibsBruta   = receita*(cn.ibsAliq/100);
  const ibsCredito = ibsBruta*(percCompras/100);
  const ibsLiq     = Math.max(0,ibsBruta-ibsCredito);
  const total = irpj+csll+pis+cofins+cbsLiq+icmsIss+ibsLiq;
  return { irpj,csll,pis,cofins,cbsBruta,cbsCredito,cbsLiq,icmsIss,
           ibsBruta,ibsCredito,ibsLiq,total,
           aliqEf:receita>0?total/receita:0,
           presIRPJ,presCSLL,baseIRPJ,baseCSLL };
}

const MESES_PT = {janeiro:1,fevereiro:2,'março':3,marco:3,abril:4,maio:5,junho:6,
  julho:7,agosto:8,setembro:9,outubro:10,novembro:11,dezembro:12,
  jan:1,fev:2,mar:3,abr:4,mai:5,jun:6,jul:7,ago:8,set:9,out:10,nov:11,dez:12};

function parseExcelFile(buffer) {
  const wb = XLSX.read(buffer,{type:'array'});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  const result = {};
  for(const row of rows) {
    if(!row||row.length<2) continue;
    const c0 = String(row[0]).trim();
    let valor = 0;
    for(let i=1;i<row.length;i++){
      const v=parseFloat(String(row[i]).replace(/[^\d,.\-]/g,'').replace(',','.'));
      if(!isNaN(v)&&v>0){valor=v;break;}
    }
    if(valor<=0) continue;
    // MM/AAAA
    const m1 = c0.match(/^(\d{1,2})[\/\-](\d{4})$/);
    if(m1){result[m1[1].padStart(2,'0')+'/'+m1[2]]=valor;continue;}
    // Nome mês + ano
    const m2 = c0.toLowerCase().match(/^([\wç]+)[.\s\/\-]*(\d{2,4})$/);
    if(m2){const mn=MESES_PT[m2[1]];if(mn){const a=m2[2].length===2?'20'+m2[2]:m2[2];result[String(mn).padStart(2,'0')+'/'+a]=valor;continue;}}
  }
  return result;
}

function downloadModeloExcel() {
  const now = new Date();
  const rows = [["Mês/Ano","Faturamento Bruto (R$)","Observação"]];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const mes=String(d.getMonth()+1).padStart(2,'0');
    const ano=d.getFullYear();
    rows.push([`${mes}/${ano}`,0,i===0?'← mês mais recente':'']);
  }
  rows.push([],[' INSTRUÇÕES:'],[' 1. Preencha a Coluna B com o faturamento BRUTO'],[' 2. NÃO altere a Coluna A (MM/AAAA)'],[' 3. Use apenas números na Coluna B (sem R$, pontos ou vírgulas)']);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols']=[{wch:14},{wch:26},{wch:36}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,'Faturamento 12 Meses');
  XLSX.writeFile(wb,'modelo-faturamento-12meses.xlsx');
}

function getMesKeys() {
  const now = new Date(), keys=[];
  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    keys.push(String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear());
  }
  return keys;
}
function mesLabel(k){
  const [m,a]=k.split('/');
  const ns=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return ns[parseInt(m)-1]+'/'+a;
}
function sortMeses(arr){
  return [...arr].sort((a,b)=>{
    const [ma,aa]=a.split('/'), [mb,ab]=b.split('/');
    return (Number(aa)*12+Number(ma))-(Number(ab)*12+Number(mb));
  });
}
function getRbt12(){ return Object.values(state.meses).reduce((a,b)=>a+b,0); }

      <span class="text-xs text-gray-500">RBT12: <b>${moeda(rbt12)}</b> · ${ANEXOS[state.anexo]?ANEXOS[state.anexo].label:''} · ${state.atividade==='servicos'?'Serviços':'Comércio'}</span>

    <div class="overflow-x-auto">
    <table class="w-full text-xs">
      <thead>
        <tr class="bg-gray-50 border-b">
          <th class="text-left px-3 py-2">Ano</th>
          <th class="px-3 py-2">Fase</th>
          ${isLP?`
          <th class="text-right px-3 py-2">IRPJ+CSLL</th>
          <th class="text-right px-3 py-2">PIS/COFINS</th>
          <th class="text-right px-3 py-2">CBS (líq.)</th>

          <th class="text-right px-3 py-2">IBS (líq.)</th>
          `:`
          <th class="text-right px-3 py-2">DAS</th>
          <th class="text-right px-3 py-2">CBS</th>
          <th class="text-right px-3 py-2">IBS</th>
          `}

          <th class="text-right px-3 py-2">Alíq. Ef.</th>
          <th class="text-right px-3 py-2">Var. vs 2026</th>
        </tr>
      </thead>
      <tbody>
        ${projecao.map((r,i)=>{
          const cn=CRONOGRAMA[r.ano];
          const delta=r.total-projecao[0].total;

            <td class="text-right px-3 py-2">${r.ibsLiq>0?`${moeda(r.ibsLiq)}<span class="text-green-600 ml-1">−${moeda(r.ibsCredito)}</span>`:'—'}</td>

  <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
    <div class="p-4 border-b bg-gray-50">
      <h3 class="font-semibold text-sm">Comparativo Simples Nacional × Lucro Presumido — 2026–2033</h3>
    </div>
    <div class="p-4 space-y-4">
      ${ANOS.map((ano,i)=>{
        const r_sn=snProj[i], r_lp=lpProj[i];
        const cn=CRONOGRAMA[ano];
        const melhorSN=r_sn.total<=r_lp.total;
        const diff=Math.abs(r_sn.total-r_lp.total);
        return `
        <div class="space-y-1">

            ${badge(cn.fase,cn.cor)}

            <span class="text-xs text-gray-400 w-14">SN</span>

              <div class="h-full rounded flex items-center justify-end pr-2 ${melhorSN?'bg-emerald-500':'bg-emerald-300'}" style="width:${Math.round(r_sn.total/maxVal*100)}%">

function render() {
  const rbt12 = getRbt12();
  const snProj = ANOS.map(ano=>({ano,...calcSN(rbt12,rbt12,state.anexo,state.icmsIssAliq,ano)}));
  const lpProj = ANOS.map(ano=>({ano,...calcLP(rbt12,state.atividade,state.icmsIssAliq,state.percCompras,ano)}));

  const tabs = [
    {id:'dados',label:'📥 Dados'},
    ...(state.regime!=='presumido'?[{id:'simples',label:'Simples Nacional'}]:[]),
    ...(state.regime!=='simples'?[{id:'presumido',label:'Lucro Presumido'}]:[]),
    ...(state.regime==='ambos'?[{id:'comparativo',label:'⚖️ Comparativo'}]:[]),
    {id:'cronograma',label:'📅 Cronograma'},
  ];

  const tabBtns = tabs.map(t=>`
    <button onclick="setState({tab:'${t.id}'})"
      class="px-4 py-2 text-sm font-medium rounded-t-lg border-b-2 transition-colors ${state.tab===t.id
        ?'border-blue-600 text-blue-600 bg-blue-50'
        :'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-50'}">
      ${t.label}
    </button>`).join('');

  let content='';
  if(state.tab==='dados') content=renderImport();
  else if(state.tab==='simples') content=rbt12>0?renderTabela('Projeção Simples Nacional — 2026 a 2033',snProj,'sn'):`<div class="bg-white rounded-xl border p-12 text-center text-gray-400">Importe os dados ou preencha o faturamento na aba Dados.</div>`;
  else if(state.tab==='presumido') content=rbt12>0?renderTabela('Projeção Lucro Presumido — 2026 a 2033',lpProj,'lp'):`<div class="bg-white rounded-xl border p-12 text-center text-gray-400">Importe os dados ou preencha o faturamento na aba Dados.</div>`;
  else if(state.tab==='comparativo') content=rbt12>0?renderComparativo(snProj,lpProj):`<div class="bg-white rounded-xl border p-12 text-center text-gray-400">Importe os dados ou preencha o faturamento na aba Dados.</div>`;
  else if(state.tab==='cronograma') content=renderCronograma();

  document.getElementById('app').innerHTML=`
    <!-- Cabeçalho -->
    <div class="flex items-center justify-between flex-wrap gap-3 no-print">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">
          🧾 FiscalConf — Reforma Tributária 2026–2033
        </h1>
        <p class="text-sm text-gray-500 mt-0.5">Simples Nacional · Lucro Presumido · CBS · IBS · IS — EC 132/2023 + LC 214/2025</p>
      </div>
      <div class="flex gap-2">
        ${rbt12>0?`<button onclick="setState({meses:{}})" class="px-3 py-1.5 border rounded text-sm text-red-600 hover:bg-red-50">✕ Limpar</button>`:''}
        <button onclick="window.print()" class="px-3 py-1.5 bg-blue-600 text-white rounded text-sm hover:bg-blue-700">🖨️ Imprimir</button>
      </div>
    </div>

    ${renderConfig()}

    <!-- Abas -->
    <div>
      <div class="flex gap-1 border-b no-print">${tabBtns}</div>
      <div class="mt-4 space-y-4">${content}</div>
    </div>

    <!-- Rodapé -->
    <p class="text-xs text-gray-400 text-center pb-6">
      Base legal: EC 132/2023 · LC 214/2025 · LC 123/2006 · Lei 9.430/1996 · RIR/2018 (Decreto 9.580/2018).
      CBS 8,8% e IBS 17,7% — alíquotas de referência sujeitas a ajuste pelo Senado e estados.
      Consulte seu contador para análise do caso concreto.
    </p>
  `;
}

// ════════════════════════════════════════════════════════════════
// EVENT HANDLERS
// ════════════════════════════════════════════════════════════════
function handleDrop(e) {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if(file) processFile(file);
}
function handleFileInput(input) {
  const file = input.files[0];
  if(file) processFile(file);
}
function processFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = parseExcelFile(e.target.result);
      if(Object.keys(data).length===0){
        alert('Nenhum dado encontrado. Verifique o formato:\n• Coluna A: MM/AAAA\n• Coluna B: Faturamento (número)');
      } else {
        setState({meses:data, tab:'dados'});
        alert(`✅ ${Object.keys(data).length} meses importados com sucesso!\n\nRBT12: ${moeda(Object.values(data).reduce((a,b)=>a+b,0))}`);
      }
    } catch(err) {
      alert('Erro ao processar arquivo: '+err.message);
    }
  };
  reader.readAsArrayBuffer(file);
}
function handleManualInput(key, val) {
  const v = numParse(val);
  const novo = {...state.meses};
  if(v<=0) delete novo[key]; else novo[key]=v;
  setState({meses:novo});
}

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
render();
</script>
