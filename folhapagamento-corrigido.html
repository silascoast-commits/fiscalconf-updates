<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folha de Pagamento</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary:#2563eb; --primary-light:#dbeafe;
      --green:#16a34a;   --green-light:#dcfce7; --green-bd:#86efac;
      --amber:#d97706;   --amber-light:#fef3c7; --amber-bd:#fcd34d;
      --purple:#7c3aed;  --purple-light:#ede9fe;
      --red:#dc2626;     --red-light:#fee2e2;
      --sky:#0284c7;     --sky-light:#e0f2fe;
      --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
      --gray-300:#d1d5db; --gray-400:#9ca3af; --gray-500:#6b7280;
      --gray-600:#4b5563; --gray-700:#374151; --gray-800:#1f2937; --gray-900:#111827;
      --r:10px; --sh:0 1px 4px rgba(0,0,0,.08);
    }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--gray-50); color:var(--gray-800); min-height:100vh; }

    /* ── Header ── */
    header { background:#fff; border-bottom:1px solid var(--gray-200); padding:0 24px; height:56px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:200; box-shadow:var(--sh); }
    .h-title { font-size:16px; font-weight:700; }
    .h-sub   { font-size:12px; color:var(--gray-400); margin-left:4px; }
    .h-emp   { margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--green-light); border:1px solid var(--green-bd); border-radius:8px; padding:4px 12px; font-size:13px; }
    .h-emp strong { color:var(--green); font-weight:700; }

    /* ── Tabs ── */
    .tabs { background:#fff; border-bottom:2px solid var(--gray-200); display:flex; padding:0 24px; }
    .tab  { padding:13px 18px; font-size:14px; font-weight:600; color:var(--gray-500); border:none; background:transparent; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:color .15s,border-color .15s; }
    .tab:hover { color:var(--gray-800); }
    .tab.on { color:var(--primary); border-bottom-color:var(--primary); }

    /* ── Main ── */
    main { max-width:960px; margin:0 auto; padding:24px 20px 60px; }

    /* ── Card ── */
    .card { background:#fff; border:1px solid var(--gray-200); border-radius:var(--r); box-shadow:var(--sh); margin-bottom:18px; }
    .card-hd { padding:13px 20px; border-bottom:1px solid var(--gray-100); display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .card-ti { font-size:15px; font-weight:600; display:flex; align-items:center; gap:8px; }
    .card-bd { padding:18px 20px; }

    /* ── Botões ── */
    .btn { display:inline-flex; align-items:center; gap:5px; padding:0 14px; height:34px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:opacity .15s; white-space:nowrap; }
    .btn:hover { opacity:.85; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-green   { background:var(--green);   color:#fff; }
    .btn-amber   { background:var(--amber);   color:#fff; }
    .btn-sky     { background:var(--sky);     color:#fff; }
    .btn-outline { background:#fff; color:var(--gray-700); border:1px solid var(--gray-300); }
    .btn-ghost   { background:transparent; color:var(--gray-500); border:none; }
    .btn-ghost:hover { background:var(--gray-100); }
    .btn-danger  { background:transparent; color:var(--red); border:none; }
    .btn-danger:hover { background:var(--red-light); }
    .btn-sm   { height:28px; padding:0 10px; font-size:12px; border-radius:6px; }
    .btn-icon { width:28px; height:28px; padding:0; justify-content:center; border-radius:6px; }

    /* ── Form ── */
    .fbox { background:var(--gray-50); border:1px solid var(--gray-200); border-radius:var(--r); padding:16px; margin-bottom:12px; }
    .ftitle { font-size:13px; font-weight:700; color:var(--gray-700); margin-bottom:12px; }
    .fg1 { display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:10px; }
    .fg2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
    .fg3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; }
    .fg4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:10px; margin-bottom:10px; }
    .ff  { display:flex; flex-direction:column; gap:4px; }
    .ff label { font-size:11px; font-weight:700; color:var(--gray-600); text-transform:uppercase; letter-spacing:.03em; }
    .ff input,.ff select { height:34px; border:1px solid var(--gray-300); border-radius:7px; padding:0 10px; font-size:13px; background:#fff; outline:none; color:var(--gray-800); }
    .ff input:focus,.ff select:focus { border-color:var(--primary); }
    .fa { display:flex; gap:8px; justify-content:flex-end; margin-top:6px; }
    .sdiv { font-size:10px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.06em; margin:12px 0 8px; padding-bottom:5px; border-bottom:1px solid var(--gray-200); }

    /* ── Badges ── */
    .badge { display:inline-flex; align-items:center; gap:3px; padding:2px 7px; border-radius:99px; font-size:11px; font-weight:700; }
    .b-green  { background:var(--green);  color:#fff; }
    .b-amber  { background:var(--amber-light); color:var(--amber); border:1px solid var(--amber-bd); }
    .b-sky    { background:var(--sky-light); color:var(--sky); }
    .b-purple { background:var(--purple-light); color:var(--purple); }
    .b-gray   { background:var(--gray-200); color:var(--gray-600); }
    .b-blue   { background:var(--primary-light); color:var(--primary); }

    /* ── Resumo ── */
    .sum4 { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px; }
    .scard { background:#fff; border:1px solid var(--gray-200); border-radius:var(--r); padding:14px 16px; box-shadow:var(--sh); }
    .slbl { font-size:10px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:.04em; margin-bottom:3px; }
    .sval { font-size:20px; font-weight:700; color:var(--gray-900); }
    .sval.g { color:var(--green); } .sval.a { color:var(--amber); } .sval.p { color:var(--purple); }
    .ssub { font-size:11px; color:var(--gray-400); margin-top:2px; }

    /* ── Funcionário card ── */
    .func-card { border:1px solid var(--gray-200); border-radius:10px; background:#fff; margin-bottom:10px; overflow:hidden; }
    .func-card.adt-ok  { border-left:3px solid var(--amber); }
    .func-card.folha-ok { border-left:3px solid var(--green); }
    .func-hd { display:flex; align-items:center; gap:10px; padding:12px 16px; }
    .func-info { flex:1; min-width:0; }
    .func-nome { font-size:14px; font-weight:700; color:var(--gray-900); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .func-sub  { font-size:12px; color:var(--gray-400); margin-top:2px; }
    .func-acts { display:flex; gap:6px; flex-shrink:0; align-items:center; }
    .func-body { border-top:1px solid var(--gray-100); padding:14px 16px; background:var(--gray-50); }

    /* ── Adiantamento inline ── */
    .adt-list { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
    .adt-item { display:flex; align-items:center; gap:10px; padding:8px 12px; background:#fff; border:1px solid var(--amber-bd); border-radius:8px; }
    .adt-item .adt-val { font-weight:700; color:var(--amber); margin-left:auto; }

    /* ── Tabela cálculo ── */
    .calc-wrap { background:#fff; border:1px solid var(--gray-200); border-radius:8px; padding:12px 14px; }
    .ctab { width:100%; border-collapse:collapse; font-size:13px; }
    .ctab td { padding:4px 6px; }
    .ctab td:last-child { text-align:right; font-weight:600; white-space:nowrap; }
    .ctab .csec td { font-size:10px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.05em; padding:10px 6px 4px; }
    .ctab .csub td { border-top:1px solid var(--gray-200); font-weight:700; padding-top:7px; }
    .ctab .ctotal td { border-top:2px solid var(--gray-300); font-size:14px; font-weight:700; color:var(--primary); padding-top:8px; }
    .ctab .cdesc td:last-child { color:var(--red); }
    .ctab .cfgts td { color:var(--purple); }
    .ctab .cprov td { color:var(--gray-500); font-size:12px; }
    .cbadge { display:inline-block; padding:1px 6px; border-radius:99px; font-size:10px; font-weight:700; background:var(--primary-light); color:var(--primary); margin-left:4px; }
    .cbadge.a { background:var(--amber-light); color:var(--amber); }
    .cbadge.p { background:var(--purple-light); color:var(--purple); }

    /* ── CNPJ ── */
    .cw { position:relative; }
    .cico { position:absolute; right:9px; top:50%; transform:translateY(-50%); font-size:15px; pointer-events:none; }
    .cspin { width:15px; height:15px; border:2px solid var(--gray-300); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .cres { margin-top:5px; padding:8px 10px; border-radius:7px; font-size:12px; display:none; }
    .cres.ok   { background:var(--green-light); border:1px solid var(--green-bd); color:var(--green); display:block; }
    .cres.err  { background:var(--red-light); border:1px solid #fca5a5; color:var(--red); display:block; }

    /* ── Misc ── */
    hr { border:none; border-top:1px solid var(--gray-200); margin:12px 0; }
    .lf { display:flex; justify-content:space-between; align-items:center; font-size:13px; padding:3px 0; }
    .lf-t { font-size:16px; font-weight:700; }
    .tg { color:var(--green); font-weight:600; } .ta { color:var(--amber); font-weight:600; } .tp { color:var(--purple); font-weight:600; }
    .empty { padding:40px 20px; text-align:center; color:var(--gray-400); }
    .empty-i { font-size:36px; margin-bottom:10px; }
    .empty p { font-size:14px; margin-bottom:12px; }
    .aviso { text-align:center; font-size:11px; color:var(--gray-400); margin-top:6px; }
    .alerta { background:#fffbeb; border:1px solid var(--amber-bd); border-radius:var(--r); padding:14px 18px; display:flex; gap:10px; font-size:14px; color:var(--amber); margin-bottom:18px; }
    .emp-banner { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:10px 14px; background:var(--green-light); border:1px solid var(--green-bd); border-radius:var(--r); font-size:13px; }
    .filtros { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:18px; }
    .fld { display:flex; flex-direction:column; gap:4px; }
    .fld label { font-size:10px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:.04em; }
    .fld select { height:36px; border:1px solid var(--gray-300); border-radius:8px; padding:0 10px; font-size:13px; background:#fff; outline:none; }

    /* ── Status barra ── */
    .status-bar { display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }

    /* ── Emp list ── */
    .emp-list { display:flex; flex-direction:column; gap:8px; }
    .emp-row { display:flex; align-items:center; gap:12px; padding:12px 16px; border-radius:10px; border:2px solid var(--gray-200); background:#fff; }
    .emp-row.on { border-color:var(--green); background:var(--green-light); }
    .emp-info { flex:1; min-width:0; }
    .emp-nome { font-size:14px; font-weight:700; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
    .emp-det  { font-size:12px; color:var(--gray-500); margin-top:2px; }
    .emp-acts { display:flex; gap:6px; flex-shrink:0; }

    @media print {
      .tabs,.btn,.func-acts,.emp-acts,.aviso,.fbox,.filtros,.alerta { display:none !important; }
      body { background:#fff; } main { padding:0; max-width:100%; }
      .card { box-shadow:none; border:1px solid #ccc; } header { position:static; box-shadow:none; }
      .func-body { display:block !important; }
    }
    @media (max-width:680px) {
      .sum4 { grid-template-columns:1fr 1fr; }
      .fg2,.fg3,.fg4 { grid-template-columns:1fr; }
      .func-acts { flex-wrap:wrap; }
    }
  </style>
</head>
<body>

<header>
  <span style="font-size:22px">📋</span>
  <div><span class="h-title">Folha de Pagamento</span><span class="h-sub">Colaboradores Informais</span></div>
  <div id="hEmp" style="margin-left:auto;"></div>
</header>
<div class="tabs">
  <button class="tab on"  id="t1" onclick="tab(1)">🏢 Empresas</button>
  <button class="tab"     id="t2" onclick="tab(2)">👤 Funcionários</button>
  <button class="tab"     id="t3" onclick="tab(3)">📋 Folha Mensal</button>
</div>
<main>
  <div class="card" style="margin-bottom:14px;border-color:var(--sky-bd);background:var(--sky-light)">
    <div class="card-bd" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
      <div>
        <div style="font-size:14px;font-weight:700;color:var(--gray-900);margin-bottom:4px">💾 Backup dos dados</div>
        <div style="font-size:12px;color:var(--gray-600)">Exporte um arquivo JSON com tudo que já foi lançado no sistema e importe depois, se precisar restaurar as informações.</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" onclick="exportarBackup()">Exportar Backup</button>
        <button class="btn btn-primary btn-sm" onclick="document.getElementById('importBackupFile').click()">Importar Backup</button>
        <input type="file" id="importBackupFile" accept="application/json,.json" style="display:none" onchange="importarBackup(event)">
      </div>
    </div>
  </div>
  <div id="p1"></div>
  <div id="p2" style="display:none"></div>
  <div id="p3" style="display:none"></div>
</main>

<script>
// ══════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const hoje=new Date();
let tabAt=1, mes=hoje.getMonth()+1, ano=hoje.getFullYear();
let empFA=false, empEId=null;
let funcFA=false, funcEId=null;
let funcExp=null;
let adtFId=null, folhaFId=null, ferFId=null, dec13FId=null, rescFId=null;
let extrasTemp=[];
let cnpjT=null;

// ══════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════
const ls={g:k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const getEmps=()=>ls.g('fp_emps')||[];
const setEmps=v=>ls.s('fp_emps',v);
const getAId=()=>localStorage.getItem('fp_a')||null;
const setAId=id=>id?localStorage.setItem('fp_a',id):localStorage.removeItem('fp_a');
const getAtiva=()=>{const id=getAId();return id?getEmps().find(e=>e.id===id)||null:null};
// Funcionários permanentes por empresa
const getFuncs=eid=>ls.g(`fp_f_${eid}`)||[];
const setFuncs=(eid,v)=>ls.s(`fp_f_${eid}`,v);
// Dados mensais por empresa+ano+mes
const getMesKey=(eid)=>`fp_m_${eid}_${ano}_${String(mes).padStart(2,'0')}`;
const getMes=eid=>ls.g(getMesKey(eid))||[];
const setMes=(eid,v)=>ls.s(getMesKey(eid),v);
// Pega ou cria entrada mensal de um funcionário
function getMesFunc(eid,fid){const m=getMes(eid);return m.find(e=>e.fid===fid)||{fid,adts:[],folhaRodada:false,pago:false};}
function setMesFunc(eid,entry){
  const m=getMes(eid).filter(e=>e.fid!==entry.fid);
  m.push(entry); setMes(eid,m);
}
// Férias por empresa
const getFers=(eid)=>ls.g(`fp_fer_${eid}`)||[];
const setFers=(eid,v)=>ls.s(`fp_fer_${eid}`,v);
// Rescisão por empresa (uma por funcionário)
const getRescs=(eid)=>ls.g(`fp_resc_${eid}`)||[];
const setRescs=(eid,v)=>ls.s(`fp_resc_${eid}`,v);
const getRescFunc=(eid,fid)=>getRescs(eid).find(r=>r.fid===fid)||null;
function setRescFunc(eid,resc){const l=getRescs(eid).filter(r=>r.fid!==resc.fid);l.push(resc);setRescs(eid,l);}

// ══════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════
const genId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>parseFloat(String(v||0))||0;
const gv=id=>document.getElementById(id)?.value||'';

function diasNoMes(m,a){return new Date(a,m,0).getDate();}
function diasMesAtual(){return diasNoMes(mes,ano);}

function calcAvos13(adm,aRef){
  if(!adm) return 0;
  const d=new Date(adm+'T12:00:00'); let av=0;
  for(let m=0;m<12;m++){
    if(aRef===hoje.getFullYear()&&m>hoje.getMonth()) continue;
    if(aRef<hoje.getFullYear()&&m>11) continue;
    const fim=new Date(aRef,m+1,0);
    if(d>fim) continue;
    const dia=(d.getFullYear()===aRef&&d.getMonth()===m)?d.getDate():1;
    if(fim.getDate()-dia+1>=15) av++;
  }
  return Math.min(av,12);
}
function calcAvosF(adm){
  if(!adm) return 0;
  const d=new Date(adm+'T12:00:00');
  const r=new Date(ano,mes-1,1);
  const m=(r.getFullYear()-d.getFullYear())*12+(r.getMonth()-d.getMonth());
  return m<0?0:m%12;
}

function calcEntry(f, entry){
  const sal=num(f.salarioBase);
  const isMens=f.tipoSalario==='mensalista'||!f.tipoSalario;
  const prop=isMens&&!!entry.mesProporcional;

  let salProp, vh, dt;
  if(isMens){
    const dim=diasNoMes(mes,ano); // dias reais do mês vigente
    dt=prop?num(entry.diasTrab||0):dim;
    salProp=prop?(sal/dim)*num(entry.diasTrab||0):sal;
    vh=entry.vhManual&&num(entry.vhValor)>0 ? num(entry.vhValor) : sal/220;
  } else {
    dt=num(entry.diasTrab||0);
    salProp=sal*dt;
    vh=num(entry.valorHora||0);
  }

  const he50v  = vh*(num(entry.he50)||0)*1.5;
  const he100v = vh*(num(entry.he100)||0)*2.0;
  const totalHE= he50v+he100v;
  const dsrBase= (isMens&&!prop) ? diasNoMes(mes,ano) : dt;
  const dsrAuto= dsrBase>0&&totalHE>0 ? (totalHE/dsrBase)*(num(entry.diasDSR)||4) : 0;
  const dsr    = entry.dsrManual ? num(entry.dsrValor) : dsrAuto;
  const totalAdt= (entry.adts||[]).reduce((s,a)=>s+num(a.valor),0);
  const totalExtrasC=(entry.extras||[]).filter(x=>x.tipo==='credito').reduce((s,x)=>s+num(x.valor),0);
  const totalExtrasD=(entry.extras||[]).filter(x=>x.tipo==='desconto').reduce((s,x)=>s+num(x.valor),0);
  const bruto  = salProp+totalHE+dsr;
  const aPagar = bruto-totalAdt+totalExtrasC-totalExtrasD;
  const av13   = calcAvos13(f.dataAdmissao,ano);
  const dec13  = sal>0 ? sal*av13/12 : 0;
  const avF    = calcAvosF(f.dataAdmissao);
  const ferTotal= sal>0 ? (sal*avF/12)*(4/3) : 0;
  const fgts   = bruto*0.08;
  return {salProp,vh,he50v,he100v,totalHE,dsr,dsrAuto,totalAdt,totalExtrasC,totalExtrasD,bruto,aPagar,av13,dec13,avF,ferTotal,fgts,dt,prop};
}

function calcFer(f,dias,dataInicio){
  const sal=num(f.salarioBase);
  // Usa os dias reais do mês de início das férias
  let dim=30;
  if(dataInicio){const d=new Date(dataInicio+'T12:00:00');dim=diasNoMes(d.getMonth()+1,d.getFullYear());}
  else{dim=diasNoMes(mes,ano);}
  const vd=sal/dim,vf=vd*dias,ad=vf/3;
  return {vd,vf,ad,total:vf+ad,dim};
}
function calc13(f){
  const sal=num(f.salarioBase),avos=calcAvos13(f.dataAdmissao,ano);
  const v13=sal>0?sal*avos/12:0;
  return {avos,v13,parc1:v13/2,parc2:v13/2};
}
function getDec13Nov(eid,fid){
  const data=ls.g(`fp_m_${eid}_${ano}_11`)||[];
  return (data.find(x=>x.fid===fid)||{}).dec13?.valor||0;
}
// Avos de férias até uma data específica (período aquisitivo)
function calcAvosF_data(adm, dataRef){
  if(!adm) return 0;
  const da=new Date(adm+'T12:00:00'), dr=new Date(dataRef+'T12:00:00');
  const m=(dr.getFullYear()-da.getFullYear())*12+(dr.getMonth()-da.getMonth());
  return m<0?0:m%12;
}
// Avos de 13º até uma data específica
function calcAvos13_data(adm, dataRef){
  if(!adm) return 0;
  const da=new Date(adm+'T12:00:00'), dr=new Date(dataRef+'T12:00:00');
  const aRef=dr.getFullYear(); let av=0;
  for(let m=0;m<12;m++){
    const fim=new Date(aRef,m+1,0);
    if(fim>dr) continue; if(da>fim) continue;
    const dia=(da.getFullYear()===aRef&&da.getMonth()===m)?da.getDate():1;
    if(fim.getDate()-dia+1>=15) av++;
  }
  // verifica mês da rescisão/data final
  const mR=dr.getMonth(), fimM=new Date(aRef,mR+1,0);
  const dIni=(da.getFullYear()===aRef&&da.getMonth()===mR)?da.getDate():1;
  if(dr.getDate()-dIni+1>=15) av++;
  return Math.min(av,12);
}
// Aviso prévio proporcional — Lei 12.506/2011: 30 + 3 dias/ano completo, máx 90
function calcDiasAviso(adm, dataResc){
  if(!adm) return 30;
  const da=new Date(adm+'T12:00:00'), dr=new Date(dataResc+'T12:00:00');
  const anos=Math.floor((dr-da)/(365.25*24*60*60*1000));
  return Math.min(30+anos*3, 90);
}
function addDias(dateStr, dias){
  const d=new Date(dateStr+'T12:00:00'); d.setDate(d.getDate()+dias);
  return d.toISOString().slice(0,10);
}
// ── Cálculo CLT completo por motivo ──────
function calcResc(f, dataRescisao, motivo, aviso, ferVencPer, fgtsSaldoInput, aplicarMultaFgts=true){
  const sal=num(f.salarioBase); if(!dataRescisao) return null;
  const dr=new Date(dataRescisao+'T12:00:00');
  const isSemJusta=motivo==='Dispensa sem justa causa';
  const isComJusta=motivo==='Dispensa com justa causa';
  const isDemissao=motivo==='Pedido de demissão';
  const isAcordo  =motivo==='Acordo entre partes';
  const isTermino =motivo==='Término de contrato';

  // Saldo de salário: dias trabalhados / dias reais do mês da rescisão
  const diasTrab=dr.getDate();
  const dimResc=diasNoMes(dr.getMonth()+1, dr.getFullYear());
  const saldoSal=(sal/dimResc)*diasTrab;

  // Aviso prévio proporcional
  const diasAviso=calcDiasAviso(f.dataAdmissao, dataRescisao);
  let avisoVal=0, avisoDias=0;

  if((isSemJusta||isTermino)&&aviso==='ind'){
    avisoVal=(sal/dimResc)*diasAviso; avisoDias=diasAviso;
  } else if(isAcordo&&aviso==='ind'){
    avisoVal=(sal/dimResc)*diasAviso*0.5; avisoDias=Math.floor(diasAviso/2);
  } else if(isDemissao&&aviso==='desc'){
    // Não cumpriu aviso: desconta 30 dias baseado nos dias do mês
    avisoVal=-(sal/dimResc)*30; avisoDias=0;
  }
  // 'trab', 'nenhum', 'disp': sem valor extra, sem extensão

  // Data virtual — aviso indenizado estende cálculo de 13º e férias (CLT art. 487 §1º)
  const dataVirtual=avisoDias>0 ? addDias(dataRescisao,avisoDias) : dataRescisao;

  // 13º proporcional (inclui aviso indenizado; justa causa não tem direito)
  let dec13=0, avos13=0;
  if(!isComJusta){
    avos13=calcAvos13_data(f.dataAdmissao, dataVirtual);
    dec13=sal>0?sal*avos13/12:0;
  }

  // Férias proporcionais + 1/3 (inclui aviso; justa causa perde as proporcionais)
  let ferProp=0, avosF=0;
  if(!isComJusta){
    avosF=calcAvosF_data(f.dataAdmissao, dataVirtual);
    ferProp=sal>0?(sal*avosF/12)*(4/3):0;
  }

  // Férias vencidas + 1/3 (todo motivo tem direito; justa causa também)
  const ferVencNum=Math.max(0,num(ferVencPer)||0);
  const ferVenc=ferVencNum>0?sal*ferVencNum*(4/3):0;

  // Multa FGTS (40% sem justa/término · 20% acordo · não se aplica demissão/justa causa)
  const fgtsSaldoVal=num(fgtsSaldoInput)||0;
  let multaFgts=0;
  if(aplicarMultaFgts){
    if((isSemJusta||isTermino)&&fgtsSaldoVal>0) multaFgts=fgtsSaldoVal*0.40;
    else if(isAcordo&&fgtsSaldoVal>0)           multaFgts=fgtsSaldoVal*0.20;
  }

  // FGTS 8% sobre verbas brutas — custo de referência do empregador
  const baseFgts=saldoSal+(avisoVal>0?avisoVal:0)+dec13+ferProp+ferVenc;
  const fgtsRef=baseFgts*0.08;

  const total=saldoSal+avisoVal+dec13+ferProp+ferVenc+multaFgts;
  return {
    saldoSal,diasTrab,dimResc,diasAviso,avisoDias,avisoVal,
    dec13,avos13,ferProp,avosF,
    ferVenc,ferVencNum,
    multaFgts,fgtsSaldoVal,fgtsRef,total,aplicarMultaFgts,
    isSemJusta,isComJusta,isDemissao,isAcordo,isTermino
  };
}

// CNPJ
function mCnpj(v){
  v=v.replace(/\D/g,'').slice(0,14);
  if(v.length>12)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8,12)+'-'+v.slice(12);
  else if(v.length>8)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8);
  else if(v.length>5)v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5);
  else if(v.length>2)v=v.slice(0,2)+'.'+v.slice(2);
  return v;
}
function oCnpj(el){
  const raw=el.value.replace(/\D/g,''); el.value=mCnpj(raw);
  clearTimeout(cnpjT);
  const ic=document.getElementById('eCI'),re=document.getElementById('eCR');
  if(!ic||!re)return;
  if(raw.length<14){ic.innerHTML='';re.className='cres';return;}
  ic.innerHTML='<span class="cspin"></span>'; re.className='cres';
  cnpjT=setTimeout(()=>bCnpj(raw),400);
}
async function bCnpj(c){
  const ic=document.getElementById('eCI'),re=document.getElementById('eCR');
  if(!ic||!re)return;
  try{
    const d=await(await fetch(`https://brasilapi.com.br/api/cnpj/v1/${c}`)).json();
    if(d.message)throw 0;
    const n=document.getElementById('eNome'),r=document.getElementById('eResp'),en=document.getElementById('eEnd');
    if(n&&!n.value.trim()) n.value=d.nome_fantasia||d.razao_social||'';
    if(r&&!r.value.trim()&&d.qsa?.[0]) r.value=d.qsa[0].nome_socio||'';
    if(en&&!en.value.trim()) en.value=[d.logradouro,d.numero,d.municipio,d.uf].filter(Boolean).join(', ');
    ic.innerHTML='✅'; re.className='cres ok';
    re.innerHTML=`<strong>${d.razao_social}</strong>${d.nome_fantasia&&d.nome_fantasia!==d.razao_social?' · '+d.nome_fantasia:''}<br>${d.descricao_situacao_cadastral?'Situação: <strong>'+d.descricao_situacao_cadastral+'</strong>':''}${d.cnae_fiscal_descricao?' · '+d.cnae_fiscal_descricao:''}`;
  }catch{
    ic.innerHTML='❌'; re.className='cres err';
    re.textContent='CNPJ não encontrado. Preencha manualmente.';
  }
}

      </div>
      <div class="func-acts">
        <button class="btn btn-amber btn-sm" onclick="aAdt('${f.id}','${eid}')">💰 Adiantamento</button>
        <button class="btn btn-sky btn-sm" onclick="aFolha('${f.id}','${eid}')">📋 Rodar Folha</button>
        <button class="btn btn-danger btn-sm" style="background:var(--red);color:#fff" onclick="aResc('${f.id}','${eid}')">🚪 Rescisão</button>
        <button class="btn btn-ghost btn-icon" onclick="eFuncId('${f.id}')">✏️</button>
        <button class="btn btn-danger btn-icon" onclick="dFunc('${f.id}','${eid}')">🗑️</button>
        <button class="btn btn-ghost btn-icon" onclick="togExp('${f.id}')" title="${exp?'Fechar':'Ver detalhes'}">
          ${exp?'▲':'▼'}
        </button>
      </div>
    </div>`;

  if(exp){
    h+=`<div class="func-body">`;

    // Adiantamentos
    h+=`<div class="sdiv">💰 Adiantamentos — ${MESES[mes-1]}/${ano}</div>`;
    if(adtFId===f.id) h+=adtForm(f.id,eid,entry);
    if(entry.adts&&entry.adts.length>0){
      h+=`<div class="adt-list">`;
      entry.adts.forEach(a=>{
        h+=`<div class="adt-item">
          <span style="font-size:16px">💰</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${brl(a.valor)}</div>
            <div style="font-size:11px;color:var(--gray-400)">${a.data?new Date(a.data+'T12:00:00').toLocaleDateString('pt-BR'):''} ${a.obs?'· '+esc(a.obs):''}</div>
          </div>
          <div class="adt-val">${brl(a.valor)}</div>
          <button class="btn btn-outline btn-sm" onclick="printAdt('${a.id}','${f.id}','${eid}')" title="Imprimir recibo">🖨️ Recibo</button>
          <button class="btn btn-danger btn-icon btn-sm" onclick="dAdt('${a.id}','${f.id}','${eid}')">🗑️</button>
        </div>`;
      });
      h+=`</div>`;
    } else if(adtFId!==f.id){
      h+=`<p style="font-size:12px;color:var(--gray-400);margin-bottom:10px">Nenhum adiantamento lançado neste mês.</p>`;
    }
    if(adtFId!==f.id){
      h+=`<div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-amber btn-sm" onclick="aAdt('${f.id}','${eid}')">+ Lançar adiantamento</button>
        ${entry.adts&&entry.adts.length>1?`<button class="btn btn-outline btn-sm" onclick="printTodosAdts('${f.id}','${eid}')">🖨️ Todos Adiant.</button>`:''}
      </div>`;
    }

    // Folha
    h+=`<div class="sdiv" style="margin-top:16px">📋 Folha — ${MESES[mes-1]}/${ano}</div>`;
    if(folhaFId===f.id) h+=folhaForm(f,eid,entry);
    else if(temFolha){
      h+=`<div class="calc-wrap">${tabelaCalc(r,f,entry)}</div>
        <div style="display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" onclick="aFolha('${f.id}','${eid}')">✏️ Editar folha</button>
          <button class="btn ${entry.pago?'btn-outline':'btn-green'} btn-sm" onclick="togPago('${f.id}','${eid}')">
            ${entry.pago?'↩️ Desmarcar pago':'✅ Marcar como pago'}
          </button>
          <button class="btn btn-primary btn-sm" onclick="printFolha('${f.id}','${eid}')">🖨️ Recibo da Folha</button>
        </div>`;
    } else {
      h+=`<p style="font-size:12px;color:var(--gray-400);margin-bottom:10px">Folha ainda não foi rodada para este mês.</p>
        <button class="btn btn-sky btn-sm" onclick="aFolha('${f.id}','${eid}')">📋 Rodar Folha Mensal</button>`;
    }


    // ── Férias ──────────────────────────────
    h+=`<div class="sdiv" style="margin-top:16px">🌴 Férias — Histórico</div>`;
    const fers=getFers(eid).filter(fe=>fe.fid===f.id);
    if(ferFId===f.id) h+=ferForm(f.id,eid);
    if(fers.length){
      h+=`<div class="adt-list">`;
      fers.forEach(fe=>{
        const di=fe.dataInicio?new Date(fe.dataInicio+'T12:00:00').toLocaleDateString('pt-BR'):'—';
        const df=fe.dataFim?new Date(fe.dataFim+'T12:00:00').toLocaleDateString('pt-BR'):'—';
        h+=`<div class="adt-item" style="border-color:#86efac">
          <span style="font-size:16px">🌴</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:600">${brl(fe.total)} · ${fe.dias} dias</div>
            <div style="font-size:11px;color:var(--gray-400)">${di} até ${df}${fe.pago?' · <span style="color:var(--green)">✅ Pago</span>':''}</div>
          </div>
          <div class="adt-val" style="color:var(--green)">${brl(fe.total)}</div>
          <button class="btn btn-ghost btn-sm" onclick="togFerPago('${fe.id}','${eid}')" title="${fe.pago?'Desmarcar':'Marcar pago'}" style="color:${fe.pago?'var(--amber)':'var(--green)'}">${fe.pago?'↩️':'✅'}</button>
          <button class="btn btn-outline btn-sm" onclick="printFer('${fe.id}','${f.id}','${eid}')">🖨️ Recibo</button>
          <button class="btn btn-danger btn-icon btn-sm" onclick="dFer('${fe.id}','${eid}')">🗑️</button>
        </div>`;
      });
      h+=`</div>`;
    } else if(ferFId!==f.id){
      h+=`<p style="font-size:12px;color:var(--gray-400);margin-bottom:10px">Nenhum período de férias lançado.</p>`;
    }
    if(ferFId!==f.id){
      h+=`<button class="btn btn-green btn-sm" onclick="aFer('${f.id}','${eid}')">🌴 Lançar Férias</button>`;
    }

    // ── 13º Salário (apenas Nov/Dez) ─────────
    if(mes===11||mes===12){
      h+=`<div class="sdiv" style="margin-top:16px">🎄 13º Salário — ${ano}</div>`;
      const r13=calc13(f);
      const parcNum=mes===11?1:2;
      const temDec13=entry.dec13&&entry.dec13.rodada;
      if(dec13FId===f.id){
        h+=dec13Form(f,eid,entry,r13);
      } else if(temDec13){
        const novVal=entry.dec13.valorNov||0;
        h+=`<div class="calc-wrap"><table class="ctab">
          <tr><td>13º proporcional <span class="cbadge a">${r13.avos}/12 avos</span></td><td>${brl(r13.v13)}</td></tr>
          ${parcNum===2&&novVal>0?`<tr class="cdesc"><td>(−) 1ª parcela paga em novembro</td><td>−${brl(novVal)}</td></tr>`:''}
          <tr class="ctotal"><td>${parcNum}ª parcela — ${mes===11?'50% do 13º':'Saldo final'}</td><td>${brl(entry.dec13.valor)}</td></tr>
        </table></div>
        <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center">
          <button class="btn btn-outline btn-sm" onclick="aDec13('${f.id}','${eid}')">✏️ Editar</button>
          <button class="btn ${entry.dec13.pago?'btn-outline':'btn-green'} btn-sm" onclick="togDec13Pago('${f.id}','${eid}')">${entry.dec13.pago?'↩️ Desmarcar':'✅ Marcar pago'}</button>
          <button class="btn btn-primary btn-sm" onclick="printDec13('${f.id}','${eid}')">🖨️ Recibo 13º</button>
        </div>`;
      } else {
        const novVal=mes===12?getDec13Nov(eid,f.id):0;
        const parcVal=mes===11?r13.parc1:Math.max(0,r13.v13-novVal);
        h+=`<div style="background:var(--amber-light);border:1px solid var(--amber-bd);border-radius:8px;padding:12px;margin-bottom:10px">
          <div style="font-size:13px;font-weight:600;color:var(--amber)">${parcNum}ª Parcela — ${brl(parcVal)}</div>
          <div style="font-size:12px;color:var(--gray-600);margin-top:3px">${r13.avos}/12 avos · Base: ${brl(f.salarioBase)}</div>
          ${mes===12&&novVal>0?`<div style="font-size:11px;color:var(--gray-500);margin-top:2px">Desconta 1ª parcela de novembro (${brl(novVal)})</div>`:''}
        </div>
        <button class="btn btn-amber btn-sm" onclick="aDec13('${f.id}','${eid}')">🎄 Rodar ${parcNum}ª Parcela</button>`;
      }
    }

    // ── Rescisão ─────────────────────────────
    h+=`<div class="sdiv" style="margin-top:16px;border-color:#fca5a5;color:var(--red)">🚪 Rescisão de Contrato</div>`;
    const resc=getRescFunc(eid,f.id);
    if(rescFId===f.id){
      h+=rescForm(f,eid,resc);
    } else if(resc){
      const dr=new Date(resc.dataRescisao+'T12:00:00').toLocaleDateString('pt-BR');
      const isAcordo=resc.motivo==='Acordo entre partes';
      h+=`<div style="background:var(--red-light);border:1px solid #fca5a5;border-radius:8px;padding:12px;margin-bottom:10px">
        <div style="font-size:13px;font-weight:700;color:var(--red);margin-bottom:6px">Rescindido em ${dr} — ${esc(resc.motivo)}</div>
        <div class="calc-wrap"><table class="ctab">
          <tr><td>Saldo de salário <span class="cbadge">${resc.diasTrab}/${resc.dimResc} dias</span></td><td>${brl(resc.saldoSal)}</td></tr>
          ${resc.avisoVal>0?`<tr><td>Aviso prévio indenizado${isAcordo?' 50%':''} (${resc.diasAviso} dias)</td><td>${brl(resc.avisoVal)}</td></tr>`:''}
          ${resc.avisoVal<0?`<tr class="cdesc"><td>(−) Desconto aviso não cumprido</td><td>−${brl(-resc.avisoVal)}</td></tr>`:''}
          ${resc.dec13>0?`<tr><td>13º proporcional <span class="cbadge a">${resc.avos13}/12 avos</span></td><td>${brl(resc.dec13)}</td></tr>`:''}
          ${resc.ferProp>0?`<tr><td>Férias prop. + 1/3 <span class="cbadge a">${resc.avosF}/12 avos</span></td><td>${brl(resc.ferProp)}</td></tr>`:''}
          ${resc.ferVenc>0?`<tr><td>Férias vencidas + 1/3 <span class="cbadge a">${resc.ferVencNum} período${resc.ferVencNum>1?'s':''}</span></td><td>${brl(resc.ferVenc)}</td></tr>`:''}
          ${resc.multaFgts>0?`<tr><td>Multa FGTS ${isAcordo?'20%':'40%'}</td><td>${brl(resc.multaFgts)}</td></tr>`:''}
          <tr class="ctotal"><td>Total da rescisão</td><td>${brl(resc.total)}</td></tr>
          <tr class="cfgts"><td>FGTS 8% s/ verbas <span class="cbadge p">ref. empregador</span></td><td>${brl(resc.fgtsRef||resc.fgts||0)}</td></tr>
        </table></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <button class="btn btn-outline btn-sm" onclick="aResc('${f.id}','${eid}')">✏️ Editar</button>
        <button class="btn btn-primary btn-sm" onclick="printResc('${f.id}','${eid}')">🖨️ Recibo de Rescisão</button>
        <button class="btn btn-danger btn-sm" onclick="dResc('${f.id}','${eid}')">🗑️ Remover</button>
      </div>`;
    } else {
      h+=`<p style="font-size:12px;color:var(--gray-400);margin-bottom:10px">Nenhuma rescisão registrada.</p>
        <button class="btn btn-sm" style="background:var(--red);color:#fff" onclick="aResc('${f.id}','${eid}')">🚪 Registrar Rescisão</button>`;
    }

    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

// ── Adiantamento form ─────────────────────
function adtForm(fid,eid,entry){
  return `<div class="fbox" style="border-color:var(--amber-bd);background:var(--amber-light)">
    <div class="ftitle">💰 Lançar Adiantamento — ${MESES[mes-1]}/${ano}</div>
    <div class="fg3">
      <div class="ff"><label>Valor (R$) *</label><input type="number" id="aVal" min="0" step="0.01" placeholder="0,00" /></div>
      <div class="ff"><label>Data do pagamento</label><input type="date" id="aDat" value="${hoje.toISOString().slice(0,10)}" /></div>
      <div class="ff"><label>Descrição</label><input type="text" id="aObs" placeholder="Ex.: Adiantamento quinzena" /></div>
    </div>
    <div class="fa">
      <button class="btn btn-ghost btn-sm" onclick="cAdt()">✕ Cancelar</button>
      <button class="btn btn-amber btn-sm" onclick="sAdt('${fid}','${eid}')">💾 Confirmar Adiantamento</button>
    </div></div>`;
}

function aAdt(fid,eid){ adtFId=fid; funcExp=fid; folhaFId=null; rFunc(); setTimeout(()=>document.getElementById('aVal')?.focus(),50); }
function cAdt(){ adtFId=null; rFunc(); }
function sAdt(fid,eid){
  const val=num(gv('aVal')); if(!val){alert('Informe o valor.');return;}
  const entry=getMesFunc(eid,fid);
  if(!entry.adts) entry.adts=[];
  entry.adts.push({id:genId(),valor:val,data:gv('aDat'),obs:gv('aObs').trim()});
  setMesFunc(eid,entry); adtFId=null; rFunc();
}
function dAdt(aid,fid,eid){
  if(!confirm('Remover adiantamento?'))return;
  const entry=getMesFunc(eid,fid);
  entry.adts=(entry.adts||[]).filter(a=>a.id!==aid);
  setMesFunc(eid,entry); rFunc();
}

// ── Folha form ────────────────────────────
function folhaForm(f,eid,entry){
  const isMens=f.tipoSalario==='mensalista'||!f.tipoSalario;
  return `<div class="fbox" style="border-color:var(--sky);background:var(--sky-light)">
    <div class="ftitle">📋 Folha Mensal — ${esc(f.nome)} · ${MESES[mes-1]}/${ano}</div>
    <div class="sdiv">📅 Período</div>
    <div class="fg2" style="margin-bottom:10px">
      ${isMens?`
      <div class="ff"><label>Tipo de mês</label>
        <select id="fProp" onchange="oFolhaProp('${f.id}','${eid}')">
          <option value="0" ${!entry.mesProporcional?'selected':''}>Mês completo — 30 dias</option>
          <option value="1" ${entry.mesProporcional?'selected':''}>Proporcional — admissão / rescisão</option>
        </select></div>
      <div class="ff" id="fDtRow" style="${!entry.mesProporcional?'display:none':''}">
        <label>Dias trabalhados (de 30) *</label>
        <input type="number" id="fDt" min="1" max="${diasMesAtual()}" placeholder="Ex: 15" value="${entry.diasTrab||''}" oninput="pvFolha('${f.id}','${eid}')" />
      </div>
      <div class="ff" style="display:none"><input id="fDu" value="30" /><input id="fVh" value="0" /></div>
      `:`
      <div class="ff"><label>${f.tipoSalario==='horista'?'Horas':'Dias'} trabalhados</label>
        <input type="number" id="fDt" min="0" step="0.5" value="${entry.diasTrab||''}" oninput="pvFolha('${f.id}','${eid}')" /></div>
      <div class="ff"><label>Valor hora extra (R$)</label>
        <input type="number" id="fVh" min="0" step="0.01" placeholder="0,00" value="${entry.valorHora||''}" oninput="pvFolha('${f.id}','${eid}')" /></div>
      <div class="ff" style="display:none"><input id="fDu" value="30" /><input id="fProp" value="0" /></div>
      `}
    </div>
    <div class="fg2">
      <div class="ff"><label>Dias de DSR no mês</label><input type="number" id="fDsr" min="0" max="10" value="${entry.diasDSR||4}" oninput="pvFolha('${f.id}','${eid}')" /></div>
      <div class="ff"><label>Carga horária/dia</label><input type="number" id="fCh" min="1" max="12" value="${f.cargaHoraria||8}" oninput="pvFolha('${f.id}','${eid}')" /></div>
    </div>
    <div class="sdiv">⏰ Horas Extras</div>
    <div class="fg4">
      <div class="ff"><label>H.E. 50% (horas)</label><input type="number" id="fHe50" min="0" step="0.5" placeholder="0" value="${entry.he50||''}" oninput="pvFolha('${f.id}','${eid}')" /></div>
      <div class="ff"><label>H.E. 100% (horas)</label><input type="number" id="fHe100" min="0" step="0.5" placeholder="0" value="${entry.he100||''}" oninput="pvFolha('${f.id}','${eid}')" /></div>
      <div class="ff"><label>Valor hora</label>
        <select id="fVhM" onchange="oVhM('${f.id}','${eid}');pvFolha('${f.id}','${eid}')">
          <option value="0" ${!entry.vhManual?'selected':''}>Automático (÷ 220h)</option>
          <option value="1" ${entry.vhManual?'selected':''}>Informar manualmente</option>
        </select></div>
      <div class="ff" id="fVhVW" style="${!entry.vhManual?'display:none':''}">
        <label>Valor hora (R$)</label><input type="number" id="fVhV" min="0" step="0.01" placeholder="0,00" value="${entry.vhValor||''}" oninput="pvFolha('${f.id}','${eid}')" /></div>
      <div class="ff"><label>DSR</label>
        <select id="fDsrM" onchange="oDsrM();pvFolha('${f.id}','${eid}')">
          <option value="0" ${!entry.dsrManual?'selected':''}>Automático</option>
          <option value="1" ${entry.dsrManual?'selected':''}>Informar valor</option>
        </select></div>
      <div class="ff" id="fDsrVW" style="${!entry.dsrManual?'display:none':''}">
        <label>Valor DSR (R$)</label><input type="number" id="fDsrV" min="0" step="0.01" placeholder="0,00" value="${entry.dsrValor||''}" oninput="pvFolha('${f.id}','${eid}')" /></div>
    </div>
    <div class="sdiv">📝 Observação</div>
    <div class="fg1">
      <div class="ff"><label>Observação</label><input type="text" id="fObsM" placeholder="Observações da folha deste mês" value="${esc(entry.observacao||'')}" /></div>
    </div>
    <div class="sdiv">➕ Outros Lançamentos <span style="font-size:10px;color:var(--gray-400);font-weight:400">bônus, vale transporte, descontos, gratificações...</span></div>
    <div id="extrasWrap" style="margin-bottom:8px;"></div>
    <div style="display:flex;gap:6px;margin-bottom:12px">
      <button class="btn btn-green btn-sm" type="button" onclick="addExtra('credito','${f.id}','${eid}')">+ Crédito / Bônus</button>
      <button class="btn btn-danger btn-sm" type="button" onclick="addExtra('desconto','${f.id}','${eid}')">− Desconto / Débito</button>
    </div>
    <div id="pvFolhaBox" style="margin-bottom:10px;"></div>
    <div class="fa">
      <button class="btn btn-ghost btn-sm" onclick="cFolha()">✕ Cancelar</button>
      <button class="btn btn-sky btn-sm" onclick="sFolha('${f.id}','${eid}')">✅ Confirmar Folha</button>
    </div></div>`;
}

function oDsrM(){ const m=gv('fDsrM')==='1'; const w=document.getElementById('fDsrVW'); if(w)w.style.display=m?'':'none'; }
function oVhM(fid,eid){ const m=gv('fVhM')==='1'; const w=document.getElementById('fVhVW'); if(w)w.style.display=m?'':'none'; }

function folhaSnap(f){
  const isMens=f.tipoSalario==='mensalista'||!f.tipoSalario;
  return {
    mesProporcional: isMens ? gv('fProp')==='1' : false,
    diasUteis:  30,
    diasTrab:   num(gv('fDt')),
    diasDSR:    num(gv('fDsr')||4),
    cargaHoraria: num(gv('fCh')||f.cargaHoraria||8),
    valorHora:  num(gv('fVh')),
    he50:       num(gv('fHe50')), he100:num(gv('fHe100')),
    vhManual:   gv('fVhM')==='1', vhValor:num(gv('fVhV')),
    dsrManual:  gv('fDsrM')==='1', dsrValor:num(gv('fDsrV')),
    observacao: gv('fObsM'),
    extras: extrasTemp.filter(x=>num(x.valor)>0),
  };
}

function oFolhaProp(fid,eid){
  const prop=gv('fProp')==='1';
  const row=document.getElementById('fDtRow');
  if(row) row.style.display=prop?'':'none';
  pvFolha(fid,eid);
}

function pvFolha(fid,eid){
  const box=document.getElementById('pvFolhaBox'); if(!box) return;
  const f=getFuncs(eid).find(x=>x.id===fid); if(!f) return;
  const entry=getMesFunc(eid,fid);
  const snap={...entry,...folhaSnap(f)};
  if((f.tipoSalario==='mensalista'||!f.tipoSalario) && snap.mesProporcional) snap.diasTrab=Math.min(num(snap.diasTrab||0), diasMesAtual());
  const r=calcEntry(f,snap);
  box.innerHTML=`<div class="calc-wrap">${tabelaCalc(r,f,snap)}</div>`;
}

function aFolha(fid,eid){ const e=getMesFunc(eid,fid); extrasTemp=(e.extras||[]).map(x=>({...x})); folhaFId=fid; funcExp=fid; adtFId=null; rFunc(); setTimeout(()=>{renderExtrasSection(fid,eid);pvFolha(fid,eid);},80); }
function cFolha(){ folhaFId=null; extrasTemp=[]; rFunc(); }

function sFolha(fid,eid){
  const f=getFuncs(eid).find(x=>x.id===fid); if(!f) return;
  const entry=getMesFunc(eid,fid);
  const snap=folhaSnap(f);
  if((f.tipoSalario==='mensalista'||!f.tipoSalario) && snap.mesProporcional) snap.diasTrab=Math.min(num(snap.diasTrab||0), diasMesAtual());
  const updated={...entry,...snap,folhaRodada:true};
  setMesFunc(eid,updated); folhaFId=null; rFunc();
}

function togPago(fid,eid){
  const entry=getMesFunc(eid,fid);
  entry.pago=!entry.pago; setMesFunc(eid,entry); rFunc();
}

function togExp(fid){ funcExp=funcExp===fid?null:fid; adtFId=null; folhaFId=null; ferFId=null; dec13FId=null; rescFId=null; rFunc(); }

function sFunc(id,eid){
  const nome=gv('fNome').trim(); if(!nome){alert('Informe o nome.');return;}
  const t=gv('fTipo')||'mensalista';
  const d={nome,funcao:gv('fFun').trim(),dataAdmissao:gv('fAdm'),tipoSalario:t,
    salarioBase:num(gv('fSal')),cargaHoraria:num(gv('fCarga')||8),observacao:gv('fObs').trim()};
  const list=getFuncs(eid);
  if(id){const i=list.findIndex(f=>f.id===id);if(i!==-1)list[i]={...list[i],...d};}
  else list.push({id:genId(),...d});
  setFuncs(eid,list); funcFA=false; funcEId=null; rFunc();
}
function dFunc(id,eid){

  if(!funcs.length){
    h+=`<div class="card"><div class="card-bd"><div class="empty"><div class="empty-i">👤</div>
      <p>Nenhum funcionário cadastrado.</p>
      <button class="btn btn-primary" onclick="tab(2)">+ Cadastrar funcionário</button></div></div></div>`;
  } else {
    h+=`<div class="card"><div class="card-hd"><div class="card-ti">📋 Detalhamento — ${MESES[mes-1]}/${ano}</div></div><div class="card-bd">`;

        </div>

  h+=`<p class="aviso">Sem desconto de INSS, IRRF ou outros impostos · FGTS exibido como custo estimado do empregador</p>`;
  document.getElementById('p3').innerHTML=h;

function tabelaCalc(r,f,entry){
  const isMens=f.tipoSalario==='mensalista'||!f.tipoSalario;
  const dim=diasNoMes(mes,ano); const dt=num(entry.diasTrab||0);
  return `<table class="ctab">
    <tr class="csec"><td colspan="2">📅 Competência ${MESES[mes-1]}/${ano}</td></tr>
    <tr><td>${isMens
      ? r.prop
        ? `Salário proporcional <span class="cbadge">${r.dt}/${dim} dias</span>`
        : `Salário mensal <span class="cbadge">${dim} dias</span>`
      : `Pagamento (${r.dt} ${f.tipoSalario==='horista'?'horas':'dias'} × ${brl(f.salarioBase)})`
    }</td><td>${brl(r.salProp)}</td></tr>
    ${r.he50v>0?`<tr><td>H.E. 50% (${entry.he50}h × ${brl(r.vh)}/h <span class="cbadge">${entry.vhManual?'manual':'sal÷220h'}</span> × 1,5)</td><td>${brl(r.he50v)}</td></tr>`:''}
    ${r.he100v>0?`<tr><td>H.E. 100% (${entry.he100}h × ${brl(r.vh)}/h <span class="cbadge">${entry.vhManual?'manual':'sal÷220h'}</span> × 2,0)</td><td>${brl(r.he100v)}</td></tr>`:''}
    ${r.dsr>0?`<tr><td>DSR ${entry.dsrManual?'(informado)':'(sobre H.E.)'}</td><td>${brl(r.dsr)}</td></tr>`:''}
    <tr class="csub"><td>Bruto do mês</td><td>${brl(r.bruto)}</td></tr>
    ${(entry.extras||[]).filter(x=>x.tipo==='credito'&&num(x.valor)>0).map(x=>`<tr><td style="color:var(--green)">+ ${esc(x.descricao||'Crédito')}</td><td style="color:var(--green)">${brl(x.valor)}</td></tr>`).join('')}
    ${(entry.extras||[]).filter(x=>x.tipo==='desconto'&&num(x.valor)>0).map(x=>`<tr class="cdesc"><td>(−) ${esc(x.descricao||'Desconto')}</td><td>−${brl(x.valor)}</td></tr>`).join('')}
    ${r.totalAdt>0?`<tr class="cdesc"><td>(−) Adiantamentos pagos</td><td>−${brl(r.totalAdt)}</td></tr>`:''}
    <tr class="ctotal"><td>✅ Total a pagar</td><td>${brl(r.aPagar)}</td></tr>
  </table>`;
}

function onRescChange(fid,eid){

function sResc(fid,eid){
  const f=getFuncs(eid).find(x=>x.id===fid); if(!f)return;

function calcFerDias(fid,eid){
  const di=document.getElementById('ferDi')?.value;
  const df=document.getElementById('ferDf')?.value;
  const el=document.getElementById('ferDias');
  if(di&&df&&el){
    const diff=Math.round((new Date(df+'T12:00:00')-new Date(di+'T12:00:00'))/(864e5))+1;
    if(diff>0){el.value=diff;pvFer(fid,eid);}
  }
}

function valorExtenso(v){
  // Extenso simplificado para valores até 999.999,99
  const n=Math.round(v*100);
  const reais=Math.floor(n/100), cts=n%100;
  const ext=n=>{ if(n===0)return'zero';
    const u=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez',
             'onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
    const d=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
    const c=['','cem','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
    if(n<20)return u[n];
    if(n<100)return d[Math.floor(n/10)]+(n%10?' e '+u[n%10]:'');
    if(n===100)return'cem';
    if(n<1000)return c[Math.floor(n/100)]+(n%100?' e '+ext(n%100):'');
    if(n<1000000){const m=Math.floor(n/1000);return(m===1?'mil':ext(m)+' mil')+(n%1000?' e '+ext(n%1000):'');}
    return String(n);
  };
  let s=ext(reais)+' real'+(reais!==1?'s':'');
  if(cts>0) s+=' e '+ext(cts)+' centavo'+(cts!==1?'s':'');
  return s.charAt(0).toUpperCase()+s.slice(1);
}

        <div class="linha"><span class="lbl">Nome</span><span class="val">${esc(f.nome)}</span></div>
        ${f.funcao?`<div class="linha"><span class="lbl">Função</span><span class="val">${esc(f.funcao)}</span></div>`:''}
        <div class="linha"><span class="lbl">Tipo</span><span class="val">${tipoL(f.tipoSalario)} · ${brl(f.salarioBase)}</span></div>
      </div>
      <div class="bloco">
        <div class="bloco-titulo">Demonstrativo — ${MESES[mes-1]}/${ano}</div>
        <div class="linha"><span class="lbl">${isMens
          ? prop ? `Salário proporcional (${dt}/${dimT} dias)` : `Salário mensal (${dimT} dias)`
          : `Pagamento (${dt} ${f.tipoSalario==='horista'?'horas':'dias'})`
        }</span><span class="val">${brl(r.salProp)}</span></div>
        ${r.he50v>0?`<div class="linha"><span class="lbl">H.Extra 50% (${entry.he50}h × 1,5)</span><span class="val">${brl(r.he50v)}</span></div>`:''}
        ${r.he100v>0?`<div class="linha"><span class="lbl">H.Extra 100% (${entry.he100}h × 2,0)</span><span class="val">${brl(r.he100v)}</span></div>`:''}
        ${r.dsr>0?`<div class="linha"><span class="lbl">DSR</span><span class="val">${brl(r.dsr)}</span></div>`:''}
        <div class="linha" style="font-weight:700;background:#f5f5f5"><span class="lbl">Salário Bruto</span><span class="val">${brl(r.bruto)}</span></div>
        ${(entry.extras||[]).filter(x=>num(x.valor)>0).map(x=>`<div class="linha"><span class="lbl" style="color:${x.tipo==='credito'?'#16a34a':'#dc2626'}">${x.tipo==='credito'?'(+)':'(−)'} ${esc(x.descricao||'Lançamento')}</span><span class="val" style="color:${x.tipo==='credito'?'#16a34a':'#dc2626'}">${x.tipo==='desconto'?'− ':''}${brl(x.valor)}</span></div>`).join('')}
        ${r.totalAdt>0?`<div class="linha"><span class="lbl" style="color:#d97706">(−) Adiantamentos</span><span class="val" style="color:#d97706">−${brl(r.totalAdt)}</span></div>`:''}
      </div>
      <div class="total-box">
        <div class="tot-lbl">Total Líquido a Pagar</div>
        <div class="tot-val">${brl(r.aPagar)}</div>
        <div class="tot-ext">${valorExtenso(r.aPagar)}</div>
      </div>
      <div class="destaque">
        Declaro ter recebido <strong>${brl(r.aPagar)}</strong> (${valorExtenso(r.aPagar)})
        referente ao salário de <strong>${MESES[mes-1]}/${ano}</strong>.
        ${r.totalAdt>0?`Adiantamentos de ${brl(r.totalAdt)} já foram pagos anteriormente.`:''}
      </div>
      <div class="assinaturas">
        <div class="assina"><div class="linha-assina"></div>
          <div class="nome-assina">${esc(f.nome)}</div>
          <div class="cargo-assina">Funcionário${f.funcao?' · '+f.funcao:''}</div>
        </div>
        <div class="assina"><div class="linha-assina"></div>
          <div class="nome-assina">${esc(ea.responsavel||ea.nome)}</div>
          <div class="cargo-assina">Empregador · ${esc(ea.nome)}</div>
        </div>
      </div>
      <div class="rodape">Emitido em ${new Date().toLocaleDateString('pt-BR')} · Sem desconto de INSS/IRRF · ${esc(ea.nome)}</div>
    </div>`;
  });
  const w=window.open('','_blank','width=800,height=1100');
  w.document.write(`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
    <title>Folha Completa — ${MESES[mes-1]}/${ano} — ${esc(ea.nome)}</title>${estiloRecibo()}</head><body>
    <button class="no-print" onclick="window.print()" style="position:fixed;top:12px;right:12px;padding:8px 18px;background:#2563eb;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:14px;font-weight:700;z-index:999">🖨️ Imprimir Todos</button>
    ${pgs}</body></html>`);
  w.document.close();
}

let toastTimer=null;
function showToast(tipo,titulo,msg){ let el=document.getElementById('appToast'); if(!el){ el=document.createElement('div'); el.id='appToast'; el.style.cssText='position:fixed;right:18px;bottom:18px;z-index:9999;display:none;max-width:360px;padding:12px 14px;border-radius:12px;border:1px solid #d1d5db;background:#fff;box-shadow:0 10px 28px rgba(0,0,0,.14);font-size:12px;line-height:1.4'; document.body.appendChild(el);} el.style.display='block'; el.style.background=tipo==='ok'?'#dcfce7':(tipo==='err'?'#fee2e2':'#fef3c7'); el.innerHTML='<strong style="display:block;margin-bottom:2px">'+(titulo||'Aviso')+'</strong>'+(msg||''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.display='none',3200); }
function exportarBackup(){ try{ const dados={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k && (k.startsWith('gfp')||k==='fpa'||k.startsWith('fp_'))) dados[k]=localStorage.getItem(k);} const payload={exportadoEm:new Date().toISOString(), sistema:'Folha de Pagamento', versao:'backup-localstorage-v1', dados}; const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=`backup-folha-${ano}-${String(mes).padStart(2,'0')}.json`; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(url); a.remove();},1000); showToast('ok','Backup exportado','Arquivo JSON gerado com sucesso.'); }catch(err){ console.error(err); showToast('err','Falha ao exportar','Não foi possível gerar o backup.'); }}
function importarBackup(event){ const file=event?.target?.files?.[0]; if(!file) return; const reader=new FileReader(); reader.onload=e=>{ try{ const json=JSON.parse(e.target.result); const dados=json?.dados; if(!dados||typeof dados!=='object') throw new Error('Arquivo inválido'); Object.entries(dados).forEach(([k,v])=>{ if(k && (k.startsWith('gfp')||k==='fpa'||k.startsWith('fp_'))) localStorage.setItem(k,String(v));}); event.target.value=''; showToast('ok','Backup importado','Dados restaurados com sucesso. Recarregando...'); setTimeout(()=>location.reload(),900);}catch(err){ console.error(err); event.target.value=''; showToast('err','Importação inválida','O arquivo selecionado não é um backup válido.'); }}; reader.onerror=()=>{ event.target.value=''; showToast('err','Erro de leitura','Não foi possível ler o arquivo.'); }; reader.readAsText(file,'utf-8'); }
