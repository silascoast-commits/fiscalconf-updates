<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lista de Convidados - Rebeca 5 anos</title>
<style>
  body { font-family: Arial, sans-serif; background:#fdf6f9; margin:0; padding:20px; color:#333; }
  h1 { text-align:center; color:#d6336c; }
  .container { max-width:900px; margin:0 auto; }
  .actions { text-align:center; margin-bottom:20px; }
  .actions button { background:#d6336c; color:#fff; border:none; padding:10px 18px; border-radius:6px; cursor:pointer; font-size:14px; margin:0 5px; }
  .actions button:hover { background:#b3265a; }
  .columns { display:flex; gap:30px; flex-wrap:wrap; justify-content:center; }
  .card { background:#fff; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.1); padding:20px; flex:1; min-width:280px; }
  .card h2 { color:#d6336c; border-bottom:2px solid #f3c4d8; padding-bottom:8px; }
  ol { padding-left:20px; }
  li { padding:4px 0; border-bottom:1px dashed #eee; display:flex; justify-content:space-between; align-items:center; }
  li .nome { flex:1; }
  li button.remove { background:none; border:none; color:#d6336c; cursor:pointer; font-size:16px; padding:0 6px; }
  li button.remove:hover { color:#900; }
  .add-form { display:flex; gap:6px; margin-top:12px; }
  .add-form input { flex:1; padding:6px 8px; border:1px solid #ddd; border-radius:6px; }
  .add-form button { background:#28a745; color:#fff; border:none; border-radius:6px; padding:6px 12px; cursor:pointer; }
  .add-form button:hover { background:#1e7e34; }
  .total { text-align:right; font-weight:bold; margin-top:10px; color:#555; }
  .total-geral { text-align:center; margin-top:20px; font-weight:bold; }

  @media print {
    .actions, .add-form, li button.remove { display:none !important; }
    body { background:#fff; }
    .card { box-shadow:none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>Rebeca - 5 anos 🎉</h1>
  <p style="text-align:center;">Lista de Convidados</p>

  <div class="actions">
    <button onclick="window.print()">🖨️ Imprimir lista</button>
  </div>

  <div class="columns">
    <div class="card">
      <h2>Adultos</h2>
      <ol id="lista-adultos"></ol>
      <div class="add-form">
        <input type="text" id="novo-adulto" placeholder="Nome do convidado" onkeydown="if(event.key==='Enter') adicionar('adultos')">
        <button onclick="adicionar('adultos')">+ Incluir</button>
      </div>
      <div class="total" id="total-adultos">Total: 0</div>
    </div>

    <div class="card">
      <h2>Crianças</h2>
      <ol id="lista-criancas"></ol>
      <div class="add-form">
        <input type="text" id="novo-crianca" placeholder="Nome da criança" onkeydown="if(event.key==='Enter') adicionar('criancas')">
        <button onclick="adicionar('criancas')">+ Incluir</button>
      </div>
      <div class="total" id="total-criancas">Total: 0</div>
    </div>
  </div>

  <p class="total-geral" id="total-geral">Total geral: 0 convidados</p>
</div>

<script>
  const adultos = ["Vovô Sebastião","Vovó Casilda","Maria Eduarda","Dani","Marina","Vovó Bela","Sonia","Sandro","Pedro","Dayane","Peterson","Silvia","Toninho","Nicole","Sirlei","Autevan","Shayla","Maiko","Leonardo","Sara","Cássio","Flavia","Claudio","Odília","Thais","Marcus","Gus","Marco","Edneia","Marido","Isabele","Tia Maria","Tia Luiz","Leandro","Silas","Veronica","Edu","Thayná","Isabelly","Renata","Felipe","Natália","Claudia","Michel","Vanessa","Nathan","Debora","Davi","Kelle","Namorada","Sirlene","Aldo","Daiane","Eduardo","Ana Paula","Douglas","Karen","Mariane","Igor"];

  const criancas = ["Luna","Beatriz","José Lucca","Arthur","Bianca","Gaby","Pedro","Gabi Barros","Enrico","Lorenzo","Laura Mendes","Arthur Ramos","Gabi Ramos","Luana","Noah","Gustavo","Felipe","Akemi"];

  function renderizar() {
    renderizarLista('adultos', document.getElementById('lista-adultos'));
    renderizarLista('criancas', document.getElementById('lista-criancas'));
    document.getElementById('total-adultos').textContent = 'Total: ' + adultos.length;
    document.getElementById('total-criancas').textContent = 'Total: ' + criancas.length;
    document.getElementById('total-geral').textContent = 'Total geral: ' + (adultos.length + criancas.length) + ' convidados';
  }

  function renderizarLista(tipo, ol) {
    const arr = tipo === 'adultos' ? adultos : criancas;
    ol.innerHTML = '';
    arr.forEach((nome, i) => {
      const li = document.createElement('li');
      li.innerHTML = '<span class="nome"></span><button class="remove" title="Excluir">✕</button>';
      li.querySelector('.nome').textContent = nome;
      li.querySelector('.remove').onclick = () => excluir(tipo, i);
      ol.appendChild(li);
    });
  }

  function adicionar(tipo) {
    const input = document.getElementById(tipo === 'adultos' ? 'novo-adulto' : 'novo-crianca');
    const nome = input.value.trim();
    if (!nome) return;
    (tipo === 'adultos' ? adultos : criancas).push(nome);
    input.value = '';
    renderizar();
  }

  function excluir(tipo, index) {
    (tipo === 'adultos' ? adultos : criancas).splice(index, 1);
    renderizar();
  }

  renderizar();
</script>
</body>
</html>
