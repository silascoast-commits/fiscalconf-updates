<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folha de Pagamento</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb;
      --primary-light: #dbeafe;
      --green: #16a34a;
      --green-light: #dcfce7;
      --green-border: #86efac;
      --amber: #d97706;
      --amber-light: #fef3c7;
      --red: #dc2626;
      --red-light: #fee2e2;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--gray-50); color: var(--gray-800); min-height: 100vh; }

    /* ─── Header ─── */
    header {
      background: #fff; border-bottom: 1px solid var(--gray-200);
      padding: 0 24px; height: 56px; display: flex; align-items: center;
      gap: 14px; position: sticky; top: 0; z-index: 200; box-shadow: var(--shadow);
    }
    .header-logo { font-size: 22px; line-height: 1; }
    .header-title { font-size: 16px; font-weight: 700; color: var(--gray-900); }
    .header-sub { font-size: 12px; color: var(--gray-400); margin-left: 6px; }
    .header-empresa-ativa {
      margin-left: auto; display: flex; align-items: center; gap: 8px;
      background: var(--green-light); border: 1px solid var(--green-border);
      border-radius: 8px; padding: 4px 12px; font-size: 13px;
    }
    .header-empresa-ativa span { font-weight: 600; color: var(--green); }
    .header-empresa-ativa small { color: var(--gray-500); font-size: 11px; }

    /* ─── Tabs ─── */
    .tabs {
      background: #fff; border-bottom: 2px solid var(--gray-200);
      display: flex; gap: 0; padding: 0 24px;
    }
    .tab-btn {
      padding: 14px 20px; font-size: 14px; font-weight: 600;
      color: var(--gray-500); border: none; background: transparent;
      cursor: pointer; border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: color .15s, border-color .15s;
      display: flex; align-items: center; gap: 8px;
    }
    .tab-btn:hover { color: var(--gray-800); }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ─── Layout ─── */
    main { max-width: 920px; margin: 0 auto; padding: 28px 20px 60px; }

    /* ─── Cards ─── */
    .card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px; }
    .card-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--gray-100); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--gray-800); display: flex; align-items: center; gap: 8px; }
    .card-body { padding: 20px; }

    /* ─── Botões ─── */
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 0 16px; height: 36px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s, background .15s; white-space: nowrap; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-green { background: var(--green); color: #fff; }
    .btn-outline { background: #fff; color: var(--gray-700); border: 1px solid var(--gray-300); }
    .btn-ghost { background: transparent; color: var(--gray-500); border: none; }
    .btn-ghost:hover { background: var(--gray-100); color: var(--gray-700); }
    .btn-danger { background: transparent; color: var(--red); border: none; }
    .btn-danger:hover { background: var(--red-light); }
    .btn-sm { height: 30px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
    .btn-icon { width: 30px; height: 30px; padding: 0; justify-content: center; border-radius: 6px; }

    /* ─── Form ─── */
    .form-box { background: var(--gray-50); border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 18px; margin-bottom: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-grid-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .form-field { display: flex; flex-direction: column; gap: 5px; }
    .form-field label { font-size: 12px; font-weight: 600; color: var(--gray-600); }
    .form-field input, .form-field select {
      height: 36px; border: 1px solid var(--gray-300); border-radius: 7px;
      padding: 0 10px; font-size: 13px; background: #fff; outline: none; color: var(--gray-800);
    }
    .form-field input:focus, .form-field select:focus { border-color: var(--primary); }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ─── Lista empresas ─── */
    .empresa-list { display: flex; flex-direction: column; gap: 10px; }
    .empresa-row {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 18px; border-radius: 10px; border: 2px solid var(--gray-200);
      background: #fff; transition: border-color .15s, background .15s;
    }
    .empresa-row.ativa { border-color: var(--green); background: var(--green-light); }
    .empresa-icon { font-size: 24px; flex-shrink: 0; }
    .empresa-info { flex: 1; min-width: 0; }
    .empresa-nome { font-size: 15px; font-weight: 700; color: var(--gray-900); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .empresa-detalhe { font-size: 12px; color: var(--gray-500); margin-top: 3px; }
    .empresa-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

    /* ─── Badges ─── */
    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 700; }
    .badge-green { background: var(--green); color: #fff; }
    .badge-blue { background: var(--primary-light); color: var(--primary); }
    .badge-gray { background: var(--gray-200); color: var(--gray-600); }

    /* ─── Filtros folha ─── */
    .folha-filtros { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-bottom: 20px; }
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: .04em; }
    .field select, .field input { height: 38px; border: 1px solid var(--gray-300); border-radius: 8px; padding: 0 12px; font-size: 14px; background: #fff; color: var(--gray-800); outline: none; }
    .field select:focus, .field input:focus { border-color: var(--primary); }

    /* ─── Resumo ─── */
    .summary-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 20px; }
    .summary-card { background: #fff; border: 1px solid var(--gray-200); border-radius: var(--radius); padding: 16px 20px; box-shadow: var(--shadow); }
    .summary-label { font-size: 11px; font-weight: 600; color: var(--gray-500); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 4px; }
    .summary-value { font-size: 24px; font-weight: 700; color: var(--gray-900); }
    .summary-value.green { color: var(--green); }
    .summary-value.amber { color: var(--amber); }
    .summary-sub { font-size: 12px; color: var(--gray-400); margin-top: 2px; }

    /* ─── Lista colaboradores ─── */
    .colab-list { display: flex; flex-direction: column; gap: 8px; }
    .colab-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--gray-200); background: #fff; }
    .colab-row.pago { background: var(--green-light); border-color: var(--green-border); }
    .colab-info { flex: 1; min-width: 0; }
    .colab-nome { font-size: 14px; font-weight: 600; color: var(--gray-800); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .colab-row.pago .colab-nome-text { text-decoration: line-through; color: var(--gray-400); }
    .colab-detail { font-size: 12px; color: var(--gray-400); margin-top: 2px; }
    .colab-valor { font-size: 14px; font-weight: 700; color: var(--gray-900); flex-shrink: 0; }
    .colab-row.pago .colab-valor { text-decoration: line-through; color: var(--gray-400); }
    .colab-actions { display: flex; gap: 4px; flex-shrink: 0; }

    /* ─── Misc ─── */
    hr { border: none; border-top: 1px solid var(--gray-200); margin: 16px 0; }
    .list-footer-row { display: flex; justify-content: space-between; align-items: center; font-size: 14px; padding: 3px 0; }
    .list-footer-total { font-size: 18px; font-weight: 700; }
    .text-green { color: var(--green); font-weight: 600; }
    .text-amber { color: var(--amber); font-weight: 600; }
    .empty { padding: 48px 20px; text-align: center; color: var(--gray-400); }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty p { font-size: 14px; margin-bottom: 14px; }
    .form-total { font-size: 13px; color: var(--gray-500); margin-bottom: 12px; }
    .form-total strong { font-size: 16px; color: var(--gray-900); }
    .aviso { text-align: center; font-size: 12px; color: var(--gray-400); margin-top: 8px; }

    /* ─── Alerta empresa ─── */
    .alerta-empresa {
      background: #fffbeb; border: 1px solid #fde68a; border-radius: var(--radius);
      padding: 16px 20px; display: flex; align-items: center; gap: 12px;
      font-size: 14px; color: var(--amber); margin-bottom: 20px;
    }
    .alerta-empresa strong { color: var(--gray-800); }

    /* ─── Print ─── */
    @media print {
      .tabs, .btn, .colab-actions, .empresa-actions, .aviso,
      .form-box, .folha-filtros, .alerta-empresa { display: none !important; }
      body { background: #fff; }
      main { padding: 0; max-width: 100%; }
      .card { box-shadow: none; border: 1px solid #ccc; }
      header { position: static; }
    }

    @media (max-width: 640px) {
      .summary-grid { grid-template-columns: 1fr; }
      .form-grid, .form-grid-3, .form-grid-4 { grid-template-columns: 1fr; }
      .empresa-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<header>
  <div class="header-logo">📋</div>
  <div>
    <span class="header-title">Folha de Pagamento</span>
    <span class="header-sub">Colaboradores Informais</span>
  </div>
  <div id="headerEmpresa" style="margin-left:auto;"></div>
</header>

<!-- ═══ TABS ═══ -->
<div class="tabs">
  <button class="tab-btn active" id="tabEmpresasBtn" onclick="mudarTab('empresas')">🏢 Empresas</button>
  <button class="tab-btn" id="tabFolhaBtn" onclick="mudarTab('folha')">👥 Folha de Pagamento</button>
</div>

<!-- ═══ MAIN ═══ -->
<main>
  <div id="tabEmpresasContent"></div>
  <div id="tabFolhaContent" style="display:none;"></div>
</main>

<script>
// ══════════════════════════════════════════════════════════════
// ESTADO GLOBAL
// ══════════════════════════════════════════════════════════════
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const hoje = new Date();

let tabAtiva = 'empresas';
let empresaEditandoId = null;
let mostrarFormEmpresa = false;

let mes = hoje.getMonth() + 1;
let ano = hoje.getFullYear();
let mostrarFormColab = false;
let colabEditandoId = null;

// ══════════════════════════════════════════════════════════════
// STORAGE — EMPRESAS
// ══════════════════════════════════════════════════════════════
function getEmpresas() {
  try { return JSON.parse(localStorage.getItem('fp_empresas') || '[]'); } catch { return []; }
}
function setEmpresas(list) { localStorage.setItem('fp_empresas', JSON.stringify(list)); }

function getEmpresaAtivaId() { return localStorage.getItem('fp_empresa_ativa') || null; }
function setEmpresaAtivaId(id) {
  if (id) localStorage.setItem('fp_empresa_ativa', id);
  else localStorage.removeItem('fp_empresa_ativa');
}
function getEmpresaAtiva() {
  const id = getEmpresaAtivaId();
  if (!id) return null;
  return getEmpresas().find(e => e.id === id) || null;
}

// ══════════════════════════════════════════════════════════════
// STORAGE — COLABORADORES
// ══════════════════════════════════════════════════════════════
function colabKey(empresaId) {
  return `fp_colabs_${empresaId}_${ano}_${String(mes).padStart(2,'0')}`;
}
function getColabs(empresaId) {
  try { return JSON.parse(localStorage.getItem(colabKey(empresaId)) || '[]'); } catch { return []; }
}
function setColabs(empresaId, list) { localStorage.setItem(colabKey(empresaId), JSON.stringify(list)); }

// ══════════════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════════════
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function formatBRL(v) { return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function calcTotal(c) {
  if (c.tipoCalculo === 'fixo') return Number(c.valorUnitario)||0;
  return (Number(c.quantidade)||0) * (Number(c.valorUnitario)||0);
}
function labelTipo(c) {
  if (c.tipoCalculo === 'fixo') return 'Valor fixo mensal';
  const un = c.tipoCalculo === 'diaria' ? (c.quantidade==1?'dia':'dias') : (c.quantidade==1?'hora':'horas');
  return `${c.quantidade} ${un} × ${formatBRL(c.valorUnitario)}`;
}

// ══════════════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════════════
function mudarTab(tab) {
  tabAtiva = tab;
  document.getElementById('tabEmpresasBtn').classList.toggle('active', tab === 'empresas');
  document.getElementById('tabFolhaBtn').classList.toggle('active', tab === 'folha');
  document.getElementById('tabEmpresasContent').style.display = tab === 'empresas' ? '' : 'none';
  document.getElementById('tabFolhaContent').style.display = tab === 'folha' ? '' : 'none';
  if (tab === 'empresas') renderEmpresas();
  else renderFolha();
}

// ══════════════════════════════════════════════════════════════
// HEADER
// ══════════════════════════════════════════════════════════════
function renderHeader() {
  const ea = getEmpresaAtiva();
  const el = document.getElementById('headerEmpresa');
  if (ea) {
    el.innerHTML = `
      <div class="header-empresa-ativa">
        🏢 <span>${esc(ea.nome)}</span>
        <small>ATIVA</small>
        <button class="btn btn-ghost btn-sm" style="margin-left:4px;height:24px;padding:0 8px;font-size:11px;" onclick="desativarEmpresa()">✕</button>
      </div>`;
  } else {
    el.innerHTML = `<span style="font-size:12px;color:var(--gray-400);">Nenhuma empresa ativa</span>`;
  }
}

// ══════════════════════════════════════════════════════════════
// ABA EMPRESAS
// ══════════════════════════════════════════════════════════════
function renderEmpresas() {
  renderHeader();
  const empresas = getEmpresas();
  const ativaId = getEmpresaAtivaId();
  const el = document.getElementById('tabEmpresasContent');

  let html = `
    <div class="card">
      <div class="card-header">
        <div class="card-title">🏢 Empresas Cadastradas</div>
        <button class="btn btn-primary btn-sm" onclick="abrirFormEmpresa()">+ Nova Empresa</button>
      </div>
      <div class="card-body">`;

  if (mostrarFormEmpresa) {
    const e = empresaEditandoId ? getEmpresas().find(x => x.id === empresaEditandoId) : null;
    html += renderFormEmpresa(e);
  }

  if (empresas.length === 0 && !mostrarFormEmpresa) {
    html += `
      <div class="empty">
        <div class="empty-icon">🏢</div>
        <p>Nenhuma empresa cadastrada ainda.</p>
        <button class="btn btn-primary" onclick="abrirFormEmpresa()">+ Cadastrar primeira empresa</button>
      </div>`;
  } else {
    html += `<div class="empresa-list">`;
    empresas.forEach(e => {
      if (empresaEditandoId === e.id) {
        html += renderFormEmpresa(e);
      } else {
        const isAtiva = e.id === ativaId;
        html += `
          <div class="empresa-row ${isAtiva ? 'ativa' : ''}">
            <div class="empresa-icon">🏢</div>
            <div class="empresa-info">
              <div class="empresa-nome">
                ${esc(e.nome)}
                ${isAtiva ? `<span class="badge badge-green">✓ ATIVA</span>` : ''}
              </div>
              <div class="empresa-detalhe">
                ${e.cnpj ? `CNPJ: ${esc(e.cnpj)}` : ''}
                ${e.cnpj && e.responsavel ? ' · ' : ''}
                ${e.responsavel ? `Resp.: ${esc(e.responsavel)}` : ''}
                ${(e.cnpj || e.responsavel) && e.telefone ? ' · ' : ''}
                ${e.telefone ? `Tel.: ${esc(e.telefone)}` : ''}
                ${!e.cnpj && !e.responsavel && !e.telefone ? '<span style="color:var(--gray-300)">Sem informações adicionais</span>' : ''}
              </div>
            </div>
            <div class="empresa-actions">
              ${!isAtiva
                ? `<button class="btn btn-green btn-sm" onclick="ativarEmpresa('${e.id}')">⚡ Ativar</button>`
                : `<button class="btn btn-outline btn-sm" onclick="irParaFolha()">📋 Ver Folha</button>`
              }
              <button class="btn btn-ghost btn-icon" onclick="editarEmpresa('${e.id}')" title="Editar">✏️</button>
              <button class="btn btn-danger btn-icon" onclick="excluirEmpresa('${e.id}')" title="Excluir">🗑️</button>
            </div>
          </div>`;
      }
    });
    html += `</div>`;
  }

  html += `</div></div>`;
  el.innerHTML = html;
}

function renderFormEmpresa(e) {
  const id = e ? e.id : '';
  return `
    <div class="form-box">
      <div style="font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:14px;">
        ${id ? '✏️ Editar Empresa' : '➕ Nova Empresa'}
      </div>
      <div class="form-grid">
        <div class="form-field" style="grid-column:1/-1;">
          <label>Nome da Empresa *</label>
          <input type="text" id="eNome" placeholder="Razão social ou nome fantasia" value="${esc(e?.nome||'')}" />
        </div>
      </div>
      <div class="form-grid-3">
        <div class="form-field">
          <label>CNPJ / CPF</label>
          <input type="text" id="eCnpj" placeholder="00.000.000/0001-00" value="${esc(e?.cnpj||'')}" />
        </div>
        <div class="form-field">
          <label>Responsável</label>
          <input type="text" id="eResp" placeholder="Nome do responsável" value="${esc(e?.responsavel||'')}" />
        </div>
        <div class="form-field">
          <label>Telefone</label>
          <input type="text" id="eTel" placeholder="(00) 00000-0000" value="${esc(e?.telefone||'')}" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost btn-sm" onclick="cancelarFormEmpresa()">✕ Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="salvarEmpresa('${id}')">💾 Salvar Empresa</button>
      </div>
    </div>`;
}

function abrirFormEmpresa() {
  mostrarFormEmpresa = true;
  empresaEditandoId = null;
  renderEmpresas();
  setTimeout(() => document.getElementById('eNome')?.focus(), 50);
}

function cancelarFormEmpresa() {
  mostrarFormEmpresa = false;
  empresaEditandoId = null;
  renderEmpresas();
}

function salvarEmpresa(id) {
  const nome = document.getElementById('eNome')?.value.trim();
  if (!nome) { alert('Informe o nome da empresa.'); return; }
  const dados = {
    nome,
    cnpj: document.getElementById('eCnpj')?.value.trim() || '',
    responsavel: document.getElementById('eResp')?.value.trim() || '',
    telefone: document.getElementById('eTel')?.value.trim() || '',
  };
  const lista = getEmpresas();
  if (id) {
    const idx = lista.findIndex(e => e.id === id);
    if (idx !== -1) lista[idx] = { ...lista[idx], ...dados };
  } else {
    lista.push({ id: genId(), ...dados });
  }
  setEmpresas(lista);
  mostrarFormEmpresa = false;
  empresaEditandoId = null;
  renderEmpresas();
}

function editarEmpresa(id) {
  empresaEditandoId = id;
  mostrarFormEmpresa = false;
  renderEmpresas();
  setTimeout(() => document.getElementById('eNome')?.focus(), 50);
}

function excluirEmpresa(id) {
  const e = getEmpresas().find(x => x.id === id);
  if (!confirm(`Excluir a empresa "${e?.nome}"? Esta ação não pode ser desfeita.`)) return;
  setEmpresas(getEmpresas().filter(x => x.id !== id));
  if (getEmpresaAtivaId() === id) setEmpresaAtivaId(null);
  renderEmpresas();
}

function ativarEmpresa(id) {
  setEmpresaAtivaId(id);
  mostrarFormColab = false;
  colabEditandoId = null;
  renderEmpresas();
}

function desativarEmpresa() {
  setEmpresaAtivaId(null);
  renderHeader();
  if (tabAtiva === 'folha') renderFolha();
}

function irParaFolha() {
  mudarTab('folha');
}

// ══════════════════════════════════════════════════════════════
// ABA FOLHA
// ══════════════════════════════════════════════════════════════
function renderFolha() {
  renderHeader();
  const el = document.getElementById('tabFolhaContent');
  const ea = getEmpresaAtiva();

  // ── Selects de mês/ano (rebuild once)
  let filtrosHtml = `
    <div class="folha-filtros">
      <div class="field">
        <label>Mês</label>
        <select id="mesSelect" onchange="onMesChange(this.value)">
          ${MESES.map((m,i) => `<option value="${i+1}" ${i+1===mes?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <div class="field">
        <label>Ano</label>
        <select id="anoSelect" onchange="onAnoChange(this.value)">
          ${Array.from({length:6},(_,i)=>ano-2+i).map(y=>`<option value="${y}" ${y===ano?'selected':''}>${y}</option>`).join('')}
        </select>
      </div>
      <div style="margin-left:auto;display:flex;gap:8px;align-items:flex-end;">
        <button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ Imprimir</button>
      </div>
    </div>`;

  if (!ea) {
    el.innerHTML = filtrosHtml + `
      <div class="alerta-empresa">
        <span style="font-size:22px;">⚠️</span>
        <div>
          <strong>Nenhuma empresa ativa.</strong>
          Vá até a aba <strong>Empresas</strong>, selecione uma empresa e clique em
          <strong>⚡ Ativar</strong> para lançar a folha.
          <div style="margin-top:8px;">
            <button class="btn btn-primary btn-sm" onclick="mudarTab('empresas')">🏢 Ir para Empresas</button>
          </div>
        </div>
      </div>`;
    return;
  }

  const colabs = getColabs(ea.id);
  const totalGeral = colabs.reduce((s,c) => s+calcTotal(c), 0);
  const totalPago  = colabs.filter(c=>c.pago).reduce((s,c) => s+calcTotal(c), 0);
  const totalPend  = totalGeral - totalPago;
  const qtdPagos   = colabs.filter(c=>c.pago).length;
  const qtdPend    = colabs.filter(c=>!c.pago).length;
  const periodo    = `${MESES[mes-1]}/${ano}`;

  let html = filtrosHtml;

  // Banner empresa ativa
  html += `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 16px;background:var(--green-light);border:1px solid var(--green-border);border-radius:var(--radius);font-size:13px;">
      🏢 <strong style="color:var(--green);">${esc(ea.nome)}</strong>
      ${ea.cnpj ? `<span style="color:var(--gray-500);">· ${esc(ea.cnpj)}</span>` : ''}
      <button class="btn btn-ghost btn-sm" style="margin-left:auto;" onclick="mudarTab('empresas')">Trocar empresa</button>
    </div>`;

  // Resumo
  html += `
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-label">Total Geral</div>
        <div class="summary-value">${formatBRL(totalGeral)}</div>
        <div class="summary-sub">${colabs.length} colaborador${colabs.length!==1?'es':''}</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Já Pago</div>
        <div class="summary-value green">${formatBRL(totalPago)}</div>
        <div class="summary-sub">${qtdPagos} pago${qtdPagos!==1?'s':''}</div>
      </div>
      <div class="summary-card">
        <div class="summary-label">Pendente</div>
        <div class="summary-value ${totalPend>0?'amber':''}">${formatBRL(totalPend)}</div>
        <div class="summary-sub">${qtdPend} pendente${qtdPend!==1?'s':''}</div>
      </div>
    </div>`;

  // Lista
  html += `
    <div class="card">
      <div class="card-header">
        <div class="card-title">👥 Colaboradores — ${periodo}</div>
        <button class="btn btn-primary btn-sm" onclick="abrirFormColab()">+ Adicionar</button>
      </div>
      <div class="card-body">`;

  if (mostrarFormColab && !colabEditandoId) html += renderFormColab(null, ea.id);

  if (colabs.length === 0 && !mostrarFormColab) {
    html += `
      <div class="empty">
        <div class="empty-icon">👥</div>
        <p>Nenhum colaborador lançado para ${periodo}.</p>
        <button class="btn btn-outline" onclick="abrirFormColab()">+ Adicionar primeiro colaborador</button>
      </div>`;
  } else {
    html += `<div class="colab-list">`;
    colabs.forEach(c => {
      html += colabEditandoId === c.id ? renderFormColab(c, ea.id) : renderColabRow(c, ea.id);
    });
    html += `</div>`;

    if (colabs.length > 0) {
      html += `<hr>
        <div>
          <div class="list-footer-row">
            <span style="color:var(--gray-500);">Total — ${colabs.length} colaborador${colabs.length!==1?'es':''}</span>
            <span class="list-footer-total">${formatBRL(totalGeral)}</span>
          </div>
          ${totalPago>0?`<div class="list-footer-row"><span class="text-green">Pago</span><span class="text-green">${formatBRL(totalPago)}</span></div>`:''}
          ${totalPend>0?`<div class="list-footer-row"><span class="text-amber">Pendente</span><span class="text-amber">${formatBRL(totalPend)}</span></div>`:''}
        </div>`;
    }
  }

  html += `</div></div>
    <p class="aviso">Sistema para pagamentos informais sem vínculo empregatício · Sem cálculo de INSS, IRRF ou encargos</p>`;

  el.innerHTML = html;
}

function onMesChange(v) { mes = Number(v); mostrarFormColab = false; colabEditandoId = null; renderFolha(); }
function onAnoChange(v) { ano = Number(v); mostrarFormColab = false; colabEditandoId = null; renderFolha(); }

// ─── Formulário colaborador ───────────────────────────────────
function renderFormColab(c, empresaId) {
  const id   = c ? c.id : '';
  const tipo = c ? c.tipoCalculo : 'diaria';
  return `
    <div class="form-box">
      <div style="font-size:13px;font-weight:700;color:var(--gray-700);margin-bottom:14px;">
        ${id ? '✏️ Editar Colaborador' : '➕ Novo Colaborador'}
      </div>
      <div class="form-grid">
        <div class="form-field">
          <label>Nome *</label>
          <input type="text" id="cNome" placeholder="Nome do colaborador" value="${esc(c?.nome||'')}" />
        </div>
        <div class="form-field">
          <label>Função / Serviço</label>
          <input type="text" id="cFuncao" placeholder="Ex.: Diarista, Pintor..." value="${esc(c?.funcao||'')}" />
        </div>
      </div>
      <div class="form-grid-3">
        <div class="form-field">
          <label>Tipo de cálculo</label>
          <select id="cTipo" onchange="onTipoChange()">
            <option value="diaria" ${tipo==='diaria'?'selected':''}>Por dia trabalhado</option>
            <option value="hora"   ${tipo==='hora'?'selected':''}>Por hora trabalhada</option>
            <option value="fixo"   ${tipo==='fixo'?'selected':''}>Valor fixo mensal</option>
          </select>
        </div>
        <div class="form-field" id="cQtdWrap" style="${tipo==='fixo'?'display:none':''}">
          <label id="cQtdLabel">${tipo==='hora'?'Horas':'Dias'} trabalhados</label>
          <input type="number" id="cQtd" min="0" step="0.5" placeholder="0" value="${c&&c.tipoCalculo!=='fixo'?c.quantidade:''}" oninput="onTotalChange()" />
        </div>
        <div class="form-field">
          <label id="cValLabel">${tipo==='fixo'?'Valor mensal':tipo==='hora'?'Valor/hora':'Valor/dia'} (R$)</label>
          <input type="number" id="cVal" min="0" step="0.01" placeholder="0,00" value="${esc(c?.valorUnitario||'')}" oninput="onTotalChange()" />
        </div>
      </div>
      <div class="form-field" style="margin-bottom:12px;">
        <label>Observação</label>
        <input type="text" id="cObs" placeholder="Período, detalhes..." value="${esc(c?.observacao||'')}" />
      </div>
      <div class="form-total" id="cTotalLine" style="display:none;">
        Total a pagar: <strong id="cTotalVal"></strong>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost btn-sm" onclick="cancelarFormColab()">✕ Cancelar</button>
        <button class="btn btn-primary btn-sm" onclick="salvarColab('${id}','${empresaId}')">💾 Salvar</button>
      </div>
    </div>`;
}

function onTipoChange() {
  const tipo = document.getElementById('cTipo')?.value;
  if (!tipo) return;
  const wrap = document.getElementById('cQtdWrap');
  const lbl  = document.getElementById('cQtdLabel');
  const vLbl = document.getElementById('cValLabel');
  if (wrap) wrap.style.display = tipo === 'fixo' ? 'none' : '';
  if (lbl)  lbl.textContent = tipo === 'hora' ? 'Horas trabalhadas' : 'Dias trabalhados';
  if (vLbl) vLbl.textContent = tipo === 'fixo' ? 'Valor mensal (R$)' : tipo === 'hora' ? 'Valor/hora (R$)' : 'Valor/dia (R$)';
  onTotalChange();
}

function onTotalChange() {
  const tipo  = document.getElementById('cTipo')?.value;
  const qtd   = parseFloat(document.getElementById('cQtd')?.value||'0')||0;
  const val   = parseFloat(document.getElementById('cVal')?.value||'0')||0;
  const total = tipo === 'fixo' ? val : qtd * val;
  const line  = document.getElementById('cTotalLine');
  const vEl   = document.getElementById('cTotalVal');
  if (line && vEl) {
    line.style.display = total > 0 ? '' : 'none';
    if (total > 0) vEl.textContent = formatBRL(total);
  }
}

function abrirFormColab() { mostrarFormColab = true; colabEditandoId = null; renderFolha(); setTimeout(()=>document.getElementById('cNome')?.focus(),50); }
function cancelarFormColab() { mostrarFormColab = false; colabEditandoId = null; renderFolha(); }

function salvarColab(id, empresaId) {
  const nome = document.getElementById('cNome')?.value.trim();
  if (!nome) { alert('Informe o nome do colaborador.'); return; }
  const dados = {
    nome,
    funcao:        document.getElementById('cFuncao')?.value.trim()||'',
    tipoCalculo:   document.getElementById('cTipo')?.value||'diaria',
    quantidade:    parseFloat(document.getElementById('cQtd')?.value||'0')||0,
    valorUnitario: parseFloat(document.getElementById('cVal')?.value||'0')||0,
    observacao:    document.getElementById('cObs')?.value.trim()||'',
  };
  const lista = getColabs(empresaId);
  if (id) {
    const idx = lista.findIndex(c => c.id === id);
    if (idx !== -1) lista[idx] = { ...lista[idx], ...dados };
  } else {
    lista.push({ id: genId(), pago: false, ...dados });
  }
  setColabs(empresaId, lista);
  mostrarFormColab = false;
  colabEditandoId  = null;
  renderFolha();
}

// ─── Linha colaborador ────────────────────────────────────────
function renderColabRow(c, empresaId) {
  const total   = calcTotal(c);
  const detalhe = labelTipo(c) + (c.observacao ? ` · ${c.observacao}` : '');
  return `
    <div class="colab-row ${c.pago?'pago':''}">
      <button class="btn btn-ghost btn-icon" onclick="togglePago('${c.id}','${empresaId}')" title="${c.pago?'Marcar não pago':'Marcar pago'}" style="font-size:18px;">
        ${c.pago ? '✅' : '🕐'}
      </button>
      <div class="colab-info">
        <div class="colab-nome">
          <span class="colab-nome-text">${esc(c.nome)}</span>
          ${c.funcao ? `<span class="badge badge-blue">${esc(c.funcao)}</span>` : ''}
          ${c.pago ? `<span class="badge" style="background:var(--green);color:#fff;">Pago</span>` : ''}
        </div>
        <div class="colab-detail">${esc(detalhe)}</div>
      </div>
      <div class="colab-valor">${formatBRL(total)}</div>
      <div class="colab-actions">
        <button class="btn btn-ghost btn-icon" onclick="editarColab('${c.id}')" title="Editar">✏️</button>
        <button class="btn btn-danger btn-icon" onclick="removerColab('${c.id}','${empresaId}')" title="Remover">🗑️</button>
      </div>
    </div>`;
}

function togglePago(id, empresaId) {
  const lista = getColabs(empresaId);
  const idx   = lista.findIndex(c => c.id === id);
  if (idx !== -1) lista[idx].pago = !lista[idx].pago;
  setColabs(empresaId, lista);
  renderFolha();
}

function editarColab(id) {
  mostrarFormColab = false;
  colabEditandoId  = id;
  renderFolha();
  setTimeout(()=>document.getElementById('cNome')?.focus(),50);
}

function removerColab(id, empresaId) {
  if (!confirm('Remover este colaborador?')) return;
  setColabs(empresaId, getColabs(empresaId).filter(c => c.id !== id));
  renderFolha();
}

// ══════════════════════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════════════════════
renderHeader();
renderEmpresas();
</script>
