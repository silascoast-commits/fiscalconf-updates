<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Folha de Pagamento</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb; --primary-light: #dbeafe;
      --green: #16a34a;   --green-light: #dcfce7; --green-border: #86efac;
      --amber: #d97706;   --amber-light: #fef3c7;
      --purple: #7c3aed;  --purple-light: #ede9fe;
      --red: #dc2626;     --red-light: #fee2e2;
      --gray-50:#f9fafb; --gray-100:#f3f4f6; --gray-200:#e5e7eb;
      --gray-300:#d1d5db; --gray-400:#9ca3af; --gray-500:#6b7280;
      --gray-600:#4b5563; --gray-700:#374151; --gray-800:#1f2937; --gray-900:#111827;
      --radius:10px; --shadow:0 1px 4px rgba(0,0,0,.08);
    }
    body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--gray-50); color:var(--gray-800); min-height:100vh; }

    /* ── Header ── */
    header { background:#fff; border-bottom:1px solid var(--gray-200); padding:0 24px; height:56px; display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:200; box-shadow:var(--shadow); }
    .h-title { font-size:16px; font-weight:700; color:var(--gray-900); }
    .h-sub   { font-size:12px; color:var(--gray-400); margin-left:6px; }
    .h-empresa { margin-left:auto; display:flex; align-items:center; gap:8px; background:var(--green-light); border:1px solid var(--green-border); border-radius:8px; padding:4px 12px; font-size:13px; }
    .h-empresa strong { font-weight:600; color:var(--green); }

    /* ── Tabs ── */
    .tabs { background:#fff; border-bottom:2px solid var(--gray-200); display:flex; padding:0 24px; }
    .tab-btn { padding:13px 20px; font-size:14px; font-weight:600; color:var(--gray-500); border:none; background:transparent; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-2px; transition:color .15s,border-color .15s; }
    .tab-btn:hover { color:var(--gray-800); }
    .tab-btn.active { color:var(--primary); border-bottom-color:var(--primary); }

    /* ── Layout ── */
    main { max-width:960px; margin:0 auto; padding:28px 20px 60px; }

    /* ── Card ── */
    .card { background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius); box-shadow:var(--shadow); margin-bottom:20px; }
    .card-header { padding:14px 20px; border-bottom:1px solid var(--gray-100); display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .card-title { font-size:15px; font-weight:600; color:var(--gray-800); display:flex; align-items:center; gap:8px; }
    .card-body { padding:20px; }

    /* ── Botões ── */
    .btn { display:inline-flex; align-items:center; gap:6px; padding:0 16px; height:36px; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; border:none; transition:opacity .15s; white-space:nowrap; }
    .btn:hover { opacity:.85; }
    .btn-primary { background:var(--primary); color:#fff; }
    .btn-green   { background:var(--green);   color:#fff; }
    .btn-outline { background:#fff; color:var(--gray-700); border:1px solid var(--gray-300); }
    .btn-ghost   { background:transparent; color:var(--gray-500); border:none; }
    .btn-ghost:hover { background:var(--gray-100); color:var(--gray-700); }
    .btn-danger  { background:transparent; color:var(--red); border:none; }
    .btn-danger:hover { background:var(--red-light); }
    .btn-sm   { height:30px; padding:0 10px; font-size:12px; border-radius:7px; }
    .btn-icon { width:30px; height:30px; padding:0; justify-content:center; border-radius:6px; }

    /* ── Form ── */
    .form-box { background:var(--gray-50); border:1px solid var(--gray-200); border-radius:var(--radius); padding:18px; margin-bottom:14px; }
    .form-title { font-size:13px; font-weight:700; color:var(--gray-700); margin-bottom:14px; }
    .fg1 { display:grid; grid-template-columns:1fr; gap:12px; margin-bottom:12px; }
    .fg2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    .fg3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; margin-bottom:12px; }
    .fg4 { display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:12px; margin-bottom:12px; }
    .ff { display:flex; flex-direction:column; gap:5px; }
    .ff label { font-size:12px; font-weight:600; color:var(--gray-600); }
    .ff input,.ff select { height:36px; border:1px solid var(--gray-300); border-radius:7px; padding:0 10px; font-size:13px; background:#fff; outline:none; color:var(--gray-800); }
    .ff input:focus,.ff select:focus { border-color:var(--primary); }
    .form-actions { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
    .section-divider { font-size:11px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.06em; margin:14px 0 10px; padding-bottom:6px; border-bottom:1px solid var(--gray-200); }

    /* ── Empresas ── */
    .emp-list { display:flex; flex-direction:column; gap:10px; }
    .emp-row { display:flex; align-items:center; gap:14px; padding:14px 18px; border-radius:10px; border:2px solid var(--gray-200); background:#fff; }
    .emp-row.ativa { border-color:var(--green); background:var(--green-light); }
    .emp-info { flex:1; min-width:0; }
    .emp-nome { font-size:15px; font-weight:700; color:var(--gray-900); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .emp-det  { font-size:12px; color:var(--gray-500); margin-top:3px; line-height:1.6; }
    .emp-actions { display:flex; gap:6px; flex-shrink:0; align-items:center; }

    /* ── CNPJ lookup ── */
    .cnpj-wrap { position:relative; }
    .cnpj-ico { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:16px; pointer-events:none; }
    .spin { width:16px; height:16px; border:2px solid var(--gray-300); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; display:inline-block; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .cnpj-res { margin-top:6px; padding:10px 12px; border-radius:8px; font-size:12px; display:none; }
    .cnpj-res.ok   { background:var(--green-light); border:1px solid var(--green-border); color:var(--green); display:block; }
    .cnpj-res.erro { background:var(--red-light); border:1px solid #fca5a5; color:var(--red); display:block; }

    /* ── Filtros folha ── */
    .filtros { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin-bottom:20px; }
    .fld { display:flex; flex-direction:column; gap:5px; }
    .fld label { font-size:11px; font-weight:600; color:var(--gray-500); text-transform:uppercase; letter-spacing:.04em; }
    .fld select,.fld input { height:38px; border:1px solid var(--gray-300); border-radius:8px; padding:0 12px; font-size:14px; background:#fff; color:var(--gray-800); outline:none; }

    /* ── Resumo ── */
    .sum-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px; }
    .sum-card { background:#fff; border:1px solid var(--gray-200); border-radius:var(--radius); padding:14px 18px; box-shadow:var(--shadow); }
    .sum-lbl { font-size:10px; font-weight:700; color:var(--gray-500); text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
    .sum-val { font-size:20px; font-weight:700; color:var(--gray-900); }
    .sum-val.green  { color:var(--green); }
    .sum-val.amber  { color:var(--amber); }
    .sum-val.purple { color:var(--purple); }
    .sum-sub { font-size:11px; color:var(--gray-400); margin-top:2px; }

    /* ── Colaborador row ── */
    .colab-card { border:1px solid var(--gray-200); border-radius:10px; background:#fff; margin-bottom:10px; overflow:hidden; }
    .colab-card.pago { border-color:var(--green-border); background:var(--green-light); }
    .colab-header { display:flex; align-items:center; gap:12px; padding:12px 16px; cursor:pointer; }
    .colab-header:hover { background:var(--gray-50); }
    .colab-card.pago .colab-header:hover { background:#bbf7d030; }
    .colab-status { font-size:20px; flex-shrink:0; }
    .colab-info { flex:1; min-width:0; }
    .colab-nome { font-size:14px; font-weight:700; color:var(--gray-900); display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
    .colab-card.pago .colab-nome-txt { text-decoration:line-through; color:var(--gray-400); }
    .colab-sub { font-size:12px; color:var(--gray-400); margin-top:2px; }
    .colab-val { text-align:right; flex-shrink:0; }
    .colab-val-main { font-size:15px; font-weight:700; color:var(--gray-900); }
    .colab-card.pago .colab-val-main { text-decoration:line-through; color:var(--gray-400); }
    .colab-val-sub { font-size:11px; color:var(--gray-400); margin-top:1px; }
    .colab-actions { display:flex; gap:4px; flex-shrink:0; }
    .colab-body { border-top:1px solid var(--gray-100); padding:14px 16px; background:#fafafa; }
    .colab-card.pago .colab-body { background:#f0fdf450; }

    /* ── Tabela de cálculo ── */
    .calc-table { width:100%; border-collapse:collapse; font-size:13px; }
    .calc-table td { padding:5px 8px; }
    .calc-table td:last-child { text-align:right; font-weight:600; white-space:nowrap; }
    .calc-table tr.subtotal td { border-top:1px solid var(--gray-200); font-weight:700; padding-top:8px; }
    .calc-table tr.total-pagar td { border-top:2px solid var(--gray-300); font-size:15px; font-weight:700; color:var(--primary); padding-top:10px; }
    .calc-table tr.custo td { font-size:12px; color:var(--gray-500); }
    .calc-table tr.deducao td:last-child { color:var(--red); }
    .calc-table tr.fgts td { color:var(--purple); }
    .calc-section { font-size:11px; font-weight:700; color:var(--gray-400); text-transform:uppercase; letter-spacing:.05em; padding:10px 8px 4px; }
    .calc-badge { display:inline-block; padding:1px 7px; border-radius:99px; font-size:10px; font-weight:700; background:var(--primary-light); color:var(--primary); margin-left:6px; }
    .calc-badge.amber { background:var(--amber-light); color:var(--amber); }
    .calc-badge.purple { background:var(--purple-light); color:var(--purple); }

    /* ── Misc ── */
    .badge { display:inline-flex; align-items:center; padding:2px 8px; border-radius:99px; font-size:11px; font-weight:700; }
    .badge-green  { background:var(--green);  color:#fff; }
    .badge-blue   { background:var(--primary-light); color:var(--primary); }
    .badge-amber  { background:var(--amber-light);   color:var(--amber); }
    .badge-purple { background:var(--purple-light);  color:var(--purple); }
    hr { border:none; border-top:1px solid var(--gray-200); margin:14px 0; }
    .lf-row { display:flex; justify-content:space-between; align-items:center; font-size:14px; padding:3px 0; }
    .lf-total { font-size:18px; font-weight:700; }
    .text-green  { color:var(--green);  font-weight:600; }
    .text-amber  { color:var(--amber);  font-weight:600; }
    .text-purple { color:var(--purple); font-weight:600; }
    .empty { padding:48px 20px; text-align:center; color:var(--gray-400); }
    .empty-icon { font-size:40px; margin-bottom:12px; }
    .empty p { font-size:14px; margin-bottom:14px; }
    .aviso { text-align:center; font-size:12px; color:var(--gray-400); margin-top:8px; }
    .alerta { background:#fffbeb; border:1px solid #fde68a; border-radius:var(--radius); padding:16px 20px; display:flex; align-items:flex-start; gap:12px; font-size:14px; color:var(--amber); margin-bottom:20px; }
    .alerta strong { color:var(--gray-800); }
    .empresa-banner { display:flex; align-items:center; gap:10px; margin-bottom:16px; padding:10px 16px; background:var(--green-light); border:1px solid var(--green-border); border-radius:var(--radius); font-size:13px; }

    /* ── Print ── */
    @media print {
      .tabs,.btn,.colab-actions,.emp-actions,.aviso,.form-box,
      .filtros,.alerta,.colab-header-toggle { display:none !important; }
      body { background:#fff; }
      main { padding:0; max-width:100%; }
      .card { box-shadow:none; border:1px solid #ccc; }
      header { position:static; box-shadow:none; }
      .colab-body { display:block !important; }
    }

    @media (max-width:680px) {
      .sum-grid { grid-template-columns:1fr 1fr; }
      .fg2,.fg3,.fg4 { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

<header>
  <span style="font-size:22px">📋</span>
  <div>
    <span class="h-title">Folha de Pagamento</span>
    <span class="h-sub">Colaboradores Informais</span>
  </div>
  <div id="hEmpresa" style="margin-left:auto;"></div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabEmpBtn" onclick="tab('emp')">🏢 Empresas</button>
  <button class="tab-btn" id="tabFolhaBtn" onclick="tab('folha')">👥 Folha de Pagamento</button>
</div>

<main>
  <div id="pgEmp"></div>
  <div id="pgFolha" style="display:none;"></div>
</main>

<script>
// ══════════════════════════════════════════════════════
// ESTADO
// ══════════════════════════════════════════════════════
const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
               'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const hoje  = new Date();
let tabAtiva = 'emp';
let empFormAberto = false, empEditId = null;
let mes = hoje.getMonth()+1, ano = hoje.getFullYear();
let colabFormAberto = false, colabEditId = null;
let colabExpandido = null;
let cnpjTimer = null;

// ══════════════════════════════════════════════════════
// STORAGE
// ══════════════════════════════════════════════════════
const ls = { g: k => { try { return JSON.parse(localStorage.getItem(k)||'null'); } catch { return null; } }, s: (k,v) => localStorage.setItem(k,JSON.stringify(v)) };
function getEmpresas()      { return ls.g('fp_empresas') || []; }
function setEmpresas(v)     { ls.s('fp_empresas', v); }
function getAtivaId()       { return localStorage.getItem('fp_ativa') || null; }
function setAtivaId(id)     { id ? localStorage.setItem('fp_ativa',id) : localStorage.removeItem('fp_ativa'); }
function getAtiva()         { const id=getAtivaId(); return id ? getEmpresas().find(e=>e.id===id)||null : null; }
function colabKey(eid)      { return `fp_c_${eid}_${ano}_${String(mes).padStart(2,'0')}`; }
function getColabs(eid)     { return ls.g(colabKey(eid)) || []; }
function setColabs(eid,v)   { ls.s(colabKey(eid), v); }

// ══════════════════════════════════════════════════════
// HELPERS
// ══════════════════════════════════════════════════════
function genId() { return Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function esc(s)  { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function brl(v)  { return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function pct(v,p){ return (Number(v||0)*Number(p||0)/100); }

// ── Cálculos trabalhistas ──────────────────────────────
function diasNoMes(m,a){ return new Date(a,m,0).getDate(); }

function calcAvos13(admissao, anoRef) {
  if (!admissao) return 0;
  const adm = new Date(admissao+'T12:00:00');
  let avos = 0;
  for (let m = 0; m < 12; m++) {
    const iniMes = new Date(anoRef, m, 1);
    const fimMes = new Date(anoRef, m+1, 0);
    if (adm > fimMes) continue;                    // não admitido ainda
    if (anoRef < hoje.getFullYear() && fimMes > new Date(anoRef,11,31)) continue;
    if (anoRef === hoje.getFullYear() && m > hoje.getMonth()) continue;
    const diaAdm = (adm.getFullYear()===anoRef && adm.getMonth()===m) ? adm.getDate() : 1;
    const diasTrab = fimMes.getDate() - diaAdm + 1;
    if (diasTrab >= 15) avos++;
  }
  return Math.min(avos, 12);
}

function calcAvosFerias(admissao) {
  if (!admissao) return 0;
  const adm = new Date(admissao+'T12:00:00');
  const ref = new Date(ano, mes-1, 1);
  let meses = (ref.getFullYear()-adm.getFullYear())*12 + (ref.getMonth()-adm.getMonth());
  if (meses < 0) return 0;
  return meses % 12;
}

function calcColab(c) {
  const sal   = Number(c.salarioBase)||0;
  const duMes = Number(c.diasUteisMes)||22;
  const dt    = Number(c.diasTrabalhados)||0;

  // Salário proporcional
  const salProp = c.tipoSalario==='mensalista' ? (sal/duMes)*dt : sal*dt;

  // Valor da hora (mensalista: sal/duMes/8)
  const valorHora = c.tipoSalario==='mensalista' ? sal/duMes/(Number(c.cargaHoraria)||8) : (Number(c.valorHora)||0);

  // Horas extras
  const he50v  = valorHora * (Number(c.he50)||0) * 1.5;
  const he100v = valorHora * (Number(c.he100)||0) * 2.0;
  const totalHE = he50v + he100v;

  // DSR sobre HE
  const dsrHE = dt > 0 && totalHE > 0 ? (totalHE / dt) * (Number(c.diasDSR)||4) : 0;
  const dsr   = c.dsrManual ? (Number(c.dsrValor)||0) : dsrHE;

  // Adiantamento
  const adt   = Number(c.adiantamento)||0;

  // Bruto do mês
  const brutoMes = salProp + totalHE + dsr;

  // 13º proporcional
  const avos13  = calcAvos13(c.dataAdmissao, ano);
  const dec13   = sal>0 ? sal*avos13/12 : 0;

  // Férias proporcionais + 1/3
  const avosF   = calcAvosFerias(c.dataAdmissao);
  const ferBase = sal>0 ? sal*avosF/12 : 0;
  const ferTotal= ferBase * (4/3);

  // FGTS (8%) — custo empregador, não descontado do colaborador
  const fgts    = brutoMes * 0.08;

  // Total a pagar
  const aPagar  = brutoMes - adt;

  return { salProp, valorHora, he50v, he100v, totalHE, dsr, dsrHE, adt, brutoMes, avos13, dec13, avosF, ferBase, ferTotal, fgts, aPagar };
}

// ══════════════════════════════════════════════════════
// TABS
// ══════════════════════════════════════════════════════
function tab(t) {
  tabAtiva = t;
  document.getElementById('tabEmpBtn').classList.toggle('active', t==='emp');
  document.getElementById('tabFolhaBtn').classList.toggle('active', t==='folha');
  document.getElementById('pgEmp').style.display   = t==='emp'   ? '' : 'none';
  document.getElementById('pgFolha').style.display = t==='folha' ? '' : 'none';
  t==='emp' ? renderEmp() : renderFolha();
}

// ══════════════════════════════════════════════════════
// HEADER
// ══════════════════════════════════════════════════════
function renderHeader() {
  const ea = getAtiva();
  document.getElementById('hEmpresa').innerHTML = ea
    ? `<div class="h-empresa">🏢 <strong>${esc(ea.nome)}</strong> <small style="color:var(--gray-500)">ATIVA</small>
         <button class="btn btn-ghost btn-sm" style="height:24px;padding:0 8px;font-size:11px;" onclick="desativar()">✕</button></div>`
    : `<span style="font-size:12px;color:var(--gray-400)">Nenhuma empresa ativa</span>`;
}

// ══════════════════════════════════════════════════════
// ABA EMPRESAS
// ══════════════════════════════════════════════════════
function renderEmp() {
  renderHeader();
  const emps = getEmpresas(), ativaId = getAtivaId();
  let h = `<div class="card"><div class="card-header">
    <div class="card-title">🏢 Empresas Cadastradas</div>
    <button class="btn btn-primary btn-sm" onclick="abrirEmpForm()">+ Nova Empresa</button>
  </div><div class="card-body">`;

  if (empFormAberto) h += empForm(null);

  if (!emps.length && !empFormAberto) {
    h += `<div class="empty"><div class="empty-icon">🏢</div>
      <p>Nenhuma empresa cadastrada.</p>
      <button class="btn btn-primary" onclick="abrirEmpForm()">+ Cadastrar primeira empresa</button></div>`;
  } else {
    h += `<div class="emp-list">`;
    emps.forEach(e => {
      if (empEditId===e.id) { h += empForm(e); return; }
      const at = e.id===ativaId;
      h += `<div class="emp-row ${at?'ativa':''}">
        <span style="font-size:26px">🏢</span>
        <div class="emp-info">
          <div class="emp-nome">${esc(e.nome)} ${at?'<span class="badge badge-green">✓ ATIVA</span>':''}</div>
          <div class="emp-det">
            ${e.cnpj?`CNPJ: <strong>${esc(e.cnpj)}</strong>`:''}
            ${e.responsavel?` · Resp.: ${esc(e.responsavel)}`:''}
            ${e.telefone?` · Tel.: ${esc(e.telefone)}`:''}
            ${e.endereco?`<br>${esc(e.endereco)}`:''}
            ${!e.cnpj&&!e.responsavel&&!e.telefone&&!e.endereco?'<span style="color:var(--gray-300)">Sem informações adicionais</span>':''}
          </div>
        </div>
        <div class="emp-actions">
          ${!at?`<button class="btn btn-green btn-sm" onclick="ativar('${e.id}')">⚡ Ativar</button>`
               :`<button class="btn btn-outline btn-sm" onclick="tab('folha')">📋 Ver Folha</button>`}
          <button class="btn btn-ghost btn-icon" onclick="editEmp('${e.id}')">✏️</button>
          <button class="btn btn-danger btn-icon" onclick="delEmp('${e.id}')">🗑️</button>
        </div>
      </div>`;
    });
    h += `</div>`;
  }
  h += `</div></div>`;

function saveEmp(id) {

  const d = { nome, cnpj:document.getElementById('eCnpj')?.value.trim()||'',

function delEmp(id) {
  const e = getEmpresas().find(x=>x.id===id);

  setEmpresas(getEmpresas().filter(x=>x.id!==id));
  if (getAtivaId()===id) setAtivaId(null);
  renderEmp();
}

// ── CNPJ lookup ──────────────────────────────────────
function mascaraCnpj(v) {
  v=v.replace(/\D/g,'').slice(0,14);
  if(v.length>12) v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8,12)+'-'+v.slice(12);
  else if(v.length>8) v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5,8)+'/'+v.slice(8);
  else if(v.length>5) v=v.slice(0,2)+'.'+v.slice(2,5)+'.'+v.slice(5);
  else if(v.length>2) v=v.slice(0,2)+'.'+v.slice(2);
  return v;
}
function onCnpj(el) {
  const raw=el.value.replace(/\D/g,''); el.value=mascaraCnpj(raw);
  clearTimeout(cnpjTimer);
  const ico=document.getElementById('eCnpjIco'), res=document.getElementById('eCnpjRes');
  if(!ico||!res) return;
  if(raw.length<14){ ico.innerHTML=''; res.className='cnpj-res'; return; }
  ico.innerHTML='<span class="spin"></span>'; res.className='cnpj-res';
  cnpjTimer=setTimeout(()=>buscaCnpj(raw),400);
}
async function buscaCnpj(cnpj) {
  const ico=document.getElementById('eCnpjIco'), res=document.getElementById('eCnpjRes');
  if(!ico||!res) return;
  try {
    const d=await(await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`)).json();
    if(d.message) throw new Error();
    const nomeEl=document.getElementById('eNome'), respEl=document.getElementById('eResp'), endEl=document.getElementById('eEnd');
    if(nomeEl&&!nomeEl.value.trim()) nomeEl.value=d.nome_fantasia||d.razao_social||'';
    if(respEl&&!respEl.value.trim()&&d.qsa?.[0]) respEl.value=d.qsa[0].nome_socio||'';
    if(endEl&&!endEl.value.trim()) endEl.value=[d.logradouro,d.numero,d.municipio,d.uf].filter(Boolean).join(', ');
    ico.innerHTML='✅';
    res.className='cnpj-res ok';
    res.innerHTML=`<strong>${d.razao_social}</strong>${d.nome_fantasia&&d.nome_fantasia!==d.razao_social?' · '+d.nome_fantasia:''}<br>
      ${d.descricao_situacao_cadastral?'Situação: <strong>'+d.descricao_situacao_cadastral+'</strong>':''}
      ${d.cnae_fiscal_descricao?' · '+d.cnae_fiscal_descricao:''}`;
  } catch {
    ico.innerHTML='❌'; res.className='cnpj-res erro';
    res.textContent='CNPJ não encontrado. Verifique o número ou preencha manualmente.';
  }
}

      </select></div>
    <div class="fld"><label>Ano</label>
      <select onchange="onAno(this.value)">
        ${Array.from({length:6},(_,i)=>ano-2+i).map(y=>`<option value="${y}" ${y===ano?'selected':''}>${y}</option>`).join('')}
      </select></div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:flex-end;">
      <button class="btn btn-outline btn-sm" onclick="window.print()">🖨️ Imprimir</button>

  if (!ea) {
    document.getElementById('pgFolha').innerHTML = filtros + `

        </div></div>`; return;
  }

  const colabs = getColabs(ea.id);
  const periodo = `${MESES[mes-1]}/${ano}`;

  // Totais
  let totPagar=0, totPago=0, totFgts=0, totDec13=0;
  colabs.forEach(c => {
    const r = calcColab(c);
    totPagar += r.aPagar;
    if (c.pago) totPago += r.aPagar;
    totFgts  += r.fgts;
    totDec13 += r.dec13;
  });
  const totPend = totPagar - totPago;

  let h = filtros;
  h += `<div class="empresa-banner">🏢 <strong style="color:var(--green)">${esc(ea.nome)}</strong>
    ${ea.cnpj?`<span style="color:var(--gray-500)">· ${esc(ea.cnpj)}</span>`:''}
    <button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="tab('emp')">Trocar empresa</button></div>`;

  h += `<div class="sum-grid">
    <div class="sum-card"><div class="sum-lbl">Total a Pagar</div>
      <div class="sum-val">${brl(totPagar)}</div>
      <div class="sum-sub">${colabs.length} colaborador${colabs.length!==1?'es':''}</div></div>
    <div class="sum-card"><div class="sum-lbl">Já Pago</div>
      <div class="sum-val green">${brl(totPago)}</div>
      <div class="sum-sub">${colabs.filter(c=>c.pago).length} pago${colabs.filter(c=>c.pago).length!==1?'s':''}</div></div>
    <div class="sum-card"><div class="sum-lbl">Pendente</div>
      <div class="sum-val ${totPend>0?'amber':''}">${brl(totPend)}</div>
      <div class="sum-sub">${colabs.filter(c=>!c.pago).length} pendente${colabs.filter(c=>!c.pago).length!==1?'s':''}</div></div>
    <div class="sum-card"><div class="sum-lbl">FGTS Estimado</div>
      <div class="sum-val purple">${brl(totFgts)}</div>
      <div class="sum-sub">Custo do empregador</div></div>
  </div>`;

  h += `<div class="card"><div class="card-header">
    <div class="card-title">👥 Colaboradores — ${periodo}</div>
    <button class="btn btn-primary btn-sm" onclick="abrirColabForm()">+ Adicionar</button>
  </div><div class="card-body">`;

  if (colabFormAberto && !colabEditId) h += colabForm(null, ea.id);

  if (!colabs.length && !colabFormAberto) {
    h += `<div class="empty"><div class="empty-icon">👥</div>
      <p>Nenhum colaborador lançado para ${periodo}.</p>
      <button class="btn btn-outline" onclick="abrirColabForm()">+ Adicionar primeiro colaborador</button></div>`;
  } else {
    colabs.forEach(c => {
      if (colabEditId===c.id) { h += colabForm(c, ea.id); return; }
      h += colabRow(c, ea.id);
    });
    if (colabs.length) {
      h += `<hr><div>
        <div class="lf-row"><span style="color:var(--gray-500)">Total a pagar — ${colabs.length} colaborador${colabs.length!==1?'es':''}</span><span class="lf-total">${brl(totPagar)}</span></div>
        ${totPago>0?`<div class="lf-row"><span class="text-green">Já pago</span><span class="text-green">${brl(totPago)}</span></div>`:''}
        ${totPend>0?`<div class="lf-row"><span class="text-amber">Pendente</span><span class="text-amber">${brl(totPend)}</span></div>`:''}
        <div class="lf-row" style="margin-top:4px"><span class="text-purple" style="font-size:12px">FGTS total (custo empresa)</span><span class="text-purple" style="font-size:12px">${brl(totFgts)}</span></div>
      </div>`;
    }
  }

  h += `</div></div><p class="aviso">Sem desconto de INSS, IRRF ou outros impostos · FGTS exibido apenas como custo estimado do empregador</p>`;
  document.getElementById('pgFolha').innerHTML = h;
}

function tabelaCalc(r, c) {
  const isMens = c.tipoSalario==='mensalista'||!c.tipoSalario;
  const duMes  = Number(c.diasUteisMes)||22;
  const dt     = Number(c.diasTrabalhados)||0;
  const avos13 = c.dataAdmissao ? calcAvos13(c.dataAdmissao, ano) : null;
  const avosF  = c.dataAdmissao ? calcAvosFerias(c.dataAdmissao) : null;

  let rows = `<table class="calc-table">
    <tr><td class="calc-section" colspan="2">📅 Competência ${MESES[mes-1]}/${ano}</td></tr>`;

  if (isMens) {
    rows += `<tr><td>Salário proporcional <span class="calc-badge">${dt}/${duMes} dias</span></td><td>${brl(r.salProp)}</td></tr>`;
  } else {
    rows += `<tr><td>Pagamento (${dt} ${c.tipoSalario==='horista'?'horas':'dias'} × ${brl(c.salarioBase)})</td><td>${brl(r.salProp)}</td></tr>`;
  }

  if (r.he50v>0)  rows += `<tr><td>Horas extras 50% (${c.he50}h × ${brl(r.valorHora)} × 1,5)</td><td>${brl(r.he50v)}</td></tr>`;
  if (r.he100v>0) rows += `<tr><td>Horas extras 100% (${c.he100}h × ${brl(r.valorHora)} × 2,0)</td><td>${brl(r.he100v)}</td></tr>`;
  if (r.dsr>0)    rows += `<tr><td>DSR ${c.dsrManual?'(informado)':'(calculado sobre H.E.)'}</td><td>${brl(r.dsr)}</td></tr>`;

  rows += `<tr class="subtotal"><td>Bruto do mês</td><td>${brl(r.brutoMes)}</td></tr>`;

  if (r.adt>0) rows += `<tr class="deducao"><td>(−) Adiantamento já pago</td><td>−${brl(r.adt)}</td></tr>`;

  rows += `<tr class="total-pagar"><td>✅ Total a pagar ao colaborador</td><td>${brl(r.aPagar)}</td></tr>`;

  if (c.dataAdmissao) {
    rows += `<tr><td class="calc-section" colspan="2">📊 Provisões (referência — sem desconto)</td></tr>`;
    rows += `<tr class="custo"><td>13º proporcional <span class="calc-badge amber">${avos13}/12 avos</span></td><td>${brl(r.dec13)}</td></tr>`;
    rows += `<tr class="custo"><td>Férias + 1/3 <span class="calc-badge amber">${avosF}/12 avos</span></td><td>${brl(r.ferTotal)}</td></tr>`;
  }
  rows += `<tr class="fgts"><td>FGTS 8% <span class="calc-badge purple">custo empresa</span></td><td>${brl(r.fgts)}</td></tr>`;
  rows += `</table>`;
  return rows;
}

function tipoLabel(t) {
  if(t==='diarista') return 'Diarista';
  if(t==='horista')  return 'Horista';
  return 'Mensalista';
}

function toggleExp(id, eid) {
  colabExpandido = colabExpandido===id ? null : id;
  renderFolha();
}

function togglePago(id, eid) {
  const list = getColabs(eid);
  const i = list.findIndex(c=>c.id===id);
  if(i!==-1) list[i].pago=!list[i].pago;
  setColabs(eid, list); renderFolha();
}

function abrirColabForm()  { colabFormAberto=true; colabEditId=null; renderFolha(); setTimeout(()=>document.getElementById('cNome')?.focus(),50); }
function cancelColabForm() { colabFormAberto=false; colabEditId=null; renderFolha(); }
function editColab(id)     { colabEditId=id; colabFormAberto=false; renderFolha(); setTimeout(()=>document.getElementById('cNome')?.focus(),50); }

function saveColab(id, eid) {
  const nome=document.getElementById('cNome')?.value.trim();
  if(!nome){ alert('Informe o nome.'); return; }
  const s=colabSnapshot();
  const dados={...s, nome, funcao:document.getElementById('cFuncao')?.value.trim()||'',
    observacao:document.getElementById('cObs')?.value.trim()||''};
  const list=getColabs(eid);
  if(id){ const i=list.findIndex(c=>c.id===id); if(i!==-1) list[i]={...list[i],...dados}; }
  else list.push({id:genId(),pago:false,...dados});
  setColabs(eid,list); colabFormAberto=false; colabEditId=null; renderFolha();
}

function delColab(id, eid) {
  if(!confirm('Remover este colaborador?')) return;
  setColabs(eid, getColabs(eid).filter(c=>c.id!==id)); renderFolha();
}
