<title>Prancheta do Técnico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: prancheta tática à noite — barra de comando fixa (clube, data, caixa, termômetros), abas, lousa em grade */
:root{
  --bg:#0c1a16; --panel:#13251f; --panel2:#1a3029; --line:rgba(232,230,218,.11); --line2:rgba(232,230,218,.24);
  --chalk:#ebe8dc; --muted:#a3b5ab; --dim:#71877d;
  --amber:#f2b33d; --amber-ink:#1d1606; --red:#e65a4c; --green:#6cc58b; --blue:#73a8de; --teal:#4cb7a6;
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--chalk)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 90px,transparent 90px 180px),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0;line-height:1}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:800;letter-spacing:.04em}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line2)}
.top .wrap{display:flex;gap:14px;align-items:center;padding-block:10px;flex-wrap:wrap}
.who{min-width:0}
.who b{font-family:var(--f-disp);font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1}
.who span{color:var(--muted);font-size:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:14px;font-weight:600}
.meter{width:120px;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.tabs{border-bottom:1px solid var(--line);background:rgba(19,37,31,.6)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:11px 13px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--chalk)}
.tabs button.on{color:var(--chalk);border-bottom-color:var(--amber)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;text-align:center;margin-left:4px;font-family:var(--f-mono)}
main{padding-block:18px 60px}
/* botões */
.btn{border:1px solid var(--line2);background:var(--panel2);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--chalk)}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.red{background:transparent;border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.big{padding:11px 20px;font-size:15px}
/* superfícies */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card>h3{margin-bottom:12px}
.chalkline{border-top:1px dashed var(--line2);margin:12px 0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
tr.me td{background:rgba(242,179,61,.1)}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(255,255,255,.04)}
.zone{border-left:3px solid transparent}
.z1{border-left-color:var(--teal)} .z2{border-left-color:var(--blue)} .z3{border-left-color:var(--red)} .z4{border-left-color:var(--amber)} .z5{border-left-color:#b48ae0}
.ovr{display:inline-block;min-width:30px;text-align:center;font-family:var(--f-mono);font-weight:600;border-radius:4px;padding:1px 4px;font-size:12px}
.o1{background:#2f4a3e;color:#cfe0d6}.o2{background:#3d6b55;color:#eaf6ee}.o3{background:#6cc58b;color:#0d2416}.o4{background:var(--amber);color:var(--amber-ink)}
.pos{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:3px;border:1px solid var(--line2)}
.pos.GOL{color:#f2c46d}.pos.ZAG,.pos.LAT{color:#7fc0f0}.pos.VOL,.pos.MEI{color:#8fd8a7}.pos.ATA{color:#f08a7f}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--muted)}
.chip.red{border-color:var(--red);color:var(--red)} .chip.amb{border-color:var(--amber);color:var(--amber)} .chip.grn{border-color:var(--green);color:var(--green)}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:3px;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--f-mono)}
.form .V{background:var(--green);color:#0d2416}.form .E{background:#5d6e66;color:#fff}.form .D{background:var(--red);color:#fff}
.bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;width:54px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;min-width:0}
input[type=checkbox]{accent-color:var(--amber);width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:4px}
/* jogo / próximo jogo */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vs .t b{font-family:var(--f-disp);font-size:20px;text-transform:uppercase;font-weight:800;line-height:1.05}
.score{font-family:var(--f-disp);font-weight:900;font-size:64px;line-height:1;letter-spacing:.02em}
.board{background:linear-gradient(180deg,#0a1512,#11221d);border:1px solid var(--line2);border-radius:10px;padding:18px}
.clock{font-family:var(--f-mono);font-size:15px;color:var(--amber);font-weight:600}
.feed{max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.feed div{padding:6px 8px;border-left:2px solid transparent;font-size:13px}
.feed .goal{border-left-color:var(--amber);background:rgba(242,179,61,.09);font-weight:600}
.feed .card-y{border-left-color:#e8cf4a}.feed .card-r{border-left-color:var(--red)}
.feed .meta{color:var(--muted);font-style:italic}
.feed .m{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
.poss{display:flex;height:8px;border-radius:4px;overflow:hidden}
/* modal */
#modal .scrim{position:fixed;inset:0;background:rgba(3,8,6,.72);z-index:20;display:grid;place-items:center;padding:16px}
#modal .sheet{background:var(--panel);border:1px solid var(--line2);border-radius:10px;max-width:660px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.press-q{font-size:17px;font-weight:600;line-height:1.35;margin:10px 0 14px}
.ans{display:flex;flex-direction:column;gap:8px}
.ans button{text-align:left;white-space:normal;line-height:1.35;padding:11px 13px}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.post{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px}
.post .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
.post b{font-size:13px}
.post p{margin:2px 0 0}
.headline{font-family:var(--f-disp);font-size:28px;font-weight:900;text-transform:uppercase;line-height:1.02;border-top:3px solid var(--chalk);border-bottom:1px solid var(--chalk);padding:10px 0;margin:10px 0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
/* abertura */
.hero{padding-block:40px 24px}
.hero h1{font-size:clamp(46px,9vw,104px);font-weight:900;line-height:.9}
.hero h1 em{font-style:normal;color:var(--amber)}
.lede{max-width:62ch;color:var(--muted);font-size:16px;margin-top:14px}
.pitch{position:relative;border:2px solid var(--line2);border-radius:8px;aspect-ratio:105/68;max-width:100%;background:repeating-linear-gradient(90deg,rgba(108,197,139,.05) 0 9.5%,transparent 9.5% 19%)}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--line2)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid var(--line2);border-radius:50%;transform:translate(-50%,-50%)}
.teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.teampick{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px;cursor:pointer;text-align:left;width:100%}
.teampick:hover{border-color:var(--amber)}
.teampick b{display:block;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:8px}
.lineup-pos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
/* jogo ao vivo: comando à esquerda, campo e narração à direita */
.livegrid{display:grid;grid-template-columns:minmax(270px,350px) minmax(0,1fr);gap:14px;align-items:start}
.livegrid .pitch{background-color:rgba(108,197,139,.06);max-width:680px;margin:0 auto}
.pl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
.pl[onclick]{cursor:pointer}
.pl i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:700;font-family:var(--f-mono);border:3px solid}
.pl span{font-size:10px;white-space:nowrap;background:rgba(0,0,0,.55);color:#fff;padding:0 4px;border-radius:3px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.pl.sel i{outline:3px solid var(--amber);outline-offset:2px}
.halfbox{border:1px solid var(--amber);background:rgba(242,179,61,.1);border-radius:8px;padding:10px 12px}
/* interface mais leve */
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border:1px solid var(--line2);border-radius:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-bottom:16px;max-width:100%}
.seg button{background:none;border:0;padding:8px 14px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer}
.seg button.on{background:var(--panel2);color:var(--chalk)}
.plist{display:flex;flex-direction:column;gap:2px}
.prow{display:flex;align-items:center;gap:8px;width:100%;background:none;border:1px solid transparent;border-radius:6px;padding:6px 6px;text-align:left;color:inherit;font:inherit;font-size:13px}
button.prow{cursor:pointer} button.prow:hover{border-color:var(--line2);background:rgba(255,255,255,.03)}
.prow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fdot{width:10px;height:10px;border-radius:50%;flex:none}
.card{border-color:rgba(232,230,218,.08)}
@media (max-width:560px){.pl span{display:none}.pl i{width:20px;height:20px;font-size:10px}}
@media (max-width:860px){.livegrid{grid-template-columns:1fr}.split{grid-template-columns:1fr}.score{font-size:48px}.meter{width:80px}.top{position:static}.top .wrap{gap:8px 14px}.who b{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app"></div>
<div id="modal" hidden></div>

    if(R()<.0028)livePen(s);
    if(R()<1.7/90){const x=pick(S.slots);const p=G.players[x.id];const prev=L.ev.filter(e=>e.k==='y'&&e.p===x.id).length;L.st.y[s]++;
      if(prev){L.ev.push({k:'r',s,m,p:x.id});L.st.r[s]++;liveLine('card-r',`Segundo amarelo! ${p.n} (${tn(s)}) é expulso.`);sendOff(s,x.id)}
      else{L.ev.push({k:'y',s,m,p:x.id});liveLine('card-y',`Cartão amarelo para ${p.n} (${tn(s)}) ${pick(LINES.yel)}.`)}}
    if(R()<.045/90){const x=pick(S.slots);L.ev.push({k:'r',s,m,p:x.id});L.st.r[s]++;liveLine('card-r',`VERMELHO DIRETO! ${G.players[x.id].n} (${tn(s)}) está expulso.`);sendOff(s,x.id)}
    if(R()<.09*medMult(S.tid)/90){const inj=mkInjury(S.tid,S.slots);const x=S.slots.find(z=>z.id===inj.p);const p=G.players[x.id];L.ev.push({k:'i',s,m,...inj});liveLine('meta',`${p.n} (${tn(s)}) sente: ${INJ[inj.ti].n.toLowerCase()}. Não tem condições de seguir.`);injOut(s,x)}}
  if(R()<.05)liveLine('meta',fill(pick(LINES.atm),{h:team(L.f.h).n,t:tn(R()<.5?0:1)}));
  const ai=1-L.us;if([60,70,79].includes(m))aiSub(ai);
  if(m===45&&!L.half){L.half=true;L.paused=true;clearInterval(L.timer);liveLine('meta',`Fim do primeiro tempo: ${L.g[0]} x ${L.g[1]}.`);return}
  if(m>=90+L.extra){endLive()}}
function sendOff(s,id){const S=LM.sides[s];const sl=S.slots.find(x=>x.id===id);if(sl){S.mins[id]=LM.min-(sl.in||0);S.slots=S.slots.filter(x=>x.id!==id)}liveLam()}
function injOut(s,sl){const S=LM.sides[s];if(S.subs<5&&S.bench.length){const cand=S.bench.map(i=>G.players[i]).sort((a,b)=>pscore(b)*fitPos(b.p,sl.pos)-pscore(a)*fitPos(a.p,sl.pos))[0];doSub(s,sl.id,cand.id,true)}else sendOff(s,sl.id)}
function doSub(s,outId,inId,auto){const S=LM.sides[s];const sl=S.slots.find(x=>x.id===outId);if(!sl||S.subs>=5)return false;S.mins[outId]=LM.min-(sl.in||0);sl.id=inId;sl.in=LM.min;S.bench=S.bench.filter(i=>i!==inId);S.off[outId]=1;S.played.add(inId);S.subs++;
  liveLine('meta',`${auto?'Substituição forçada':'Substituição'} no ${team(S.tid).n}: sai ${G.players[outId].n}, entra ${G.players[inId].n}.`);liveLam();return true}
function aiSub(s){const S=LM.sides[s];if(S.subs>=5||!S.bench.length)return;const fat=liveFat(S);const tired=S.slots.filter(x=>x.pos!=='GOL').sort((a,b)=>fat(a)-fat(b))[0];if(!tired)return;
  const cand=S.bench.map(i=>G.players[i]).filter(p=>p.p!=='GOL').sort((a,b)=>pscore(b)*fitPos(b.p,tired.pos)-pscore(a)*fitPos(a.p,tired.pos))[0];if(cand)doSub(s,tired.id,cand.id)}
function endLive(){const L=LM;L.over=true;clearInterval(L.timer);liveLine('meta',`Fim de jogo: ${team(L.f.h).n} ${L.g[0]} x ${L.g[1]} ${team(L.f.a).n}.`);
  if(needsPens(L.f,L.g[0],L.g[1])){const pen=[0,0];const takers=L.sides.map(S=>penOrder(S));liveLine('meta','Disputa de pênaltis!');
    let k=0;const kick=s=>{const ts=takers[s];const p=G.players[ts[k%ts.length].id];const ok=R()<.76;if(ok)pen[s]++;liveLine(ok?'':'card-r',`${team(L.sides[s].tid).n}: ${p.n} ${ok?'converte':'desperdiça'} (${pen[0]} x ${pen[1]})`)};
    for(;k<5;k++){kick(0);kick(1)}while(pen[0]===pen[1]){kick(0);kick(1);k++}L.pen=pen;liveLine('goal',`${team(L.sides[pen[0]>pen[1]?0:1].tid).n} vence nos pênaltis por ${pen[0]} x ${pen[1]}!`)}
  updLive()}
function liveFinish(){const L=LM;const res={hg:L.g[0],ag:L.g[1],ev:L.ev,pl:L.sides.map(S=>[...S.played]),mins:{},pen:L.pen,press:L.sides.map(S=>S.press)};
  L.sides.forEach(S=>{for(const s of S.slots)S.mins[s.id]=(S.mins[s.id]??0)+(90-(s.in||0));Object.assign(res.mins,S.mins)});
  const f=L.f;finalize(f,res);
  const sl=L.sides[L.us];if(sl.tid===G.coach.club){G.style=sl.style;G.press=sl.press;if(sl.form&&sl.form!==G.form){G.form=sl.form;G.lineup=sl.slots.map(x=>x.id)}}LM=null;UI.tab='painel';postUserMatch(f,true)}

function pitchPos(slots){const L={GOL:[],DEF:[],VOL:[],MEI:[],ATA:[]};for(const s of slots)L[s.pos==='ZAG'||s.pos==='LAT'?'DEF':s.pos].push(s);
  const lats=L.DEF.filter(s=>s.pos==='LAT'),zags=L.DEF.filter(s=>s.pos==='ZAG');L.DEF=lats.length?[lats[0],...zags,...lats.slice(1)]:zags;
  const X={GOL:5,DEF:18,VOL:29,MEI:37,ATA:46};const out=[];for(const [k,arr] of Object.entries(L))arr.forEach((s,i)=>out.push({s,x:X[k],y:(i+1)*100/(arr.length+1)}));return out}

`}
    <div class="chalkline" style="margin:2px 0"></div>
    ${L.subOut?`<div class="row"><span class="lbl" style="flex:1">Quem entra no lugar de ${esc(G.players[L.subOut].n)}?</span><button class="btn sm" onclick="A.subOut(${L.subOut})">Cancelar</button></div>
     <div class="plist">${me.bench.map(id=>{const p=G.players[id];return `<button class="prow" onclick="A.subIn(${id})">${posB(p.p)}<span class="nm">${esc(p.n)}</span>${ovr(p.o)}<span class="fdot" style="background:${meterCol(p.fit)}" title="Condição ${p.fit}%"></span></button>`}).join('')||'<p class="muted">Sem reservas disponíveis.</p>'}</div>`
