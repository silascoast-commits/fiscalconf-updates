<title>Prancheta do Técnico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: prancheta tática à noite — barra de comando fixa (clube, data, caixa, termômetros), abas, lousa em grade */
:root{
  --bg:#0c1a16; --panel:#13251f; --panel2:#1a3029; --line:rgba(232,230,218,.11); --line2:rgba(232,230,218,.24);
  --chalk:#ebe8dc; --muted:#a3b5ab; --dim:#71877d;
  --amber:#f2b33d; --amber-ink:#1d1606; --red:#e65a4c; --green:#6cc58b; --blue:#73a8de; --teal:#4cb7a6;
  --f-disp:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--chalk)}
body{font-family:var(--f-body);font-size:14px;line-height:1.45;min-height:100%;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 90px,transparent 90px 180px),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-disp);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance;margin:0;line-height:1}
h2{font-size:26px;font-weight:800}
h3{font-size:19px;font-weight:800;letter-spacing:.04em}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:10px}
.sp{flex:1}
/* topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line2)}
.top .wrap{display:flex;gap:14px;align-items:center;padding-block:10px;flex-wrap:wrap}
.who{min-width:0}
.who b{font-family:var(--f-disp);font-size:24px;font-weight:900;text-transform:uppercase;letter-spacing:.02em;display:block;line-height:1}
.who span{color:var(--muted);font-size:12px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-mono);font-size:14px;font-weight:600}
.meter{width:120px;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.tabs{border-bottom:1px solid var(--line);background:rgba(19,37,31,.6)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs button{background:none;border:0;padding:11px 13px;color:var(--muted);font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.tabs button:hover{color:var(--chalk)}
.tabs button.on{color:var(--chalk);border-bottom-color:var(--amber)}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;text-align:center;margin-left:4px;font-family:var(--f-mono)}
main{padding-block:18px 60px}
/* botões */
.btn{border:1px solid var(--line2);background:var(--panel2);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--chalk)}
.btn.pri{background:var(--amber);color:var(--amber-ink);border-color:var(--amber)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.red{background:transparent;border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.big{padding:11px 20px;font-size:15px}
/* superfícies */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card>h3{margin-bottom:12px}
.chalkline{border-top:1px dashed var(--line2);margin:12px 0}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right;font-family:var(--f-mono)}
tr.me td{background:rgba(242,179,61,.1)}
tr.click{cursor:pointer} tr.click:hover td{background:rgba(255,255,255,.04)}
.zone{border-left:3px solid transparent}
.z1{border-left-color:var(--teal)} .z2{border-left-color:var(--blue)} .z3{border-left-color:var(--red)} .z4{border-left-color:var(--amber)}
.ovr{display:inline-block;min-width:30px;text-align:center;font-family:var(--f-mono);font-weight:600;border-radius:4px;padding:1px 4px;font-size:12px}
.o1{background:#2f4a3e;color:#cfe0d6}.o2{background:#3d6b55;color:#eaf6ee}.o3{background:#6cc58b;color:#0d2416}.o4{background:var(--amber);color:var(--amber-ink)}
.pos{font-family:var(--f-mono);font-size:11px;font-weight:600;padding:1px 5px;border-radius:3px;border:1px solid var(--line2)}
.pos.GOL{color:#f2c46d}.pos.ZAG,.pos.LAT{color:#7fc0f0}.pos.VOL,.pos.MEI{color:#8fd8a7}.pos.ATA{color:#f08a7f}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--muted)}
.chip.red{border-color:var(--red);color:var(--red)} .chip.amb{border-color:var(--amber);color:var(--amber)} .chip.grn{border-color:var(--green);color:var(--green)}
.form{display:inline-flex;gap:3px}
.form i{width:16px;height:16px;border-radius:3px;font-style:normal;font-size:10px;font-weight:700;display:grid;place-items:center;font-family:var(--f-mono)}
.form .V{background:var(--green);color:#0d2416}.form .E{background:#5d6e66;color:#fff}.form .D{background:var(--red);color:#fff}
.bar{height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;width:54px;display:inline-block;vertical-align:middle}
.bar i{display:block;height:100%}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:7px 9px;min-width:0}
input[type=checkbox]{accent-color:var(--amber);width:16px;height:16px}
.field{display:flex;flex-direction:column;gap:4px}
/* jogo / próximo jogo */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.vs .t{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.vs .t b{font-family:var(--f-disp);font-size:20px;text-transform:uppercase;font-weight:800;line-height:1.05}
.score{font-family:var(--f-disp);font-weight:900;font-size:64px;line-height:1;letter-spacing:.02em}
.board{background:linear-gradient(180deg,#0a1512,#11221d);border:1px solid var(--line2);border-radius:10px;padding:18px}
.clock{font-family:var(--f-mono);font-size:15px;color:var(--amber);font-weight:600}
.feed{max-height:430px;overflow:auto;display:flex;flex-direction:column;gap:2px}
.feed div{padding:6px 8px;border-left:2px solid transparent;font-size:13px}
.feed .goal{border-left-color:var(--amber);background:rgba(242,179,61,.09);font-weight:600}
.feed .card-y{border-left-color:#e8cf4a}.feed .card-r{border-left-color:var(--red)}
.feed .meta{color:var(--muted);font-style:italic}
.feed .m{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
.poss{display:flex;height:8px;border-radius:4px;overflow:hidden}
/* modal */
#modal .scrim{position:fixed;inset:0;background:rgba(3,8,6,.72);z-index:20;display:grid;place-items:center;padding:16px}
#modal .sheet{background:var(--panel);border:1px solid var(--line2);border-radius:10px;max-width:660px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:20px}
.press-q{font-size:17px;font-weight:600;line-height:1.35;margin:10px 0 14px}
.ans{display:flex;flex-direction:column;gap:8px}
.ans button{text-align:left;white-space:normal;line-height:1.35;padding:11px 13px}
.fx{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.post{border-bottom:1px solid var(--line);padding:10px 0;display:flex;gap:10px}
.post .av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:13px}
.post b{font-size:13px}
.post p{margin:2px 0 0}
.headline{font-family:var(--f-disp);font-size:28px;font-weight:900;text-transform:uppercase;line-height:1.02;border-top:3px solid var(--chalk);border-bottom:1px solid var(--chalk);padding:10px 0;margin:10px 0}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
/* abertura */
.hero{padding-block:40px 24px}
.hero h1{font-size:clamp(46px,9vw,104px);font-weight:900;line-height:.9}
.hero h1 em{font-style:normal;color:var(--amber)}
.lede{max-width:62ch;color:var(--muted);font-size:16px;margin-top:14px}
.pitch{position:relative;border:2px solid var(--line2);border-radius:8px;aspect-ratio:105/68;max-width:100%;background:repeating-linear-gradient(90deg,rgba(108,197,139,.05) 0 9.5%,transparent 9.5% 19%)}
.pitch::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--line2)}
.pitch::after{content:"";position:absolute;left:50%;top:50%;width:18%;aspect-ratio:1;border:2px solid var(--line2);border-radius:50%;transform:translate(-50%,-50%)}
.teamlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.teampick{display:flex;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px;cursor:pointer;text-align:left;width:100%}
.teampick:hover{border-color:var(--amber)}
.teampick b{display:block;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:8px}
.lineup-pos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.split{grid-template-columns:1fr}.score{font-size:48px}.meter{width:80px}.top{position:static}.top .wrap{gap:8px 14px}.who b{font-size:20px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function benchFor(tid,slots){const on=new Set(slots.map(s=>s.id));const av=team(tid).sq.map(i=>G.players[i]).filter(p=>avail(p)&&!on.has(p.id)).sort((a,b)=>pscore(b)-pscore(a));
  const gk=av.find(p=>p.p==='GOL');const rest=av.filter(p=>p!==gk).slice(0,gk?8:9);return (gk?[gk,...rest]:rest).map(p=>p.id)}
function strength(slots,style=2,press=0,fat){let d=0,dw=0,m=0,mw=0,a=0,aw=0;
  for(const s of slots){const p=G.players[s.id];const fit=fat?fat(s):p.fit;const e=p.o*fitPos(p.p,s.pos)*(.78+.22*clamp(fit,0,100)/100)*(.96+.08*p.mor/100);const w=SW[s.pos];d+=e*w[0];dw+=w[0];m+=e*w[1];mw+=w[1];a+=e*w[2];aw+=w[2]}
  const miss=Math.max(0,11-slots.length);let att=a/(aw||1)-miss*4,def=d/(dw||1)-miss*4,mid=m/(mw||1)-miss*4;const sm=STYLE_MOD[style];att+=sm[0];def+=sm[1];if(press){mid+=2;def+=1}
  return {att,def,mid}}
function lambdas(sh,sa,neu){const H=neu?0:1.6;const xh=(sh.att-sa.def)*.6+(sh.mid-sa.mid)*.4,xa=(sa.att-sh.def)*.6+(sa.mid-sh.mid)*.4;
  return [clamp(1.3*Math.exp((xh+H)/14),.15,4.5),clamp(1.3*Math.exp((xa-H)/14),.15,4.5)]}
function rateTeam(t){const s=autoLineup(t.id,t.form);if(!s.length)return t.r;return Math.round(s.reduce((x,y)=>x+G.players[y.id].o,0)/s.length)}

/* ---------------- CALENDÁRIO E COMPETIÇÕES ---------------- */
function dayDate(d){const b=new Date(G.year,1,1);while(b.getDay()!==0)b.setDate(b.getDate()+1);const dt=new Date(b);dt.setDate(b.getDate()+Math.floor(d/2)*7+(d%2?3:0));return dt}
function fmtDate(d,long){const dt=dayDate(d);return dt.toLocaleDateString('pt-BR',long?{weekday:'short',day:'2-digit',month:'short'}:{day:'2-digit',month:'short'}).replace('.','')}
const weekOf=d=>Math.floor(d/2);
const isWindow=w=>WINDOWS.some(([a,b])=>w>=a&&w<=b);
function addFix(c,d,h,a,x){const f={id:G.fix.length,c,d,h,a,hg:null,ag:null,pl:false,...x};G.fix.push(f);(G.dayFix[d]||(G.dayFix[d]=[])).push(f.id);return f}
function roundRobin(ids,double){const t=ids.slice();if(t.length%2)t.push(null);const n=t.length,rounds=[];
  for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const a=t[i],b=t[n-1-i];if(a!=null&&b!=null)m.push((r+i)%2?[b,a]:[a,b])}rounds.push(m);t.splice(1,0,t.pop())}
  return double?rounds.concat(rounds.map(m=>m.map(([a,b])=>[b,a]))):rounds}
const row=()=>({j:0,v:0,e:0,d:0,gp:0,gc:0,pts:0,f:''});
function upd(tb,h,a,hg,ag){const H=tb[h],A=tb[a];if(!H||!A)return;H.j++;A.j++;H.gp+=hg;H.gc+=ag;A.gp+=ag;A.gc+=hg;
  if(hg>ag){H.v++;A.d++;H.pts+=3;H.f=(H.f+'V').slice(-5);A.f=(A.f+'D').slice(-5)}else if(hg<ag){A.v++;H.d++;A.pts+=3;A.f=(A.f+'V').slice(-5);H.f=(H.f+'D').slice(-5)}else{H.e++;A.e++;H.pts++;A.pts++;H.f=(H.f+'E').slice(-5);A.f=(A.f+'E').slice(-5)}}
function standings(tb){return Object.keys(tb).map(Number).sort((a,b)=>{const A=tb[a],B=tb[b];return B.pts-A.pts||B.v-A.v||(B.gp-B.gc)-(A.gp-A.gc)||B.gp-A.gp||team(b).r-team(a).r})}
function roundName(n){return n===2?'Final':n===4?'Semifinal':n===8?'Quartas de final':n===16?'Oitavas de final':`Fase de ${n}`}
function addRound(c,teams,name,weeks,neu){const ri_=c.ko.rounds.length;const rd={name,ties:[]};c.ko.rounds.push(rd);
  for(let i=0;i+1<teams.length;i+=2){const ti=rd.ties.length;const tie={h:teams[i],a:teams[i+1],f:[],w:null};rd.ties.push(tie);
    weeks.forEach((wk,leg)=>{const [h,a]=leg===0?[tie.h,tie.a]:[tie.a,tie.h];const f=addFix(c.id,2*wk+1,h,a,{ri:ri_,ti,leg,legs:weeks.length,neu:!!(neu&&weeks.length===1)});tie.f.push(f.id)})}
  c.ko.cur=ri_}
function makeCup(cid,name,ids){const s=ids.slice().sort((a,b)=>team(b).r-team(a).r);let P=1;while(P<s.length)P*=2;const byes=P-s.length;
  const c={id:cid,type:'K',name,teams:ids.slice(),ko:{rounds:[],cur:0},byes:s.slice(0,byes),sc:{},champ:null};G.comps[cid]=c;
  addRound(c,shuffle(s.slice(byes)),byes?'1ª fase':roundName(s.length),[CUP_WEEKS[0]])}
function makeGroups(teams){let groups;for(let tries=0;tries<60;tries++){const s=teams.slice().sort((a,b)=>team(b).r-team(a).r);groups=[[],[],[],[],[],[],[],[]];let ok=true;
  for(let k=0;k<4;k++){const pot=shuffle(s.slice(k*8,k*8+8));for(const t of pot){const opts=groups.filter(g=>g.length===k&&!g.some(x=>team(x).lg===team(t).lg));const g=opts.length?pick(opts):groups.find(g=>g.length===k);if(!opts.length)ok=false;g.push(t)}}
  if(ok)break}return groups}
function qualify(cid){const cc=CONT[cid];const out=[];for(const [lg,n] of Object.entries(cc.slots)){const order=(G.prevRank[lg]||leagueTeams(lg).sort((a,b)=>b.r-a.r).map(t=>t.id)).filter(id=>team(id).lg===lg);
  const off=cc.after?(CONT[cc.after].slots[lg]||0):0;out.push(...order.slice(off,off+n))}return out}
const GP=[[[0,1],[2,3]],[[2,0],[1,3]],[[0,3],[2,1]]];
function makeCont(cid){const cc=CONT[cid];const teams=qualify(cid);const groups=makeGroups(teams);
  const c={id:cid,type:'C',name:cc.name,teams,groups,gt:groups.map(g=>Object.fromEntries(g.map(t=>[t,row()]))),gfix:[],stage:'G',ko:{rounds:[],cur:-1},sc:{},champ:null};G.comps[cid]=c;
  teams.forEach(id=>{team(id).cash+=cc.prize[0];if(id===G.coach.club)ledger(`Cota de participação · ${cc.name}`,cc.prize[0])});
  groups.forEach((g,gi)=>{for(let md=0;md<6;md++){const pairs=md<3?GP[md]:GP[md-3].map(([a,b])=>[b,a]);for(const [a,b] of pairs)c.gfix.push(addFix(cid,2*CG_WEEKS[md]+1,g[a],g[b],{g:gi,md}).id)}})}
function startSeason(first){
  G.fix=[];G.dayFix={};G.comps={};G.day=0;G.flags={};
  for(const p of Object.values(G.players)){p.st={j:0,g:0,a:0,rt:0};p.yc=0;p.sus=0}
  for(const t of Object.values(G.teams))t.r=rateTeam(t);
  for(const lg of LEAGUES){const ids=leagueTeams(lg.id).map(t=>t.id);const c={id:lg.id,type:'L',name:lg.name,teams:ids,tb:Object.fromEntries(ids.map(i=>[i,row()])),sc:{},champ:null};G.comps[lg.id]=c;
    const rounds=roundRobin(shuffle(ids.slice()),!lg.single);c.R=rounds.length;rounds.forEach((ms,r)=>{const d=2*Math.floor(r*W/rounds.length);ms.forEach(([h,a])=>addFix(lg.id,d,h,a,{r}))})}
  for(const [cid,cu] of Object.entries(CUPS))makeCup(cid,cu.name,cu.lgs.flatMap(l=>leagueTeams(l).map(t=>t.id)));
  for(const cid of Object.keys(CONT))makeCont(cid);
  if(G.coach.club){setObjective();G.lineup=G.lineup.filter(id=>G.players[id]&&G.players[id].t===G.coach.club)}
  news(`Começa a temporada ${G.year}. Sorteios das copas e dos grupos continentais definidos.`);
}

/* ---------------- SIMULAÇÃO DE PARTIDA ---------------- */
const GW={GOL:.02,ZAG:.8,LAT:1,VOL:1.2,MEI:3.2,ATA:6},AW={GOL:.05,ZAG:.5,LAT:2,VOL:1.5,MEI:4,ATA:2.5};
function pickScorer(slots){const s=wpick(slots,s=>GW[s.pos]*Math.pow(G.players[s.id].o/70,2));let as=null;if(R()<.75&&slots.length>1){const o=slots.filter(x=>x.id!==s.id);as=wpick(o,x=>AW[x.pos]).id}return {p:s.id,as}}
function aiStyle(tid,opp){const d=team(tid).r-team(opp).r;return d<-7?1:d>7?3:2}
function sideFor(tid,opp){if(tid===G.coach.club){return {tid,slots:userSlots(true),style:G.style,press:G.press}}return {tid,slots:autoLineup(tid,team(tid).form),style:aiStyle(tid,opp),press:0}}
function simFixture(f){const H=sideFor(f.h,f.a),A=sideFor(f.a,f.h);const sh=strength(H.slots,H.style,H.press),sa=strength(A.slots,A.style,A.press);
  let [lh,la]=lambdas(sh,sa,f.neu);lh*=.85+R()*.3;la*=.85+R()*.3;const hg=poisson(lh),ag=poisson(la);const ev=[];const sides=[H,A];
  [hg,ag].forEach((n,s)=>{for(let i=0;i<n;i++)ev.push({k:'g',s,m:ri(1,90),...pickScorer(sides[s].slots)})});
  sides.forEach((S,s)=>{const yc=poisson(1.7);for(let i=0;i<yc;i++)ev.push({k:'y',s,m:ri(5,90),p:pick(S.slots).id});if(R()<.05)ev.push({k:'r',s,m:ri(20,89),p:pick(S.slots).id});if(R()<.07)ev.push({k:'i',s,m:ri(1,89),p:pick(S.slots).id,days:ri(2,14)})});
  ev.sort((a,b)=>a.m-b.m);
  let pen=null;if(needsPens(f,hg,ag))pen=simPens();
  finalize(f,{hg,ag,ev,pl:[H.slots.map(s=>s.id),A.slots.map(s=>s.id)],mins:{},pen,press:[H.press,A.press]})}
function simPens(){let a=0,b=0;for(let i=0;i<5;i++){if(R()<.76)a++;if(R()<.76)b++}while(a===b){if(R()<.76)a++;if(R()<.76)b++}return [a,b]}
function tieOf(f){const c=G.comps[f.c];return f.ti!=null?c.ko.rounds[f.ri].ties[f.ti]:null}
function needsPens(f,hg,ag){const tie=tieOf(f);if(!tie)return false;if(f.leg!==f.legs-1)return false;let gh=0,ga=0;
  for(const id of tie.f){const x=G.fix[id];const xh=x.id===f.id?hg:x.hg,xa=x.id===f.id?ag:x.ag;if(x.h===tie.h){gh+=xh;ga+=xa}else{gh+=xa;ga+=xh}}return gh===ga}
function expectS(h,a,neu){return 1/(1+Math.exp(-(team(h).r+(neu?0:3)-team(a).r)/6))}
function finalize(f,res){f.hg=res.hg;f.ag=res.ag;f.pl=true;f.pen=res.pen||null;f.gl=res.ev.filter(e=>e.k==='g').map(e=>[e.m,e.p,e.s]);
  const c=G.comps[f.c];const tids=[f.h,f.a];
  for(const tid of tids)for(const id of team(tid).sq){const p=G.players[id];if(p.sus>0)p.sus--}
  const rt={};const gf=[res.hg,res.ag];
  res.pl.forEach((ids,s)=>{const diff=gf[s]-gf[1-s];for(const id of ids){const p=G.players[id];if(!p)continue;p.st.j++;const mins=res.mins[id]??90;
    p.fit=clamp(Math.round(p.fit-(mins/90)*ri(14,21)*(res.press&&res.press[s]?1.2:1)),25,100);p.mor=clamp(p.mor+(diff>0?4:diff<0?-4:0),5,100);
    let r=6.2+(diff>0?.4:diff<0?-.4:0)+(R()*1.4-.7);if(['GOL','ZAG','LAT'].includes(p.p)){const ga=gf[1-s];r+=ga===0?.5:-.25*(ga-1)}rt[id]=r}});
  for(const e of res.ev){const p=G.players[e.p];if(!p)continue;
    if(e.k==='g'){p.st.g++;c.sc[p.id]=(c.sc[p.id]||0)+1;rt[p.id]=(rt[p.id]??6)+1;if(e.as&&G.players[e.as]){G.players[e.as].st.a++;rt[e.as]=(rt[e.as]??6)+.5}}
    else if(e.k==='y'){p.yc++;if(p.yc%3===0)p.sus=1;rt[p.id]=(rt[p.id]??6)-.2}
    else if(e.k==='r'){p.sus=ri(1,2);rt[p.id]=(rt[p.id]??6)-2}
    else if(e.k==='i'){p.inj=e.days}}
  for(const id in rt){rt[id]=Math.round(clamp(rt[id],3,10)*10)/10;const p=G.players[id];if(p)p.st.rt+=rt[id]}
  f.rt=(f.h===G.coach.club||f.a===G.coach.club)?rt:null;
  if(c.type==='L')upd(c.tb,f.h,f.a,res.hg,res.ag);if(f.g!=null)upd(c.gt[f.g],f.h,f.a,res.hg,res.ag);
  // bilheteria
  const ht=team(f.h);if(!f.neu){const occ=f.h===G.coach.club?clamp(.3+G.fans/180+(team(f.a).r-62)/80+(isDerby(f.h,f.a)?.15:0)+(c.type!=='L'?.08:0),.15,1):clamp(.5+(team(f.a).r-62)/70+R()*.2,.2,1);
    f.att=Math.round(ht.cap*occ);const gate=Math.round(f.att*ht.tk*(c.type==='C'?1.5:1));ht.cash+=gate;f.gate=gate;if(f.h===G.coach.club)ledger('Bilheteria vs '+team(f.a).n,gate)}
  // técnicos da IA
  const s=res.hg>res.ag?1:res.hg<res.ag?0:.5;const e=expectS(f.h,f.a,f.neu);const wgt=c.type==='L'?1:1.4;
  if(f.h!==G.coach.club){const t=team(f.h);t.cc=clamp(t.cc+(s-e)*9*wgt+(55-t.cc)*.02,0,100)}
  if(f.a!==G.coach.club){const t=team(f.a);t.cc=clamp(t.cc+((1-s)-(1-e))*9*wgt+(55-t.cc)*.02,0,100)}
  // prêmios continentais por vitória
  if(c.type==='C'&&f.g!=null){const pr=CONT[f.c].prize[1];if(res.hg>res.ag)team(f.h).cash+=pr;else if(res.ag>res.hg)team(f.a).cash+=pr}
  if(f.ti!=null)checkTie(c,f);
}
function checkTie(c,f){const rd=c.ko.rounds[f.ri];const tie=rd.ties[f.ti];const fs=tie.f.map(id=>G.fix[id]);if(fs.some(x=>!x.pl))return;
  let gh=0,ga=0;for(const x of fs){if(x.h===tie.h){gh+=x.hg;ga+=x.ag}else{gh+=x.ag;ga+=x.hg}}
  let w;if(gh>ga)w=tie.h;else if(ga>gh)w=tie.a;else{const last=fs[fs.length-1];if(!last.pen)last.pen=simPens();w=last.pen[0]>last.pen[1]?last.h:last.a}
  tie.w=w;tie.agg=[gh,ga];const loser=w===tie.h?tie.a:tie.h;
  const pr=c.type==='C'?CONT[c.id].prize[2]:c.id==='MUN'?0:team(w).inc*.4;team(w).cash+=pr;if(w===G.coach.club&&pr)ledger(`Prêmio por classificação · ${c.name}`,pr);
  if(rd.name==='Final'||(c.type==='C'&&KO_KEYS[f.ri]==='f')){/* campeão resolvido em advance */}
  tie.loser=loser}
function advanceComps(){for(const c of Object.values(G.comps)){if(c.champ)continue;
  if(c.type==='C'&&c.stage==='G'){if(c.gfix.every(id=>G.fix[id].pl)){c.stage='K';const ties=[];for(let g=0;g<8;g++){const w=standings(c.gt[g])[0],ru=standings(c.gt[(g+1)%8])[1];ties.push(ru,w)}
      for(let g=0;g<8;g++){const st=standings(c.gt[g]);[st[0],st[1]].forEach(t=>{team(t).cash+=CONT[c.id].prize[2]*.5})}
      addRound(c,ties,KO_NAMES.r16,KO_WEEKS.r16);news(`${c.name}: definidos os confrontos das oitavas de final.`)}continue}
  if(c.type==='L')continue;
  const rd=c.ko.rounds[c.ko.cur];if(!rd||!rd.ties.every(t=>t.w!=null))continue;
  let winners=rd.ties.map(t=>t.w);if(c.type==='K'&&c.ko.cur===0&&c.byes){winners=winners.concat(c.byes);c.byes=[]}
  if(winners.length===1){setChamp(c,winners[0]);continue}
  if(c.type==='C'){const key=KO_KEYS[c.ko.cur+1];addRound(c,shuffle(winners),KO_NAMES[key],KO_WEEKS[key],key==='f')}
  else{const wk=CUP_WEEKS[c.ko.rounds.length]??CUP_WEEKS[CUP_WEEKS.length-1];addRound(c,shuffle(winners),roundName(winners.length),[wk],winners.length===2&&c.id!=='CDB')}}
  if(G.comps.LIB&&G.comps.UCL&&G.comps.LIB.champ&&G.comps.UCL.champ&&!G.comps.MUN){const c={id:'MUN',type:'K',name:'Mundial de Clubes',teams:[G.comps.LIB.champ,G.comps.UCL.champ],ko:{rounds:[],cur:0},byes:[],sc:{},champ:null};G.comps.MUN=c;
    addRound(c,[G.comps.LIB.champ,G.comps.UCL.champ],'Final',[MUN_WEEK],true);news(`Mundial de Clubes: ${team(G.comps.LIB.champ).n} x ${team(G.comps.UCL.champ).n} decidem o título no fim da temporada.`)}}
function setChamp(c,tid){c.champ=tid;const t=team(tid);let pr=0;if(c.type==='C')pr=CONT[c.id].prize[3];else if(c.id==='MUN')pr=100e6;else pr=t.inc*4;t.cash+=pr;
  news(`${t.n} é campeão da ${c.name} ${G.year}!`);if(tid===G.coach.club){ledger(`Prêmio de campeão · ${c.name}`,pr);trophy(c)}}
function trophy(c){const t=myTeam();const repG=c.id==='MUN'?10:c.type==='C'?(CONT[c.id].after?6:12):c.type==='L'?Math.round(4+6*Math.min(1,LG[c.id].w)):4;
  G.coach.troph.push({y:G.year,c:c.name,t:t.n});G.coach.rep=clamp(G.coach.rep+repG,0,100);G.board=clamp(G.board+(c.type==='L'?25:15),0,100);G.fans=clamp(G.fans+20,0,100);
  const cur=G.coach.hist[G.coach.hist.length-1];if(cur)(cur.tt||(cur.tt=[])).push(c.name);
  pushModal(()=>showModal(`<p class="lbl">${esc(c.name)} · ${G.year}</p><div class="headline">É campeão! ${esc(t.n)} levanta a taça</div>
   <p>A torcida invade as ruas. A diretoria fala em renovação e a imprensa já trata ${esc(G.coach.name)} como um dos grandes nomes do momento.</p>
   <div class="fx"><span class="chip grn">Reputação +${repG}</span><span class="chip grn">Diretoria +${c.type==='L'?25:15}</span><span class="chip grn">Torcida +20</span></div>
   <div class="row" style="margin-top:16px"><button class="btn pri" onclick="nextModal()">Comemorar</button></div>`))}

/* ---------------- DIA A DIA ---------------- */
function userFixToday(){if(!G.coach.club)return null;for(const id of G.dayFix[G.day]||[]){const f=G.fix[id];if(!f.pl&&(f.h===G.coach.club||f.a===G.coach.club))return f}return null}
function nextUserFix(){if(!G.coach.club)return null;for(let d=G.day;d<2*W;d++)for(const id of G.dayFix[d]||[]){const f=G.fix[id];if(!f.pl&&(f.h===G.coach.club||f.a===G.coach.club))return f}return null}
function processDay(){const d=G.day;for(const id of G.dayFix[d]||[]){const f=G.fix[id];if(!f.pl)simFixture(f)}afterDay(d)}
function afterDay(d){advanceComps();
  for(const p of Object.values(G.players)){if(p.fit<100)p.fit=Math.min(100,p.fit+11);if(p.inj>0)p.inj--}
  if(d%2===0)weekly(weekOf(d));
  G.day++;if(G.day>=2*W)endSeason();save()}
function weekly(w){const inWin=isWindow(w);const me=G.coach.club;
  for(const t of Object.values(G.teams)){const pr=payroll(t);const op=Math.round(pr*.12);t.cash+=t.inc-pr-op;if(t.id===me){ledger('Patrocínio e TV',t.inc);ledger('Folha salarial',-pr);ledger('Custos operacionais',-op)}}
  for(const t of Object.values(G.teams)){if(t.id===me||!t.coach)continue;if(w>3&&t.cc<15&&R()<.5)fireAI(t)}
  G.vac=G.vac.filter(v=>{if(v.until<=G.day||team(v.t).id===me){if(team(v.t).id!==me){const t=team(v.t);t.coach=coachName(t.lg);t.cc=62;news(`${t.n} anuncia ${t.coach} como novo técnico.`)}return false}return true});
  if(inWin){aiTransfers();userBids()}else G.inbox.forEach(m=>{if(m.act&&m.act.type==='bid'&&!m.done){m.done=true;m.res='Expirou com o fechamento da janela'}});
  for(const t of Object.values(G.teams))if(t.id!==me&&t.sq.length<19)fillSquad(t);
  if(me){const t=myTeam();
    if(w>=8&&w%4===0&&G.obj){const pos=standings(G.comps[t.lg].tb).indexOf(t.id)+1;if(pos>G.obj.target+4){G.board=clamp(G.board-3,0,100);mail('Diretoria','Campanha abaixo da meta',`Estamos em ${pos}º, longe da meta (${G.obj.text}). Esperamos reação imediata.`)}else if(pos<=G.obj.target)G.board=clamp(G.board+1,0,100)}
    if(t.cash<0){G.board=clamp(G.board-2,0,100);if(w%4===0)mail('Diretoria financeira','Caixa no vermelho',`O clube está com saldo de ${money(t.cash)}. Corte salários ou venda jogadores.`)}
    if(w===28){const exp=t.sq.map(i=>G.players[i]).filter(p=>p.ct<=1);if(exp.length)mail('Departamento de futebol','Contratos terminando',`Terminam ao fim da temporada: ${exp.map(p=>p.n).join(', ')}. Renove pela ficha do jogador ou eles sairão de graça.`)}
    if(w>=4&&G.board>58&&R()<.035){const v=G.vac.map(v=>team(v.t)).filter(x=>x.r>t.r+1&&x.r<=repCap()&&!G.offered[x.id]);if(v.length){const x=pick(v);G.offered[x.id]=1;jobOffer(x,true)}}
    checkFire()}
  else{const fits=G.vac.map(v=>team(v.t)).filter(x=>x.r<=repCap()&&!G.offered[x.id]);
    if(fits.length&&R()<.55){const x=pick(fits);G.offered[x.id]=1;jobOffer(x)}
    else if(R()<.35){const cand=Object.values(G.teams).filter(x=>x.r<=repCap()&&x.r>=repCap()-12&&x.coach&&x.cc<45);if(cand.length){const x=pick(cand);fireAI(x);G.offered[x.id]=1;jobOffer(x)}}}}
function repCap(){return 58+G.coach.rep*.33}
function fireAI(t){news(`${t.n} demite o técnico ${t.coach} após sequência ruim.`);t.coach=null;t.cc=55;G.vac.push({t:t.id,until:G.day+(G.coach.club?4:8)})}
function fillSquad(t){const free=Object.values(G.players).filter(p=>!p.t&&p.o<=t.r+2).sort((a,b)=>b.o-a.o);
  while(t.sq.length<20){const counts={};t.sq.forEach(i=>{const p=G.players[i];counts[p.p]=(counts[p.p]||0)+1});const need=TEMPLATE.find(([pos,n])=>(counts[pos]||0)<n);const pos=need?need[0]:pick(POS);
    const idx=free.findIndex(p=>p.p===pos);if(idx>=0&&R()<.6){const p=free.splice(idx,1)[0];p.t=t.id;t.sq.push(p.id);p.ct=ri(1,3);p.sal=wage(p.o,LG[t.lg].w)}
    else newPlayer(pos,t.r-ri(6,14),ri(17,20),pickNat(LG[t.lg]),t.id,LG[t.lg].w)}}

let KC={d:-1,m:{}};function keySet(tid){const k=G.year*1000+G.day;if(KC.d!==k)KC={d:k,m:{}};return KC.m[tid]||(KC.m[tid]=new Set(autoLineup(tid,team(tid).form).map(s=>s.id)))}
function isKey(p){return !!p.t&&keySet(p.t).has(p.id)}
function askPrice(p){if(!p.t)return 0;let f=1.15+(isKey(p)?.35:0)-(p.ct<=1?.35:0);return Math.max(Math.round(p.val*.5),Math.round(p.val*f/1e4)*1e4)}
function wageDemand(p,t){return Math.round(Math.max(p.sal*1.15,wage(p.o,LG[t.lg].w))*(p.t?1.1:1)/100)*100}
function doTransfer(p,to,fee,sal){const from=p.t?team(p.t):null;if(from){from.sq=from.sq.filter(i=>i!==p.id);from.cash+=fee;if(from.id===G.coach.club){ledger(`Venda de ${p.n}`,fee);G.lineup=G.lineup.filter(i=>i!==p.id)}}
  to.cash-=fee;if(to.id===G.coach.club&&fee)ledger(`Compra de ${p.n}`,-fee);p.t=to.id;to.sq.push(p.id);p.sal=sal||wage(p.o,LG[to.lg].w);p.ct=ri(2,5);p.sale=0;p.mor=clamp(p.mor+10,0,100)}
function aiTransfers(){const all=Object.values(G.players);const teams=Object.values(G.teams);
  for(let k=0;k<14;k++){const buyer=pick(teams);if(buyer.id===G.coach.club||buyer.sq.length>=28)continue;const lu=autoLineup(buyer.id,buyer.form);if(!lu.length)continue;
    let weak=null;for(const s of lu){const p=G.players[s.id];if(!weak||p.o<weak.o)weak={o:p.o,pos:s.pos}}
    let best=null;for(let j=0;j<260;j++){const p=pick(all);if(p.p!==weak.pos||p.t===buyer.id||p.a>31||p.o<=weak.o+2||p.o>buyer.r+5)continue;const fee=askPrice(p);if(fee>buyer.cash*.6)continue;if(p.t&&team(p.t).sq.length<=18)continue;if(!best||p.o>best.o)best=p}
    if(!best)continue;const fee=askPrice(best);
    if(G.coach.club&&best.t===G.coach.club){if(!G.inbox.some(m=>m.act&&m.act.type==='bid'&&m.act.p===best.id&&!m.done))bidMail(best,buyer,Math.round(best.val*(.95+R()*.35)/1e4)*1e4);continue}
    const from=best.t?team(best.t).n:null;doTransfer(best,buyer,fee);if(best.o>=74)news(from?`${buyer.n} contrata ${best.n} (${best.p}, ${best.o}) junto ao ${from} por ${money(fee)}.`:`${buyer.n} acerta com ${best.n} (${best.p}, ${best.o}), que estava sem clube.`)}}
function userBids(){const t=myTeam();if(!t)return;const ps=t.sq.map(i=>G.players[i]);let done=0;
  for(const p of shuffle(ps)){if(done)break;const prob=.0016*Math.max(0,p.o-55)/2+(p.sale?.12:0);if(R()>=prob)continue;
    const bidders=Object.values(G.teams).filter(x=>x.id!==t.id&&x.r>=p.o-6&&x.cash>p.val);if(!bidders.length)continue;const b=pick(bidders);
    if(G.inbox.some(m=>m.act&&m.act.type==='bid'&&m.act.p===p.id&&!m.done))continue;bidMail(p,b,Math.round(p.val*(p.sale?.8+R()*.25:.95+R()*.4)/1e4)*1e4);done++}}
function bidMail(p,b,amt){mail(b.n,`Proposta por ${p.n}`,`O ${b.n} oferece ${money(amt)} pelo ${POSN[p.p].toLowerCase()} ${p.n} (${p.o}). Valor de mercado: ${money(p.val)}.`,{type:'bid',p:p.id,from:b.id,amt});toast(`Proposta do ${b.n} por ${p.n}`)}

function setObjective(){const t=myTeam();const ids=leagueTeams(t.lg).sort((a,b)=>b.r-a.r).map(x=>x.id);const rank=ids.indexOf(t.id)+1,n=ids.length;const lg=LG[t.lg];
  const c1=lg.conf==='SA'?'LIB':'UCL',c2=lg.conf==='SA'?'SUL':'UEL';const s1=CONT[c1].slots[t.lg]||0,s2=CONT[c2].slots[t.lg]||0;let target,text;
  if(t.lg==='BRA2'){if(rank<=4){target=4;text='Conquistar o acesso à Série A'}else if(rank<=9){target=8;text='Brigar pelo acesso (até o 8º lugar)'}else{target=15;text='Fazer campanha segura (até o 15º)'}}
  else if(rank<=2){target=2;text='Brigar pelo título (top 2)'}

const meterCol=v=>v>=60?'var(--green)':v>=35?'var(--amber)':'var(--red)';
function checkFire(){if(!G.coach.club)return;const cur=G.coach.hist[G.coach.hist.length-1];const games=cur?cur.j:0;
  if(G.board<25&&!G.warned&&games>=3){G.warned=true;mail('Presidente','Ultimato',`A situação é insustentável. Precisamos de resultados nos próximos jogos ou teremos que tomar uma decisão.`);toast('A diretoria deu um ultimato.')}

function userResult(f){const home=f.h===G.coach.club;const gf=home?f.hg:f.ag,ga=home?f.ag:f.hg;const opp=home?f.a:f.h;return {home,gf,ga,opp,res:gf>ga?'win':gf<ga?'loss':'draw'}}
function postUserMatch(f,live){f.ut=G.coach.club;const u=userResult(f);const c=G.comps[f.c];const tie=tieOf(f);const derby=isDerby(f.h,f.a);
  const e=expectS(f.h,f.a,f.neu),eu=u.home?e:1-e;const s=u.res==='win'?1:u.res==='draw'?.5:0;
  const wgt=c.type==='L'?1:c.type==='K'?1.3:1.6;const fin=tie&&c.ko.rounds[f.ri].name==='Final'?2:1;
  const cur0=G.coach.hist[G.coach.hist.length-1];const honey=cur0&&cur0.j<5?.5:1;const dd=s-eu;
  let db=dd*(dd>0?9:6.5*honey)*wgt*fin,df=dd*(dd>0?11:8*honey)*wgt*fin*(derby?1.6:1);const mg=u.gf-u.ga;if(mg>=3)df+=2;if(mg<=-3){df-=3;db-=2}
  if(G.promise&&G.promise.f===f.id){if(s<1){db-=3;df-=4}else df+=2;G.promise=null}
  if(tie&&tie.w!=null&&(tie.loser===G.coach.club)){const opR=team(u.opp).r,myR=myTeam().r;const k=opR>myR+5?.4:1;db-=3*wgt*k;df-=4*wgt*k}
  if(G.fans<25)db-=1.5;
  db+=(52-G.board)*.02;
  G.board=clamp(G.board+db,0,100);G.fans=clamp(G.fans+df,0,100);
  G.streak=s===1?Math.max(1,G.streak+1):s===0?Math.min(-1,G.streak-1):0;
  const cur=G.coach.hist[G.coach.hist.length-1];G.coach.j++;cur.j++;if(s===1){G.coach.v++;cur.v++}else if(s===0){G.coach.d++;cur.d++}else{G.coach.e++;cur.e++}
  if(s===1&&team(u.opp).r>myTeam().r+3)G.coach.rep=clamp(G.coach.rep+.5,0,100);
  const ctx=pressCtx(f,u,derby,tie);ctx.db=db;ctx.df=df;
  if(!live)pushModal(()=>summaryModal(f));
  if(derby||tie||Math.abs(mg)>=3||G.board<35||R()<.42)pushModal(()=>pressModal('post',ctx,()=>nextModal()));
  pushModal(()=>fansModal(f,ctx));
  const d=G.day;pushModal(()=>resultsModal(d,f));
  processDay();checkFire();render()}
function pressCtx(f,u,derby,tie){const t=myTeam();const rt=f.rt||{};const mine=Object.keys(rt).map(Number).filter(id=>G.players[id]&&G.players[id].t===t.id);
  const best=mine.sort((a,b)=>rt[b]-rt[a])[0],worst=mine.slice().sort((a,b)=>rt[a]-rt[b])[0];const sc=(f.gl||[]).filter(g=>(g[2]===0)===u.home).map(g=>g[1]);
  return {team:t,f,u,derby,tie,opp:team(u.opp).n,score:`${u.gf} x ${u.ga}`,best:best&&G.players[best],worst:worst&&G.players[worst],scorer:sc.length?G.players[sc[0]]:null}}

    const tgt=G.obj.target;let db;if(pos<=tgt){db=15+(tgt-pos)*2;G.coach.rep=clamp(G.coach.rep+3,0,100)}else{db=-Math.min(35,12*(pos-tgt));G.coach.rep=clamp(G.coach.rep-3,0,100)}

  const free=Object.values(G.players).filter(p=>!p.t).sort((x,y)=>y.o-x.o);free.slice(350).forEach(p=>delete G.players[p.id]);free.filter(p=>p.a>34).forEach(p=>delete G.players[p.id]);
  for(const t of Object.values(G.teams)){const lg=LG[t.lg];const yth=[];for(let i=0;i<2;i++)yth.push(newPlayer(pick(POS),t.r-ri(10,18),ri(16,18),lg.country,t.id,lg.w));

    if(R()<.045/90){const x=pick(S.slots);L.ev.push({k:'r',s,m,p:x.id});L.st.r[s]++;liveLine('card-r',`VERMELHO DIRETO! ${G.players[x.id].n} (${tn(s)}) está expulso.`);sendOff(s,x.id)}

  if(R()<.05)liveLine('meta',fill(pick(LINES.atm),{h:team(L.f.h).n,t:tn(R()<.5?0:1)}));
  const ai=1-L.us;if([60,70,79].includes(m))aiSub(ai);
  if(m===45&&!L.half){L.half=true;L.paused=true;clearInterval(L.timer);liveLine('meta',`Fim do primeiro tempo: ${L.g[0]} x ${L.g[1]}.`);return}
  if(m>=90+L.extra){endLive()}}
function sendOff(s,id){const S=LM.sides[s];const sl=S.slots.find(x=>x.id===id);if(sl){S.mins[id]=LM.min-(sl.in||0);S.slots=S.slots.filter(x=>x.id!==id)}liveLam()}
function injOut(s,sl){const S=LM.sides[s];if(S.subs<5&&S.bench.length){const cand=S.bench.map(i=>G.players[i]).sort((a,b)=>pscore(b)*fitPos(b.p,sl.pos)-pscore(a)*fitPos(a.p,sl.pos))[0];doSub(s,sl.id,cand.id,true)}else sendOff(s,sl.id)}
function doSub(s,outId,inId,auto){const S=LM.sides[s];const sl=S.slots.find(x=>x.id===outId);if(!sl||S.subs>=5)return false;S.mins[outId]=LM.min-(sl.in||0);sl.id=inId;sl.in=LM.min;S.bench=S.bench.filter(i=>i!==inId);S.off[outId]=1;S.played.add(inId);S.subs++;
  liveLine('meta',`${auto?'Substituição forçada':'Substituição'} no ${team(S.tid).n}: sai ${G.players[outId].n}, entra ${G.players[inId].n}.`);liveLam();return true}
function aiSub(s){const S=LM.sides[s];if(S.subs>=5||!S.bench.length)return;const fat=liveFat(S);const tired=S.slots.filter(x=>x.pos!=='GOL').sort((a,b)=>fat(a)-fat(b))[0];if(!tired)return;
  const cand=S.bench.map(i=>G.players[i]).filter(p=>p.p!=='GOL').sort((a,b)=>pscore(b)*fitPos(b.p,tired.pos)-pscore(a)*fitPos(a.p,tired.pos))[0];if(cand)doSub(s,tired.id,cand.id)}
function endLive(){const L=LM;L.over=true;clearInterval(L.timer);liveLine('meta',`Fim de jogo: ${team(L.f.h).n} ${L.g[0]} x ${L.g[1]} ${team(L.f.a).n}.`);
  if(needsPens(L.f,L.g[0],L.g[1])){const pen=[0,0];const takers=L.sides.map(S=>S.slots.slice().sort((a,b)=>G.players[b.id].o-G.players[a.id].o));liveLine('meta','Disputa de pênaltis!');
    let k=0;const kick=s=>{const ts=takers[s];const p=G.players[ts[k%ts.length].id];const ok=R()<.76;if(ok)pen[s]++;liveLine(ok?'':'card-r',`${team(L.sides[s].tid).n}: ${p.n} ${ok?'converte':'desperdiça'} (${pen[0]} x ${pen[1]})`)};
    for(;k<5;k++){kick(0);kick(1)}while(pen[0]===pen[1]){kick(0);kick(1);k++}L.pen=pen;liveLine('goal',`${team(L.sides[pen[0]>pen[1]?0:1].tid).n} vence nos pênaltis por ${pen[0]} x ${pen[1]}!`)}
  updLive()}
function liveFinish(){const L=LM;const res={hg:L.g[0],ag:L.g[1],ev:L.ev,pl:L.sides.map(S=>[...S.played]),mins:{},pen:L.pen,press:L.sides.map(S=>S.press)};
  L.sides.forEach(S=>{for(const s of S.slots)S.mins[s.id]=(S.mins[s.id]??0)+(90-(s.in||0));Object.assign(res.mins,S.mins)});
  const f=L.f;finalize(f,res);
  const sl=L.sides[L.us];G.style=sl.style;G.press=sl.press;LM=null;UI.tab='painel';postUserMatch(f,true)}

    <span class="lbl">Velocidade</span>${['1x','2x','4x'].map((s,i)=>`<button class="btn sm ${L.speed===i?'pri':''}" onclick="A.liveSpeed(${i})">${s}</button>`).join('')}<button class="btn sm" onclick="A.liveEnd()">Ir ao fim ⏭</button>`}</div>
   <div class="split"><div class="card"><h3>Lance a lance</h3><div class="feed">${L.feed.map(x=>`<div class="${x.cls}"><span class="m">${x.m>90?'90+'+(x.m-90):x.m}'</span>${esc(x.txt)}</div>`).join('')}</div></div>
   <div class="card"><h3>Seu time</h3>${L.over?'':`<div class="row" style="margin-bottom:10px"><div class="field"><label class="lbl" for="lstyle">Postura</label><select id="lstyle" onchange="A.lStyle(this.value)">${STYLES.map((s,i)=>`<option value="${i}" ${i===me.style?'selected':''}>${s}</option>`).join('')}</select></div><label class="row" style="gap:6px;margin-top:16px"><input type="checkbox" id="lpress" ${me.press?'checked':''} onchange="A.lPress(this.checked)"> Pressão</label><span class="sp"></span><span class="chip">${me.subs}/5 trocas</span></div>`}
    <p class="muted" style="font-size:12px;margin:0 0 6px">${L.over?'':L.subOut?'Agora escolha quem entra no banco.':'Toque em “trocar” para substituir um jogador.'}</p>
    <table>${me.slots.map(s=>{const p=G.players[s.id];const fv=Math.round(fat(s));return `<tr class="${L.subOut===s.id?'me':''}"><td>${posB(s.pos)}</td><td>${esc(p.n)}${L.ev.some(e=>e.p===s.id&&e.k==='g')?' ⚽':''}${L.ev.some(e=>e.p===s.id&&e.k==='y')?' <span class="chip amb">A</span>':''}</td><td>${barH(fv)}</td><td>${!L.over&&me.subs<5?`<button class="btn sm" onclick="A.subOut(${s.id})">${L.subOut===s.id?'cancelar':'trocar'}</button>`:''}</td></tr>`}).join('')}</table>
    ${L.subOut&&!L.over?`<div class="chalkline"></div><span class="lbl">Banco</span><table>${me.bench.map(id=>{const p=G.players[id];return `<tr><td>${posB(p.p)}</td><td>${esc(p.n)} ${ovr(p.o)}</td><td>${barH(p.fit)}</td><td><button class="btn sm pri" onclick="A.subIn(${id})">entrar</button></td></tr>`}).join('')}</table>`:''}</div></div>`}
function updLive(){const el=$('#live');if(el)el.innerHTML=liveHtml();else render()}

/* ---------------- MODAIS DE JOGO ---------------- */
function summaryModal(f){const t=team(f.ut||G.coach.club);const rt=f.rt||{};const mine=Object.keys(rt).map(Number).filter(id=>G.players[id]&&G.players[id].t===t.id).sort((a,b)=>rt[b]-rt[a]);
  showModal(`<span class="lbl">${esc(compLabel(f))}</span><div class="vs" style="margin:14px 0"><div class="t">${crest(team(f.h),44)}<b>${esc(team(f.h).n)}</b></div><div class="score" style="font-size:52px">${f.hg} : ${f.ag}</div><div class="t">${crest(team(f.a),44)}<b>${esc(team(f.a).n)}</b></div></div>
   ${f.pen?`<p style="text-align:center" class="mono">Pênaltis: ${f.pen[0]} x ${f.pen[1]}</p>`:''}
   <p class="muted" style="text-align:center">${(f.gl||[]).map(g=>`${G.players[g[1]]?esc(G.players[g[1]].n):'?'} ${g[0]}'`).join(' · ')||'Sem gols'}</p>
   <h3 style="margin:12px 0 6px">Notas</h3><div style="columns:2 200px;font-size:13px">${mine.map(id=>`<div>${posB(G.players[id].p)} ${esc(G.players[id].n)} <b class="mono">${rt[id].toFixed(1)}</b></div>`).join('')}</div>
   <div class="row" style="margin-top:16px"><button class="btn pri" onclick="nextModal()">Continuar</button></div>`)}
function resultsModal(d,uf){const cids=new Set([uf.c]);const t=team(uf.ut);if(t&&G.comps[t.lg])cids.add(t.lg);const fs=(G.dayFix[d]||[]).map(id=>G.fix[id]).filter(f=>cids.has(f.c)&&f.id!==uf.id);
  if(!fs.length){nextModal();return}const by={};fs.forEach(f=>(by[f.c]||(by[f.c]=[])).push(f));
  showModal(`<span class="lbl">Outros resultados · ${fmtDate(d,true)}</span>${Object.entries(by).map(([c,l])=>`<h3 style="margin:12px 0 6px">${esc(G.comps[c].name)}</h3>${l.map(f=>`<div class="row" style="flex-wrap:nowrap;padding:4px 0;border-bottom:1px solid var(--line);font-size:13px"><span class="sp" style="text-align:right;min-width:0">${esc(team(f.h).n)}</span><b class="mono" style="min-width:70px;text-align:center">${scoreTxt(f)}</b><span class="sp" style="min-width:0">${esc(team(f.a).n)}</span></div>`).join('')}`).join('')}
   <div class="row" style="margin-top:16px"><button class="btn pri" onclick="nextModal()">Fechar</button><button class="btn" onclick="UI.comp='${uf.c}';UI.tab='tabelas';nextModal()">Ver tabela</button></div>`)}
function preMatchModal(f){const t=myTeam();const o=team(f.h===t.id?f.a:f.h);const slots=userSlots(true);const S=strength(slots,G.style,G.press);const inj=t.sq.map(i=>G.players[i]).filter(p=>p.inj||p.sus);
  showModal(`<span class="lbl">Dia de jogo · ${esc(compLabel(f))}</span><div class="vs" style="margin:14px 0"><div class="t">${crest(team(f.h),48)}<b>${esc(team(f.h).n)}</b></div><div class="score" style="font-size:30px">x</div><div class="t">${crest(team(f.a),48)}<b>${esc(team(f.a).n)}</b></div></div>
   <p class="muted">${esc(G.form)} · ${STYLES[G.style]}${G.press?' · pressão alta':''} · defesa ${Math.round(S.def)}, meio ${Math.round(S.mid)}, ataque ${Math.round(S.att)}. Adversário: força ${o.r}.</p>
   ${G.rot&&G.rot.length?`<p class="muted" style="font-size:13px">Poupados pelo auxiliar: ${G.rot.map(([a,b])=>`${esc(G.players[a].n)} → ${esc(G.players[b].n)}`).join(', ')}</p>`:''}
   ${inj.length?`<p class="muted" style="font-size:13px">Desfalques: ${inj.map(p=>esc(p.n)+(p.inj?' (lesão)':' (suspenso)')).join(', ')}</p>`:''}
   <div class="row" style="margin-top:14px"><button class="btn pri big" onclick="A.watch()">Assistir ao vivo ▶</button><button class="btn" onclick="A.quick()">Resultado rápido</button><button class="btn" onclick="closeModal();MQ.length=0;A.tab('elenco')">Ajustar escalação</button></div>`)}

/* ---------------- FICHAS ---------------- */
function playerModal(id){const p=G.players[id];if(!p){toast('Jogador não encontrado.');return}const t=myTeam();const mine=t&&p.t===t.id;const pt=p.t?team(p.t):null;
  const avg=p.st.j?(p.st.rt/p.st.j).toFixed(1):'–';const potTxt=mine?p.pot:`${Math.max(p.o,p.pot-ri(2,4))}–${Math.min(95,p.pot+ri(1,4))}`;
  let act='';
  if(mine){const dem=wageDemand(p,t);act=`<div class="chalkline"></div><div class="row">
     <button class="btn" onclick="A.toggleSale(${p.id})">${p.sale?'Tirar da lista de venda':'Colocar à venda'}</button>
     <button class="btn" onclick="A.renew(${p.id})">Renovar (+2 anos, ${money(dem)}/sem)</button>
     <button class="btn red" onclick="A.release(${p.id})">Rescindir (${money(Math.round(p.sal*26*Math.max(1,p.ct)*.5))})</button></div><div id="pmsg" class="muted" style="margin-top:8px"></div>`}
  else if(t){const ask=askPrice(p),dem=wageDemand(p,t);const open=isWindow(weekOf(G.day))||!p.t;
    act=`<div class="chalkline"></div><h3 style="margin-bottom:8px">Fazer proposta</h3>${open?`<div class="row" style="align-items:flex-end">${p.t?`<div class="field"><label class="lbl" for="ofee">Valor (R$ mi)</label><input id="ofee" type="number" step="0.1" min="0" value="${(ask/1e6).toFixed(1)}" style="width:120px"></div>`:''}
     <div class="field"><label class="lbl" for="osal">Salário/sem (R$ mil)</label><input id="osal" type="number" step="1" min="1" value="${Math.round(dem/1e3)}" style="width:120px"></div><button class="btn pri" onclick="A.offer(${p.id})">Enviar proposta</button></div>
     <p class="muted" style="font-size:12px">${p.t?`Pedida estimada do ${esc(pt.n)}: ${money(ask)}.`:'Jogador livre: sem custo de transferência.'} Seu caixa: ${money(t.cash)}.</p>`:'<p class="muted">A janela de transferências está fechada. Volte na próxima janela (semanas 1–7 e 20–24).</p>'}<div id="pmsg" style="margin-top:8px"></div>`}
  showModal(`<div class="row">${pt?crest(pt,40):''}<div class="sp" style="min-width:0"><span class="lbl">${POSN[p.p]} · ${p.nat} · ${p.a} anos</span><h2>${esc(p.n)}</h2><span class="muted">${pt?esc(pt.n):'Sem clube'}</span></div><div style="text-align:center"><div class="score" style="font-size:52px">${p.o}</div><span class="lbl">pot. ${potTxt}</span></div></div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(130px,1fr));margin-top:14px;gap:10px">
    ${[['Valor',money(p.val)],['Salário',money(p.sal)+'/sem'],['Contrato',p.t?p.ct+' ano(s)':'–'],['Condição',p.fit+'%'],['Moral',p.mor],['Jogos',p.st.j],['Gols',p.st.g],['Assist.',p.st.a],['Nota média',avg],['Status',p.inj?'Lesionado':p.sus?'Suspenso':'Disponível']].map(([k,v])=>`<div class="stat"><span class="lbl">${k}</span><span class="v">${v}</span></div>`).join('')}</div>
   ${act}<div class="row" style="margin-top:16px"><button class="btn" onclick="A.closeModal()">Fechar</button></div>`)}
function teamModal(id){const t=team(id);const ps=t.sq.map(i=>G.players[i]).sort((a,b)=>POS.indexOf(a.p)-POS.indexOf(b.p)||b.o-a.o);
  showModal(`<div class="row">${crest(t,46)}<div class="sp"><span class="lbl">${esc(LG[t.lg].name)} · força ${t.r}</span><h2>${esc(t.n)}</h2><span class="muted">Técnico: ${esc(t.coach||'interino')} · estádio ${fmtInt(t.cap)} lugares</span></div></div>
   <div class="tbl" style="margin-top:12px"><table><tr><th>Pos</th><th>Jogador</th><th class="n">Idade</th><th class="n">Força</th><th class="n">G</th><th class="n">Valor</th></tr>${ps.map(p=>`<tr class="click" onclick="A.player(${p.id})"><td>${posB(p.p)}</td><td>${esc(p.n)}</td><td class="n">${p.a}</td><td class="n">${ovr(p.o)}</td><td class="n">${p.st.g}</td><td class="n">${money(p.val)}</td></tr>`).join('')}</table></div>
   <div class="row" style="margin-top:16px"><button class="btn" onclick="A.closeModal()">Fechar</button></div>`)}

/* ---------------- AÇÕES ---------------- */
const A={
 tab(k){UI.tab=k;render();window.scrollTo(0,0)},
 lgPick(l){UI.lgPick=l;render()},
 startClub(lg,i){const nm=($('#cname')?.value||'').trim()||'Professor';buildWorld(nm);const t=leagueTeams(lg)[i];G.coach.rep=clamp(Math.round(30+Math.max(0,t.r-60)*.8),25,60);takeJob(t.id);save();render()},
 startUnemployed(){const nm=($('#cname')?.value||'').trim()||'Professor';buildWorld(nm);G.coach.rep=28;const cap=repCap();
   const cand=shuffle(Object.values(G.teams).filter(t=>t.r<=cap&&t.r>=cap-9)).slice(0,3);cand.forEach(t=>{fireAI(t);G.offered[t.id]=1;mail(`Presidente do ${t.n}`,`Proposta para treinar o ${t.n}`,`Queremos você no comando do ${t.n} (${LG[t.lg].name}).`,{type:'job',t:t.id})});
   save();render();pushModal(()=>offerModal(cand.map(t=>t.id),'Três clubes procuram técnico'))},
 loadGame(){if(load()){UI.tab='painel';render()}else toast('Não foi possível carregar o jogo salvo.')},
 saveNow(){save();toast('Carreira salva neste navegador.')},
 cont(){if(modalOpen)return;if(LM){UI.tab='jogo';render();return}const f=userFixToday();if(!f){processDay();if(!G.coach.club&&!modalOpen&&G.day%2)processDay();render();return}
   const ctx={f,opp:team(f.h===G.coach.club?f.a:f.h).n,derby:isDerby(f.h,f.a),ko:f.ti!=null};const doPre=ctx.derby||ctx.ko||G.board<35||R()<.3;
   if(doPre)pushModal(()=>pressModal('pre',ctx,()=>nextModal()));pushModal(()=>preMatchModal(f))},
 skip(){if(modalOpen)return;let n=0;while(n<12&&!modalOpen&&G.coach.club&&!userFixToday()){processDay();n++}render();if(!modalOpen&&userFixToday())toast('Dia de jogo! Confira a escalação e clique em Jogar.')},
 watch(){const f=userFixToday();closeModal();MQ.length=0;if(f)startLive(f)},
 quick(){const f=userFixToday();closeModal();MQ.length=0;if(!f)return;simFixture(f);postUserMatch(f,false)},
 livePause(){LM.paused=true;clearInterval(LM.timer);updLive()},
 livePlay(){LM.paused=false;liveTimer();updLive()},
 liveSpeed(i){LM.speed=i;liveTimer();updLive()},
 liveEnd(){LM.paused=false;clearInterval(LM.timer);let g=0;while(!LM.over&&g++<200){if(LM.paused){LM.paused=false}liveMinute()}updLive()},
 liveFinish(){liveFinish()},
 lStyle(v){LM.sides[LM.us].style=+v;liveLam();liveLine('meta',`O técnico muda a postura para: ${STYLES[+v]}.`);updLive()},
 lPress(v){LM.sides[LM.us].press=v?1:0;liveLam();updLive()},
 subOut(id){LM.subOut=LM.subOut===id?null:id;updLive()},
 subIn(id){if(LM.subOut){doSub(LM.us,LM.subOut,id);LM.subOut=null}updLive()},
 setForm(v){G.form=v;render()}, setRot(v){G.autoRot=!!v;render()}, setStyle(v){G.style=+v;render()}, setPress(v){G.press=v?1:0;render()},
 autoXI(){G.lineup=autoLineup(G.coach.club,G.form).map(s=>s.id);render()},
 toggleXI(id){if(G.lineup.includes(id))G.lineup=G.lineup.filter(i=>i!==id);else{if(G.lineup.length>=11){toast('Já há 11 titulares. Desmarque alguém primeiro.');render();return}G.lineup.push(id)}render()},
 openComp(id){UI.comp=id;UI.tab='tabelas';render()},
 teamView(id){teamModal(id)},
 player(id){playerModal(id)},
 closeModal(){if(MQ.length)nextModal();else{closeModal();render()}},
 mk(k,v){UI.mk[k]=v;render()},
 openMsg(id){UI.msg=id;const m=G.inbox.find(x=>x.id===id);if(m)m.read=true;UI.tab='mensagens';render()},
 msgDone(id,res){const m=G.inbox.find(x=>x.id===id);if(m){m.done=true;m.res=res}render()},
 takeJob(id){closeModal();MQ.length=0;takeJob(id);save();render()},
 acceptBid(mid){const m=G.inbox.find(x=>x.id===mid);const p=G.players[m.act.p];const b=team(m.act.from);if(!p||p.t!==G.coach.club)return;if(myTeam().sq.length<=16){toast('Elenco mínimo de 16 jogadores.');return}
   doTransfer(p,b,m.act.amt);m.done=true;m.res=`Vendido por ${money(m.act.amt)}`;news(`${b.n} contrata ${p.n} junto ao ${myTeam().n} por ${money(m.act.amt)}.`);
   const star=p.o>=myTeam().r+2;if(star){G.fans=clamp(G.fans-6,0,100);toast('A torcida não gostou da venda de um titular.')}else toast('Venda concluída.');render()},
 toggleSale(id){const p=G.players[id];p.sale=p.sale?0:1;playerModal(id)},
 renew(id){const p=G.players[id];const t=myTeam();const dem=wageDemand(p,t);const el=()=>$('#pmsg');
   if(p.mor<35){el().textContent=`${p.n} está insatisfeito e recusou conversar sobre renovação.`;return}if(p.ct>=5){el().textContent='O contrato já está no limite de 5 anos.';return}
   p.sal=dem;p.ct=Math.min(5,p.ct+2);p.mor=clamp(p.mor+8,0,100);playerModal(id);toast(`${p.n} renovou até ${G.year+p.ct}.`)},
 release(id){const p=G.players[id];const t=myTeam();if(t.sq.length<=16){$('#pmsg').textContent='Elenco mínimo de 16 jogadores.';return}const cost=Math.round(p.sal*26*Math.max(1,p.ct)*.5);
   t.cash-=cost;ledger(`Rescisão de ${p.n}`,-cost);t.sq=t.sq.filter(i=>i!==p.id);G.lineup=G.lineup.filter(i=>i!==p.id);p.t=null;p.ct=0;p.sale=0;closeModal();render();toast(`${p.n} foi liberado.`)},
 offer(id){const p=G.players[id];const t=myTeam();const el=$('#pmsg');const fee=p.t?Math.round((+($('#ofee').value)||0)*1e6):0;const sal=Math.round((+($('#osal').value)||0)*1e3);
   if(t.sq.length>=32){el.innerHTML='<span style="color:var(--red)">Elenco cheio (32). Venda ou libere alguém antes.</span>';return}
   if(fee>t.cash){el.innerHTML='<span style="color:var(--red)">Caixa insuficiente para essa proposta.</span>';return}
   if(p.t){const ask=askPrice(p);if(fee<ask){el.innerHTML=fee>=ask*.85?`<span style="color:var(--amber)">O ${esc(team(p.t).n)} recusou, mas aceita negociar por ${money(ask)}.</span>`:`<span style="color:var(--red)">O ${esc(team(p.t).n)} recusou a proposta de imediato.</span>`;return}
     if(team(p.t).sq.length<=17){el.innerHTML=`<span style="color:var(--red)">O ${esc(team(p.t).n)} não quer desfalcar o elenco agora.</span>`;return}}
   const dem=wageDemand(p,t);const gap=p.o-t.r;
   if(gap>12||(gap>6&&sal<dem*1.8)){el.innerHTML=`<span style="color:var(--red)">${esc(p.n)} não tem interesse em jogar no ${esc(t.n)}${gap<=12?' por esse salário. Ele só viria ganhando muito mais':''}.</span>`;return}
   if(sal<dem){el.innerHTML=`<span style="color:var(--amber)">${p.t?'O clube aceitou, mas ':''}${esc(p.n)} pede ${money(dem)} por semana.</span>`;return}
   const from=p.t?team(p.t).n:null;doTransfer(p,t,fee,sal);news(`${t.n} anuncia ${p.n}${from?` (ex-${from}) por ${money(fee)}`:' sem custos'}.`);G.fans=clamp(G.fans+(p.o>=t.r+2?4:1),0,100);
   closeModal();render();toast(`${p.n} é o novo reforço do ${t.n}!`)},
 apply(id){const t=team(id);G.coach.applied[id]=G.day;const ok=t.r<=repCap()?R()<.5:R()<.06;if(ok){G.offered[id]=1;jobOffer(t)}else{mail(`Presidente do ${t.n}`,'Resposta à candidatura','Agradecemos o interesse, mas seguimos com outros nomes.');toast('Candidatura recusada.');render()}},
 resignAsk(){const t=myTeam();showModal(`<span class="lbl">Pedir demissão</span><h2 style="margin:6px 0 10px">Deixar o ${esc(t.n)}?</h2><p class="muted">Sua reputação cai um pouco e você fica sem clube até receber uma nova proposta.</p><div class="row" style="margin-top:14px"><button class="btn red" onclick="A.resign()">Confirmar saída</button><button class="btn" onclick="A.closeModal()">Ficar</button></div>`)},
 resign(){const t=myTeam();const cur=G.coach.hist[G.coach.hist.length-1];if(cur){cur.out='Pediu demissão';cur.pos=standings(G.comps[t.lg].tb).indexOf(t.id)+1}G.coach.rep=clamp(G.coach.rep-2,0,100);t.coach=coachName(t.lg);t.cc=60;news(`${G.coach.name} pede demissão do ${t.n}.`);G.coach.club=null;G.lineup=[];G.offered={};closeModal();UI.tab='carreira';render()},
 answer(k){A_answer(k)}, pressNext(){A_pressNext()}, pressEnd(){A_pressEnd()}
};
var A_answer,A_pressNext,A_pressEnd;
window.A=A;window.nextModal=nextModal;window.closeModal=closeModal;window.MQ=MQ;window.UI=UI;

try{window.claude?.hot?.snapshot?.(()=>({G}))}catch(e){}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data??{});
window.__PT={get G(){return G},processDay,userFixToday,simFixture,postUserMatch,startLive,takeJob,standings,endSeason};
